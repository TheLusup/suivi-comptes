    Charts.line(document.getElementById('ch-immo'), mois.map(m => D.monthLabel(m)), [
      { label: 'Valeur nette', data: v.map((x, i) => x - c[i]) },
      { label: 'Valeur estimée', data: v, dash: [5, 4] },
      { label: 'Capital restant dû', data: c },
    ]);
    const i = lignesAn.findIndex(r => r.a === anneeCourante);
    Charts.stackedBars(document.getElementById('ch-immo-an'), lignesAn.map(r => r.a), [
      { label: 'Capital', data: lignesAn.map(r => r.capital) },
      { label: 'Intérêts', data: lignesAn.map(r => r.interets) },
      { label: 'Assurance', data: lignesAn.map(r => r.assurance) },
    ], { highlight: i });
    if (parMois.length) Charts.barsWithLine(document.getElementById('ch-immo-mois'), mois12.map(m => D.monthLabel(m)),
      { label: 'Logement (votre part)', data: parMois }, { label: 'Votre part de la mensualité', data: mois12.map(() => mensTotale * q) });
  } };
}

/* ---------- Épargne ---------- */
// Cellule colorée selon le signe et l'ampleur d'un rendement (pôles divergents, texte toujours en encre normale).
function cellRendement(p, title = '') {
  if (p == null || !isFinite(p)) return '<td class="num muted">—</td>';
  const force = Math.round(Math.min(Math.abs(p) / 0.06, 1) * 38);
  const col = p >= 0 ? 'var(--div-pos)' : 'var(--div-neg)';
  return `<td class="num heat" style="background:color-mix(in srgb, ${col} ${force}%, transparent)" title="${esc(title)}">${pctSigned(p)}</td>`;
}

function tableRendements(M, ids) {
  const mensuels = F.rendementsMensuels(M, ids);
  const annuels = F.rendementsAnnuels(mensuels);
  const parMois = new Map(mensuels.map(r => [r.mk, r]));
  const annees = [...annuels.keys()].sort().reverse();
  if (!annees.length) return UI.empty('Pas encore assez d’historique (il faut au moins deux relevés mensuels).');
  const noms = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
  const lignes = annees.map(y => {
    const a = annuels.get(y);
    const cells = noms.map((_, i) => { const r = parMois.get(`${y}-${pad(i + 1)}`); return cellRendement(r?.pct, r?.gain != null ? `Gain : ${eurSigned(r.gain)}` : ''); }).join('');
    return `<tr><th scope="row">${y}${y === F.moisCourant().slice(0, 4) ? ' <span class="muted small">(en cours)</span>' : ''}</th>${cells}
      <td class="num strong-cell">${pctSigned(a.indice - 1)}<div class="small">${UI.delta(a.gain)}</div></td></tr>`;
  }).join('');
  return `<div class="table-wrap"><table class="heat-table">
    <thead><tr><th></th>${noms.map(n => `<th class="num">${n}</th>`).join('')}<th class="num">Année</th></tr></thead>
    <tbody>${lignes}</tbody></table></div>
    <p class="small muted">Rendement de chaque mois hors versements ; l’année chaîne les mois (performance « time-weighted »). Survolez une case pour le gain en euros.</p>`;
}

function cartesPositions(M, compte, today, state, ouvert = false) {
  const cm = F.moisCourant();
  const lignes = F.positionsAt(M, compte.id, today).filter(p => p.quantite > 0);
  if (!lignes.length) return '';
  const total = lignes.reduce((s, p) => s + p.quantite * p.cours, 0);
  const dPrev = D.endOfMonth(D.addMonths(cm, -1)), dYtd = (Number(cm.slice(0, 4)) - 1) + '-12-31', d12 = D.endOfMonth(D.addMonths(cm, -12));
  const varDepuis = (p, d) => { const c0 = F.coursAt(M, compte.id, p.titre, d); return c0 ? p.cours / c0 - 1 : null; };
  let pvTotal = 0, coutTotal = 0, divTotal = 0;
  const avecOps = lignes.some(p => F.historiqueLigne(M, compte.id, p.titre));
  const nbCols = avecOps ? 13 : 11;
  const libOp = { achat: 'Achat', vente: 'Vente', dividende: 'Dividende', attribution: 'Attribution gratuite' };
  const rows = lignes.sort((a, b) => b.quantite * b.cours - a.quantite * a.cours).map((p, i) => {
    const val = p.quantite * p.cours;
    const cout = p.pru != null ? p.quantite * p.pru : null;
    if (cout != null) { pvTotal += val - cout; coutTotal += cout; }
    const h = avecOps ? F.historiqueLigne(M, compte.id, p.titre) : null;
    if (h) divTotal += h.dividendes;
    const debut = h?.depuis ? (h.avantDebut ? `avant le ${D.fmt(h.depuis)}` : D.fmt(h.depuis)) : '—';
    const detail = h ? `<tr class="ligne-detail" id="det-${esc(compte.id)}-${i}" hidden><td colspan="${nbCols}">
      ${h.avantDebut ? `<p class="small muted">Ligne déjà détenue au ${D.fmt(h.depuis)}, début de l’historique des opérations : les achats antérieurs n’y figurent pas.</p>` : ''}
      <table class="ops"><thead><tr><th>Date</th><th>Opération</th><th class="num">Qté</th><th class="num">Prix</th><th class="num">Montant</th></tr></thead>
      <tbody>${h.ops.slice().reverse().map(o => `<tr><td>${D.fmt(o.date)}</td><td>${libOp[o.operation]}</td>
        <td class="num">${o.operation === 'dividende' ? '' : o.quantite.toLocaleString('fr-FR')}</td>
        <td class="num">${o.prix ? eur(o.prix, true) : ''}</td>
        <td class="num">${o.montant ? eurSigned(o.montant) : ''}</td></tr>`).join('') || `<tr><td colspan="5" class="muted">Aucune opération depuis le début de l’historique.</td></tr>`}</tbody></table>
      </td></tr>` : '';
    return `<tr${h ? ` class="ligne-clic" data-detail="det-${esc(compte.id)}-${i}" tabindex="0" title="Afficher les opérations"` : ''}>
      <td>${h ? '<span class="chevron" aria-hidden="true">▸</span> ' : ''}<strong>${esc(p.titre)}</strong>${p.ticker ? ` <span class="muted small">${esc(p.ticker)}</span>` : ''}</td>
      ${avecOps ? `<td class="nowrap">${debut}</td>` : ''}
      <td class="num">${p.quantite.toLocaleString('fr-FR')}</td>
      <td class="num">${p.pru != null ? eur(p.pru, true) : '—'}</td>
      <td class="num">${eur(p.cours, true)}</td>
      <td class="num">${eur(val)}</td>
      <td class="num">${cout != null ? UI.delta(val - cout) : '<span class="muted">—</span>'}</td>
      <td class="num">${cout ? pctSigned(val / cout - 1) : '<span class="muted">—</span>'}</td>
      ${avecOps ? `<td class="num">${h?.dividendes ? eur(h.dividendes) : '<span class="muted">—</span>'}</td>` : ''}
      <td class="num muted">${pct(val / total)}</td>
      <td class="num">${pctSigned(varDepuis(p, dPrev))}</td>
      <td class="num">${pctSigned(varDepuis(p, dYtd))}</td>
      <td class="num">${pctSigned(varDepuis(p, d12))}</td>
    </tr>${detail}`;
  }).join('');

  const mois = D.range(D.addMonths(cm, -11), cm);
  const heat = lignes.map(p => `<tr><th scope="row">${esc(p.titre)}</th>${mois.map(m => {
    const c1 = F.coursAt(M, compte.id, p.titre, F.dateFin(m)), c0 = F.coursAt(M, compte.id, p.titre, D.endOfMonth(D.addMonths(m, -1)));
    return cellRendement(c0 && c1 ? c1 / c0 - 1 : null, c1 ? `Cours : ${eur(c1, true)}` : '');
  }).join('')}</tr>`).join('');

  return `
    ${UI.repli(`lignes-${compte.id}`, `Lignes — ${esc(compte.nom)}`, `<div class="table-wrap"><table>
      <thead><tr><th>Ligne</th>${avecOps ? '<th>1er achat</th>' : ''}<th class="num">Qté</th><th class="num">PRU</th><th class="num">Cours</th><th class="num">Valorisation</th><th class="num">+/- value</th><th class="num">vs PRU</th>${avecOps ? '<th class="num">Dividendes</th>' : ''}<th class="num">Poids</th><th class="num">1 mois</th><th class="num">Depuis 1er janv.</th><th class="num">12 mois</th></tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr><td colspan="${avecOps ? 5 : 4}">Total titres</td><td class="num">${eur(total)}</td><td class="num">${UI.delta(pvTotal)}</td><td class="num">${coutTotal ? pctSigned(pvTotal / coutTotal) : '—'}</td>${avecOps ? `<td class="num">${eur(divTotal)}</td>` : ''}<td colspan="4"></td></tr></tfoot>
      </table></div>
      <p class="small muted">« +/- value » : valorisation moins prix de revient (PRU × quantité). « vs PRU » : cours actuel comparé à votre prix de revient unitaire. Les colonnes 1 mois / 1er janv. / 12 mois comparent les cours (hors dividendes), quelle que soit la date d’achat.
      ${avecOps ? 'Cliquez sur une ligne pour voir ses achats, ventes et dividendes.' : 'Dates d’achat non disponibles pour ce contrat : les versements sont répartis automatiquement entre les fonds.'}</p>`,
      { sub: `${lignes.length} ligne${lignes.length > 1 ? 's' : ''} · ${eur(total)} · relevé du ${D.fmt(lignes[0].date)}`, state, ouvert })}
    ${UI.repli(`cours-${compte.id}`, `Variation mensuelle des cours — ${esc(compte.nom)}`, `<div class="table-wrap"><table class="heat-table">
      <thead><tr><th>Ligne</th>${mois.map(m => `<th class="num">${D.monthLabel(m)}</th>`).join('')}</tr></thead>
      <tbody>${heat}</tbody></table></div>`, { sub: '12 derniers mois', state })}`;
}

function pageEpargne(M, state) {
  const today = D.today(), cm = F.moisCourant();
  const comptes = M.comptes.filter(c => ['epargne', 'placements'].includes(F.classe(c)));
  if (!comptes.length) return { html: `<div class="page-h"><h1>Épargne & placements</h1></div>${UI.card('Aucun compte', UI.empty('Ajoutez des comptes de type livret, assurance-vie, pea… dans comptes.json.'))}` };
  // Onglets : tous les comptes, puis un par type de support (PEA, assurance vie, livrets…). Un onglet
  // regroupe aussi les comptes clôturés de son type (historique), mais n'apparaît que s'il en reste un ouvert.
  const ORDRE = ['pea', 'assurance-vie', 'per', 'pee', 'pension', 'cto', 'livret', 'fonds-monetaire', 'pel', 'crypto'];
  const types = [...new Set(comptes.map(c => c.type))].sort((a, b) => (ORDRE.indexOf(a) + 1 || 99) - (ORDRE.indexOf(b) + 1 || 99));
  const groupes = types.map(type => {
    const cs = comptes.filter(c => c.type === type);
    const label = typeInfo(type).label + (type === 'livret' && cs.length > 1 ? 's' : '');
    return { type, label, comptes: cs };
  }).filter(g => g.comptes.some(c => F.ouvert(c, today)));
  const groupe = groupes.find(g => g.type === state.groupeEpargne) || null;
  const comptesVue = groupe ? groupe.comptes : comptes;
  const ouverts = comptesVue.filter(c => F.ouvert(c, today));
  // Un seul compte dans l'onglet : vue détaillée de ce compte (lignes, répartition par ligne)
  const choix = comptesVue.length === 1 ? comptesVue[0] : null;
  const ids = comptesVue.map(c => c.id);
  // Une couleur par type de support, la même partout (onglets, cartes, anneau, courbe)
  const COULEUR = { pea: 3, 'assurance-vie': 6, livret: 1, per: 4, pee: 7, pension: 2, 'fonds-monetaire': 5, cto: 8, pel: 2, crypto: 8 };
  const varCouleur = type => `var(--series-${COULEUR[type] || 7})`;
  const couleur = type => Charts.colors().series[(COULEUR[type] || 7) - 1];
  const onglets = groupes.length > 1 ? `<nav class="onglets" aria-label="Supports">
    ${[{ type: '', label: 'Tous les comptes', comptes }, ...groupes].map(g => `<button type="button" class="onglet" data-groupe="${esc(g.type)}" aria-pressed="${(groupe?.type || '') === g.type}" ${g.type ? `style="--c:${varCouleur(g.type)}"` : ''} title="${esc(g.comptes.map(c => c.nom).join(', '))}">${esc(g.label)}</button>`).join('')}
  </nav>` : '';

  const total = ids.reduce((s, id) => s + F.valeur(M, id, today), 0);
  // Plus-values : uniquement sur les comptes dont les versements sont renseignés
  const idsV = ids.filter(id => F.hasVersements(M, id));
  const vers = idsV.reduce((s, id) => s + F.versements(M, id, today), 0);
  const pv = idsV.length ? idsV.reduce((s, id) => s + F.valeur(M, id, today), 0) - vers : null;
  const horsV = ids.length - idsV.length;
  const d12 = D.endOfMonth(D.addMonths(cm, -12)), dYtd = (Number(cm.slice(0, 4)) - 1) + '-12-31';
  const p12 = F.perf(M, ids, d12, today), pYtd = F.perf(M, ids, dYtd, today);
  // TRI annualisé : n'a de sens qu'au-delà de quelques mois d'historique
  const triOk = t => t && t.annees >= 0.25 ? t : null;
  const triCell = t => t ? pctSigned(t.taux) : '<span class="muted">—</span>';
  const tri = triOk(F.tri(M, ids, null, today)), tri12 = triOk(F.tri(M, ids, d12, today));

  const totalTous = comptesVue.reduce((s, c) => s + F.valeur(M, c.id, today), 0);
  const rows = [...ouverts, ...comptesVue.filter(c => !F.ouvert(c, today))].map(c => {
    const v = F.valeur(M, c.id, today), f = F.versements(M, c.id, today), known = F.hasVersements(M, c.id);
    const p = F.perf(M, [c.id], d12, today), t = triOk(F.tri(M, [c.id], null, today));
    return `<tr${F.ouvert(c, today) ? '' : ' class="muted"'}>
      <td><strong>${esc(c.nom)}</strong><div class="muted small">${esc(c.banque)}${c.ferme ? `${c.banque ? ' · ' : ''}clôturé le ${D.fmt(c.ferme)}` : ''}</div></td>
      <td>${esc(typeInfo(c.type).label)}${c.taux != null ? ` <span class="muted small">${String(c.taux).replace('.', ',')} %</span>` : ''}</td>
      <td class="num">${eur(v)}</td>
      <td class="num">${known ? eur(f) : '<span class="muted">—</span>'}</td>
      <td class="num">${known ? UI.delta(v - f) : '<span class="muted">—</span>'}</td>
      <td class="num">${known && f > 0 ? pctSigned((v - f) / f) : '<span class="muted">—</span>'}</td>
      <td class="num">${known ? pctSigned(p.pct) : '<span class="muted">—</span>'}</td>
      <td class="num" title="${t ? `depuis le ${D.fmt(t.debut)}` : ''}">${triCell(t)}</td>
      <td class="num muted">${pct(totalTous ? v / totalTous : null)}</td>
    </tr>`;
  }).join('');

  // Répartition (anneau) : par ligne pour un compte détaillé, par compte dans un onglet de support, par
  // support sur « Tous les comptes » ; un compte sans lignes montre ses versements et ses gains.
  const lignesSel = choix ? F.positionsAt(M, choix.id, today).filter(p => p.quantite > 0) : [];
  const palette = Charts.colors().series;
  let parts, sousRepart;
  if (lignesSel.length) {
    parts = lignesSel.map((p, i) => ({ label: p.titre, v: p.quantite * p.cours })).sort((a, b) => b.v - a.v).map((p, i) => ({ ...p, c: palette[(i + (COULEUR[choix.type] || 7) - 1) % 8] }));
    sousRepart = 'par ligne';
  } else if (choix) {
    parts = pv != null && pv > 0 ? [{ label: 'Versé', v: vers, c: couleur(choix.type) }, { label: 'Gains', v: pv, c: palette[0] === couleur(choix.type) ? palette[2] : palette[0] }] : [{ label: choix.nom, v: total, c: couleur(choix.type) }];
    sousRepart = pv != null && pv > 0 ? 'versements et gains' : '';
  } else if (groupe) {
    parts = ouverts.map((c, i) => ({ label: c.nom, v: F.valeur(M, c.id, today), c: palette[(i + (COULEUR[groupe.type] || 7) - 1) % 8] }));
    sousRepart = 'par compte';
  } else {
    parts = groupes.map(g => ({ label: g.label, v: g.comptes.reduce((s, c) => s + F.valeur(M, c.id, today), 0), c: couleur(g.type) }));
    sousRepart = 'par support';
  }
  parts = parts.filter(p => p.v > 0.5);
  // Au-delà de 7 parts, les plus petites sont regroupées
  if (parts.length > 7) parts = [...parts.slice(0, 6), { label: `${parts.length - 6} autres`, v: parts.slice(6).reduce((s, p) => s + p.v, 0), c: Charts.colors().muted }];
  const totalParts = parts.reduce((s, p) => s + p.v, 0);
  const legende = parts.map(p => `<li><span class="pastille" style="background:${p.c}"></span>${esc(p.label)}<span class="val">${eur(p.v)} · ${pct(totalParts ? p.v / totalParts : null)}</span></li>`).join('');

  // Cartes par support (vue « Tous les comptes ») : un clic ouvre l'onglet du support
  const supports = groupe ? '' : `<section class="supports span-12">${groupes.map(g => {
    const gi = g.comptes.map(c => c.id), v = gi.reduce((s, id) => s + F.valeur(M, id, today), 0), t = triOk(F.tri(M, gi, null, today));
    const p = F.perf(M, gi, d12, today);
    return `<button type="button" class="support" data-groupe="${esc(g.type)}" style="--c:${varCouleur(g.type)}">
      <span class="nom">${esc(g.label)}</span><span class="montant">${eur(v)}</span>
      <span class="detail">${t ? `TRI ${pctSigned(t.taux)}` : 'TRI —'}${p.pct != null ? ` · 12 mois ${pctSigned(p.pct)}` : ''}</span></button>`;
  }).join('')}</section>`;

  const coulVue = choix ? varCouleur(choix.type) : groupe ? varCouleur(groupe.type) : 'var(--accent)';
  const html = `
    <div class="page-h"><h1>Épargne & placements</h1><p class="muted">${choix ? `${esc(choix.nom)}${choix.banque ? ` · ${esc(choix.banque)}` : ''}` : `${esc(groupe ? groupe.label : 'Tous les comptes')} · ${ouverts.length} compte${ouverts.length > 1 ? 's' : ''} ouvert${ouverts.length > 1 ? 's' : ''}`} · situation au ${D.fmt(today)}</p></div>
    ${onglets}
    <div class="grid">
      <section class="card epargne-hero span-12" style="--hero-tint: color-mix(in srgb, ${coulVue} 22%, transparent)">
        <div>
          <div class="kpi-label">${choix ? 'Valorisation' : 'Encours total'}</div>
          <div class="hero-value">${eur(total)}</div>
          <div class="hero-deltas">
            <div>${pv == null ? '<span class="muted">Versements non renseignés</span>' : `${UI.delta(pv)} <span class="muted">de plus-values sur ${eur(vers)} versés (${pctSigned(vers ? pv / vers : null)})</span>`}</div>
            <div>${p12.pct == null ? '<span class="muted">Historique de moins de 12 mois</span>' : `<strong>${pctSigned(p12.pct)}</strong> <span class="muted">sur 12 mois</span>`}${tri ? ` · <strong>${pctSigned(tri.taux)}</strong> <span class="muted">par an depuis le ${D.fmt(tri.debut)} (TRI)</span>` : ''}</div>
          </div>
          ${UI.chart('ch-valeur', 230)}
          <p class="small muted">${idsV.length ? `Valeur (trait plein) et versements cumulés (pointillés) : l’écart correspond aux gains${horsV ? ', sur les comptes dont les versements sont connus' : ''}.` : 'Évolution de la valeur.'}</p>
        </div>
        <div class="donut-wrap">
          ${UI.chart('ch-repartition', 200)}
          ${sousRepart ? `<div class="small muted">Répartition ${sousRepart}</div>` : ''}
          <ul class="legende">${legende}</ul>
        </div>
      </section>

      ${supports}

      <section class="card span-12"><div class="kpis four">
        ${UI.kpi('Plus-values latentes', pv == null ? '—' : UI.delta(pv), pv == null ? 'versements non renseignés' : `sur ${eur(vers)} versés · ${pctSigned(vers ? pv / vers : null)}${horsV ? ` · hors ${horsV} compte${horsV > 1 ? 's' : ''} sans versements` : ''}`)}
        ${UI.kpi('Performance 12 mois', pctSigned(p12.pct), p12.pct == null ? 'historique insuffisant' : `${UI.delta(p12.gain)} · ${eur(p12.flux)} versés`)}
        ${UI.kpi('Depuis le 1er janvier', pctSigned(pYtd.pct), pYtd.pct == null ? 'historique insuffisant' : `${UI.delta(pYtd.gain)} · ${eur(pYtd.flux)} versés`)}
        ${UI.kpi('TRI annualisé', tri ? pctSigned(tri.taux) : '—', tri ? `depuis le ${D.fmt(tri.debut)}${tri12 ? ` · ${pctSigned(tri12.taux)} sur 12 mois` : ''}` : 'versements non renseignés ou historique insuffisant')}
      </div></section>

      ${UI.card('Gains mensuels', UI.chart('ch-gains', 240), { sub: 'Variation de valeur hors versements, 12 derniers mois', cls: choix ? 'span-12' : 'span-6' })}
      ${choix ? '' : UI.card('Encours par compte', UI.chart('ch-comptes', 240), { sub: '24 derniers mois', cls: 'span-6' })}

      ${comptesVue.map(c => cartesPositions(M, c, today, state, !!choix)).join('')}

      ${UI.repli('rendements', 'Performance mensuelle et annuelle', tableRendements(M, ids), { sub: choix ? esc(choix.nom) : groupe ? esc(groupe.label) : 'Ensemble de l’épargne et des placements', state })}

      ${UI.repli('detail-comptes', 'Détail par compte', `<div class="table-wrap"><table>
        <thead><tr><th>Compte</th><th>Type</th><th class="num">Valeur</th><th class="num">Versé</th><th class="num">Plus-value</th><th class="num">Perf. totale</th><th class="num">Perf. 12 mois</th><th class="num">TRI annuel</th><th class="num">Poids</th></tr></thead>
        <tbody>${rows}</tbody>
        <tfoot><tr><td colspan="2">Total</td><td class="num">${eur(total)}</td><td class="num">${idsV.length ? eur(vers) : '—'}</td><td class="num">${pv == null ? '—' : UI.delta(pv)}</td><td class="num">${pv != null && vers ? pctSigned(pv / vers) : '—'}</td><td class="num">${pctSigned(p12.pct)}</td><td class="num">${triCell(tri)}</td><td></td></tr></tfoot>
        </table></div>
        <p class="small muted">Performance 12 mois calculée hors versements (méthode de Dietz simplifiée). TRI : taux de rendement interne annualisé depuis le premier relevé du compte, qui tient compte de la date de chaque versement et retrait (relevés mensuels). « — » : versements non renseignés dans soldes.csv ou moins de 3 mois d’historique. PEA : versements estimés à partir du prix de revient ; fonds monétaire en devises : historique reconstitué.</p>`,
        { sub: `${comptesVue.length} compte${comptesVue.length > 1 ? 's' : ''} · versé, plus-value, performance, TRI, poids`, state })}
    </div>`;

  return { html, after() {
    document.querySelectorAll('.onglet[data-groupe], .support[data-groupe]').forEach(b => b.addEventListener('click', () => {
      state.groupeEpargne = b.dataset.groupe; App.render({ garderScroll: b.classList.contains('onglet') });
    }));
    UI.suivreReplis(state);
    if (parts.length) Charts.donut(document.getElementById('ch-repartition'), parts.map(p => p.label), parts.map(p => p.v), parts.map(p => p.c));
    // Clic (ou Entrée) sur une ligne : affiche / masque ses opérations
    document.querySelectorAll('tr.ligne-clic').forEach(tr => {
      const basculer = () => { const d = document.getElementById(tr.dataset.detail); d.hidden = !d.hidden; tr.classList.toggle('ouvert', !d.hidden); };
      tr.addEventListener('click', basculer);
      tr.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); basculer(); } });
    });
    const m24 = F.mois(M, 24), lab24 = m24.map(m => D.monthLabel(m));
    // Comparaison valeur / versements sur les seuls comptes dont les versements sont connus,
    // à partir du premier relevé de ces comptes
    const idsC = idsV.length ? idsV : ids;
    const mC = m24.filter(m => idsC.some(id => F.snap(M, id, F.dateFin(m))));
    const cv = document.getElementById('ch-valeur');
    if (mC.length < 2) cv.parentElement.innerHTML = UI.empty('La courbe apparaîtra à partir du deuxième relevé mensuel.');
    else Charts.line(cv, mC.map(m => D.monthLabel(m)), [
      { label: 'Valeur', data: mC.map(m => idsC.reduce((s, id) => s + F.valeur(M, id, F.dateFin(m)), 0)), color: choix ? couleur(choix.type) : groupe ? couleur(groupe.type) : Charts.colors().series[0] },
      ...(idsV.length ? [{ label: 'Versements cumulés', data: mC.map(m => idsV.reduce((s, id) => s + F.versements(M, id, F.dateFin(m)), 0)), color: Charts.colors().text2, dash: [5, 4] }] : []),
    ]);
    const m12 = D.range(D.addMonths(cm, -11), cm);
    Charts.signedBars(document.getElementById('ch-gains'), m12.map(m => D.monthLabel(m)), 'Gain',
      m12.map(m => F.perf(M, ids, D.endOfMonth(D.addMonths(m, -1)), F.dateFin(m)).gain));
    if (choix) return;
    const top = comptesVue.slice(0, 7);
    const series = top.map(c => ({ label: c.nom, data: m24.map(m => F.valeur(M, c.id, F.dateFin(m))) }));
    if (comptesVue.length > 7) series.push({ label: 'Autres', data: m24.map(m => comptesVue.slice(7).reduce((s, c) => s + F.valeur(M, c.id, F.dateFin(m)), 0)) });
    Charts.line(document.getElementById('ch-comptes'), lab24, series);
  } };
}

/* ---------- Paramètres ---------- */
function pageParametres(M, state) {
  const cfg = App.getCfg();
  const warn = M?.warnings?.length ? `<div class="alert warning"><strong>${M.warnings.length} avertissement(s) au chargement :</strong><ul>${M.warnings.slice(0, 15).map(w => `<li>${esc(w)}</li>`).join('')}</ul></div>` : '';
  const err = state.error ? `<div class="alert critical"><strong>Échec du chargement :</strong> ${esc(state.error)}</div>` : '';
  const ok = M && !state.error ? `<div class="alert good">✓ Données chargées (${M.source === 'demo' ? 'mode démo' : `${esc(cfg.owner)}/${esc(cfg.repo)}`}) : ${M.comptes.length} comptes, ${M.soldes.length} soldes, ${M.transactions.length} opérations, ${M.positions.length} lignes de positions.</div>` : '';

  const html = `
    <div class="page-h"><h1>Paramètres</h1></div>
    <div class="grid">
      ${UI.card('Connexion au dépôt GitHub', `
        ${err}${ok}${warn}
        <form id="cfg-form" class="form" autocomplete="off">
          <div class="form-row">
            <label>Propriétaire<input name="owner" required value="${esc(cfg.owner || '')}" placeholder="mon-pseudo"></label>
            <label>Dépôt<input name="repo" required value="${esc(cfg.repo || '')}" placeholder="mes-finances"></label>
          </div>
          <div class="form-row">
            <label>Branche<input name="branche" value="${esc(cfg.branche || 'main')}"></label>
            <label>Dossier des données<input name="dossier" value="${esc(cfg.dossier ?? 'data')}"></label>
          </div>
          <label>Token GitHub (fine-grained, lecture seule)
            <input name="token" type="password" value="${esc(cfg.token || '')}" placeholder="github_pat_…" spellcheck="false">
          </label>
          <label class="check"><input type="checkbox" name="remember" ${cfg.remember ? 'checked' : ''}> Mémoriser le token sur cet appareil (sinon il est oublié à la fermeture de l’onglet)</label>
          <div class="btns">
            <button class="btn primary" type="submit">Enregistrer et charger</button>
            <button class="btn" type="button" id="btn-demo">Utiliser les données de démo</button>
            <button class="btn ghost" type="button" id="btn-forget">Oublier le token</button>
          </div>
        </form>`, { sub: 'Le token reste dans votre navigateur ; il n’est envoyé qu’à api.github.com.', cls: 'span-7' })}

      ${UI.card('Créer le token', `
        <ol class="steps">
          <li>GitHub → <em>Settings</em> → <em>Developer settings</em> → <em>Personal access tokens</em> → <strong>Fine-grained tokens</strong> → <em>Generate new token</em>.</li>
          <li><em>Repository access</em> : <strong>Only select repositories</strong> → votre dépôt de données (privé).</li>
          <li><em>Permissions</em> → <em>Repository permissions</em> → <strong>Contents : Read-only</strong>. Rien d’autre.</li>
          <li>Choisissez une date d’expiration, générez, puis collez le token ici.</li>
        </ol>
        <p class="small muted">Fichiers attendus dans <code>${esc(cfg.dossier ?? 'data')}/</code> : ${Object.values(FICHIERS).map(f => `<code>${f}</code>`).join(', ')}. Modèles et explications dans le README.</p>`, { cls: 'span-5' })}
    </div>`;

  return { html, after() {
    const form = document.getElementById('cfg-form');
    form.addEventListener('submit', e => {
      e.preventDefault();
      const fd = new FormData(form);
      App.saveCfg({ owner: fd.get('owner').trim(), repo: fd.get('repo').trim(), branche: fd.get('branche').trim() || 'main', dossier: fd.get('dossier').trim(), token: fd.get('token').trim(), demo: false }, !!fd.get('remember'));
      App.load('overview');
    });
    document.getElementById('btn-demo').addEventListener('click', () => { App.saveCfg({ ...App.getCfg(), demo: true }, App.getCfg().remember); App.load('overview'); });
    document.getElementById('btn-forget').addEventListener('click', () => { App.saveCfg({ ...App.getCfg(), token: '' }, false); App.render(); });
  } };
}

</script>
  <script>
'use strict';

/* ---------- Recommandations ----------
   Pistes classées par priorité (haute, moyenne, basse), recalculées à chaque chargement à partir des données :
   la priorité et les montants suivent la situation du moment. Ce sont des repères de bonne gestion (épargne de
   précaution, budget, frais, concentration des placements), pas un conseil en investissement personnalisé.
   Les noms de prestataires et repères propres au foyer (employeur, gestionnaire, banques, offres comparées) viennent
   de budget.json → "conseils", dans le dépôt privé : le code publié n'en contient aucun. */

const PLAFONDS_LIVRETS = { 'livret-a': 22950, ldds: 12000, lep: 10000 };
// Repères du foyer (budget.json → "conseils"), avec des libellés génériques à défaut
function reperesConseils(M) {
  const c = M.budget.conseils || {}, b = c.banque || {};
  return {
    frais: { nom: 'votre gestionnaire', motif: '', ...(c.frais || {}) },
    pee: { employeur: 'votre employeur', gestionnaire: 'votre gestionnaire', detail: '', ...(c.pee || {}) },
    per: { detail: '', ...(c.per || {}) },
    pension: { gestionnaire: 'votre gestionnaire', ...(c.pension || {}) },
    fondsMonetaire: { detail: '', ...(c.fondsMonetaire || {}) },
    banque: { actuelle: 'votre banque principale', cible: 'une banque en ligne', neo: 'la néobanque', offre: 'l’offre actuelle',
      offreSup: 'l’offre supérieure', prixAn: 0, prixMois: 0, tarifDu: '', prelevements: 'placements, assurance emprunteur, abonnements',
      contratVie: '', avantage: '', motifAvantage: '', motifLivraison: '', gainParCommande: 2.5, partenaires: '', motifPartenaires: '', ...b },
  };
}
const motifRe = m =>{ try { return m ? new RegExp(m, 'i') : null; } catch { return null; } };
const NIVEAUX = {
  haute: { label: 'Haute', cls: 'critical', ordre: 0 },
  moyenne: { label: 'Moyenne', cls: 'warning', ordre: 1 },
  basse: { label: 'Basse', cls: 'neutral', ordre: 2 },
};

function recommandations(M) {
  const V = vueDepenses(M, ''), today = D.today(), cm = F.moisCourant();
  const mois = n => D.range(D.addMonths(cm, -n), D.addMonths(cm, -1));
  const moy = a => a.length ? a.reduce((s, v) => s + v, 0) / a.length : 0;
  const nb = (v, d = 1) => v.toLocaleString('fr-FR', { maximumFractionDigits: d });
  const recos = [];
  const ajout = (niveau, theme, titre, constat, piste, lien) => recos.push({ niveau, theme, titre, constat, piste, lien });
  const compte = id => M.comptes.find(c => c.id === id);
  const valeur = id => compte(id) && F.ouvert(compte(id), today) ? F.valeur(M, id, today) : 0;
  const m12 = mois(12), m6 = mois(6), m3 = mois(3);
  const P12 = m12.map(m => F.pnl(V, m)), P6 = P12.slice(-6), P3 = P12.slice(-3);
  const capital = p => -(p.parCat.get(normKey('Capital crédit immobilier')) || 0);
  const depCat = (cat, ms) => ms.map(m => F.depenses(V, m).parCat.get(normKey(cat))?.montant || 0);
  const budget = F.budget(V, cm);
  const revenus12 = moy(P12.map(p => p.revenus));
  const ops12 = M.transactions.filter(t => t.date >= m12[0] + '-01' && t.date < cm + '-01');
  const R = reperesConseils(M);

  // 1. Épargne de précaution : livrets et fonds monétaire, rapportés aux sorties mensuelles (charges + capital du crédit)
  const dispo = M.comptes.filter(c => F.classe(c) === 'epargne' && F.ouvert(c, today)).reduce((s, c) => s + F.valeur(M, c.id, today) * c.quotePart, 0);
  const besoin = moy(P6.map(p => p.charges)) + moy(P3.map(capital));
  if (besoin > 0) {
    const n = dispo / besoin, cible = 6 * besoin, manque = Math.max(0, cible - dispo);
    const placeA = Math.max(0, PLAFONDS_LIVRETS['livret-a'] - valeur('livret-a'));
    const pleins = Object.keys(PLAFONDS_LIVRETS).filter(id => valeur(id) >= PLAFONDS_LIVRETS[id] - 1).map(id => compte(id).nom);
    ajout(n < 6 ? 'haute' : 'basse', 'Sécurité',
      n < 6 ? `Porter l’épargne de précaution à 6 mois de dépenses (${nb(n)} mois aujourd’hui)` : `Épargne de précaution : ${nb(n)} mois de dépenses, objectif atteint`,
      `${eur(dispo)} disponibles (livrets et fonds monétaire), pour ${eur(besoin)} de sorties par mois (charges des 6 derniers mois + votre part du capital du crédit). Objectif 6 mois : ${eur(cible)}.`,
      n < 6 ? `Il manque ${eur(manque)}. Un virement automatique de ${eur(Math.ceil(manque / 6 / 50) * 50)} par mois vers le Livret A, le lendemain du salaire, comble l’écart en 6 mois. Le Livret A a encore ${eur(placeA)} de place${pleins.length ? ` ; ${pleins.join(', ')} ${pleins.length > 1 ? 'sont pleins' : 'est plein'}` : ''}.`
        : `Au-delà, l’épargne supplémentaire peut aller vers des projets ou le long terme plutôt que vers les livrets.`, '#epargne');
  }

  // 2. Trésorerie des comptes courants : fins de mois dans le rouge
  const debut12 = D.endOfMonth(D.addMonths(cm, -12));
  const rouges = M.soldes.filter(s => s.solde < 0 && s.date > debut12 && F.classe(compte(s.compte) || {}) === 'liquidites');
  if (rouges.length) {
    const pire = Math.min(...rouges.map(s => s.solde)), recent = rouges.some(s => s.date > D.endOfMonth(D.addMonths(cm, -6)));
    const noms = [...new Set(rouges.map(s => compte(s.compte).nom))];
    const jourEcheance = M.immobilier?.[0]?.echeancier?.[0]?.date?.slice(8, 10);
    ajout(recent ? 'haute' : 'moyenne', 'Sécurité', `Éviter les fins de mois à découvert (${rouges.length} en 12 mois)`,
      `${noms.join(', ')} : ${rouges.map(s => `${eur(s.solde)} au ${D.fmt(s.date)}`).join(', ')}.${jourEcheance ? ` Le compte joint porte l’échéance du prêt, prélevée vers le ${Number(jourEcheance)}.` : ''}`,
      `Garder un coussin d’au moins ${eur(Math.ceil(-pire / 100) * 100 + 200)} sur ${noms.length > 1 ? 'ces comptes' : 'ce compte'}, et caler les virements d’alimentation du compte joint (les vôtres et ceux du conjoint) avant l’échéance du prêt.`, '#depenses');
  }

  // 3. Plus gros postes variables : là où une baisse pèse le plus
  const variables = ['Voyages', 'Restaurants', 'Courses', 'Shopping', 'Transports', 'Sorties', 'Loisirs', 'Maison']
    .map(c => ({ c, a12: moy(depCat(c, m12)), a3: moy(depCat(c, m3)), b: budget.get(normKey(c))?.montant || 0 }))
    .filter(x => x.a12 > 0).sort((a, b) => b.a12 - a.a12).slice(0, 3);
  if (variables.length) {
    const total = variables.reduce((s, x) => s + x.a12, 0);
    ajout(total > 0.15 * revenus12 ? 'moyenne' : 'basse', 'Dépenses', `Vos trois plus gros postes variables : ${variables.map(x => x.c.toLowerCase()).join(', ')}`,
      variables.map(x => `${x.c} ${eur(x.a12)}/mois sur 12 mois (${pct(revenus12 ? x.a12 / revenus12 : null)} des revenus${x.b ? `, budget ${eur(x.b)}` : ''}${x.a3 > 1.3 * x.a12 ? ` ; ${eur(x.a3)}/mois sur les 3 derniers mois` : ''})`).join(' · ') + '.',
      `Ensemble ${eur(total)} par mois. Les réduire de 15 % libérerait ${eur(total * 0.15)} par mois, soit ${eur(total * 0.15 * 12)} par an. Les voyages restent dans le budget sur l’année : fixer une enveloppe annuelle (${eur((budget.get(normKey('Voyages'))?.montant || 0) * 12)}) et la suivre voyage par voyage est plus parlant qu’un plafond mensuel.`, '#depenses');
  }

  // 4. Budget non consommé : catégories nettement sous leur budget depuis 6 mois
  const sous = [...budget.values()].map(b => ({ label: b.label, b: b.montant, a6: moy(depCat(b.label, m6)) }))
    .filter(x => x.b >= 30 && x.a6 < 0.6 * x.b);
  if (sous.length) {
    const marge = sous.reduce((s, x) => s + x.b - Math.max(0, x.a6), 0);
    ajout(marge > 200 ? 'moyenne' : 'basse', 'Budget', `Réaffecter ${eur(marge)} de budget mensuel non consommé`,
      `Sur 6 mois : ${sous.map(x => `${x.label} ${eur(Math.max(0, x.a6))} pour ${eur(x.b)}`).join(', ')}.`,
      `Baisser ces budgets et programmer l’écart en virement automatique vers l’épargne : un budget qui n’est pas dépensé a tendance à l’être ailleurs.`, '#depenses');
  }

  // 5. Taux d'épargne
  const taux = P => { const r = P.reduce((s, p) => s + p.revenus, 0); return r > 0 ? P.reduce((s, p) => s + p.resultat, 0) / r : null; };
  const t12 = taux(P12), t6 = taux(P6);
  if (t12 != null) ajout(t6 != null && t6 < 0.15 ? 'haute' : t6 != null && t6 < 0.2 ? 'moyenne' : 'basse', 'Budget', `Taux d’épargne : ${pct(t6)} sur 6 mois, ${pct(t12)} sur 12 mois`,
    `Revenus moins charges nettes (compte joint à votre part), capital du crédit compté en épargne. Les 12 mois comprennent la prime de décembre.`,
    t6 >= 0.2 ? `Au-dessus du repère courant de 20 %. Pour qu’il se retrouve sur les comptes d’épargne, automatisez les virements le jour du salaire plutôt que d’épargner ce qui reste en fin de mois.` : `Sous le repère courant de 20 % : les pistes « postes variables » et « budget non consommé » sont les leviers.`, '#depenses');

  // 6. Prime annuelle : la planifier avant de la recevoir
  const salaires = ops12.filter(t => normKey(t.categorie) === normKey('Salaire') && t.montant > 0);
  const med = salaires.length ? [...salaires].map(t => t.montant).sort((a, b) => a - b)[Math.floor(salaires.length / 2)] : 0;
  const prime = salaires.filter(t => t.montant > 2 * med).sort((a, b) => b.montant - a.montant)[0];
  if (prime) ajout('moyenne', 'Budget', `Décider à l’avance de l’usage de la prime de fin d’année`,
    `${eur(prime.montant)} reçus le ${D.fmt(prime.date)} (salaire habituel ${eur(med)}).`,
    `Fixer la répartition avant le versement, dans cet ordre : compléter l’épargne de précaution (voir plus haut), mettre de côté les projets à moins de 5 ans sur des supports sans risque, puis le long terme. Ce qui n’a pas d’affectation finit souvent en dépenses courantes.`, '#depenses');

  // 7. Opérations non classées
  const divers = ops12.filter(t => ['divers', 'non categorise'].includes(normKey(t.categorie)) && t.montant < 0);
  const totDivers = -divers.reduce((s, t) => s + t.montant, 0);
  if (totDivers > 300) {
    const gros = divers.filter(t => t.montant <= -150).sort((a, b) => a.montant - b.montant).slice(0, 5);
    ajout(totDivers > 1500 ? 'moyenne' : 'basse', 'Données', `Classer ${eur(totDivers)} de dépenses « Divers » sur 12 mois`,
      gros.length ? `Les plus grosses : ${gros.map(t => `${esc(t.libelle)} ${eur(-t.montant)} (${D.fmt(t.date)})`).join(', ')}.` : `${divers.length} opérations.`,
      `Les reclasser dans la page Dépenses : le budget et les comparaisons sont d’autant plus justes.`, '#depenses');
  }

  // 8. Concentration géographique des actions du PEA
  const lignes = id => { const ps = M.positions.filter(p => p.compte === id), d = ps.reduce((a, p) => p.date > a ? p.date : a, ''); return ps.filter(p => p.date === d).map(p => ({ titre: p.titre, v: p.quantite * p.cours })); };
  const pea = lignes('pea'), totPea = pea.reduce((s, l) => s + l.v, 0);
  if (totPea > 0) {
    const us = pea.reduce((s, l) => s + l.v * (/S&P|Nasdaq/i.test(l.titre) ? 1 : /World/i.test(l.titre) ? 0.7 : 0), 0);
    const sp = pea.filter(l => /S&P 500/i.test(l.titre));
    const etf = pea.filter(l => /ETF|iShares|Amundi|BNP Easy|S&P|Nasdaq|MSCI/i.test(l.titre)).reduce((s, l) => s + l.v, 0);
    ajout(us / totPea > 0.6 ? 'moyenne' : 'basse', 'Placements', `PEA : environ ${pct(us / totPea)} exposé aux actions américaines`,
      `${eur(us)} sur ${eur(totPea)} : ETF S&P 500 et Nasdaq-100 en totalité, MSCI World à ~70 % (poids des États-Unis dans l’indice). ETF : ${pct(etf / totPea)} du PEA, actions françaises en direct : ${pct(1 - etf / totPea)}.${sp.length > 1 ? ` Deux ETF suivent le même indice S&P 500 (${sp.map(l => `${esc(l.titre)} ${eur(l.v)}`).join(', ')}).` : ''}`,
      `C’est un choix à assumer en connaissance de cause (dollar, valorisations, poids de quelques grandes valeurs technologiques). ${sp.length > 1 ? 'Les deux ETF S&P 500 font doublon : les regrouper simplifie le suivi sans changer l’exposition. ' : ''}Si vous voulez moins dépendre des États-Unis, c’est l’orientation des prochains versements qui permet d’ajuster, sans vendre.`, '#epargne');
  }

  // 9. Assurance vie : nombre de fonds et part des fonds thématiques
  const av = lignes('av'), totAv = av.reduce((s, l) => s + l.v, 0);
  if (av.length > 10) {
    const them = av.filter(l => /Robotics|Artificial|Safety|Sport|Blockchain|Healthcare|Water/i.test(l.titre));
    const petits = av.filter(l => l.v < 300);
    ajout('moyenne', 'Placements', `Assurance vie : ${av.length} fonds pour ${eur(totAv)}`,
      `Fonds thématiques (robotique, IA, sécurité, santé, sport, blockchain) : ${eur(them.reduce((s, l) => s + l.v, 0))}, soit ${pct(them.reduce((s, l) => s + l.v, 0) / totAv)}. ${petits.length} lignes de moins de 300 € (${petits.map(l => esc(l.titre)).join(', ')}).`,
      `Beaucoup de fonds se recouvrent (plusieurs fonds actions monde) sans diversifier davantage, et les fonds thématiques ont en général des frais plus élevés et plus de volatilité. Une revue annuelle (frais de chaque fonds, recouvrements, lignes trop petites pour compter) aide à garder un contrat lisible. Les arbitrages à l’intérieur du contrat ne sont pas imposés.`, '#epargne');
  }

  // 10. Frais de gestion de l'assurance vie et du PER (prestataire et libellé dans budget.json → conseils.frais)
  const reFrais = motifRe(R.frais.motif);
  const mpp = reFrais ? -ops12.filter(t => reFrais.test(t.libelle) && t.montant < 0).reduce((s, t) => s + t.montant, 0) : 0;
  if (mpp > 0) {
    const encours = valeur('av') + valeur('per');
    ajout(mpp / encours > 0.006 ? 'moyenne' : 'basse', 'Frais', `Frais de gestion (${esc(R.frais.nom)}) : ${eur(mpp)} sur 12 mois`,
      `Prélevés chaque trimestre sur le compte courant, soit ${pct(mpp / encours)} de l’encours assurance vie + PER (${eur(encours)}), en plus des frais propres à chaque fonds.`,
      `Comparer chaque année le coût total (frais de gestion + frais des fonds) avec d’autres contrats. Ne pas clôturer pour autant un contrat d’assurance vie ancien : sa date d’ouverture compte pour la fiscalité (après 8 ans).`, '#epargne');
  }

  // 11. Fonds monétaire en livres
  const gbp = valeur('revolut-epargne');
  if (gbp > 500) ajout('basse', 'Placements', `Fonds monétaire en livres : ${eur(gbp)}`,
    `Placé en livres sterling : sa valeur en euros varie avec le change. Son historique est reconstitué${R.fondsMonetaire.detail ? `, ${esc(R.fondsMonetaire.detail)}` : ''}.`,
    `S’il n’y a pas de dépense prévue en livres, c’est une épargne de précaution exposée au change. Vérifier aussi dans l’application le relevé du fonds pour expliquer l’écart.`, '#epargne');

  // 12. PEE : abondement de l'employeur
  if (valeur('pee') > 0 || compte('pee')) ajout('moyenne', 'Placements', `PEE : vérifier le plafond d’abondement (${esc(R.pee.employeur)})`,
    R.pee.detail ? esc(R.pee.detail) : `Vos versements volontaires sur le PEE sont abondés par ${esc(R.pee.employeur)}.`,
    `L’abondement est un complément immédiat versé par l’employeur, souvent le placement le plus rentable disponible, en échange d’un blocage de 5 ans (avec cas de déblocage anticipé). Vérifier dans l’accord ou sur l’espace ${esc(R.pee.gestionnaire)} si un versement plus élevé serait encore abondé.`, '#epargne');

  // 13. PER : intérêt fiscal selon la tranche d'imposition
  if (valeur('per') > 0) ajout('basse', 'Fiscalité', `PER : vérifier que la déduction fiscale vaut le blocage`,
    `${eur(valeur('per'))} sur le PER${R.per.detail ? `, ${esc(R.per.detail)}` : ''}. L’argent est bloqué jusqu’à la retraite (sauf achat de la résidence principale et accidents de la vie).`,
    `Les versements se déduisent du revenu imposable : l’économie d’impôt est égale à votre tranche marginale (TMI). Vérifier sur l’avis d’impôt la TMI et le plafond « épargne retraite » disponible ; l’intérêt est fort à 30 % et plus, faible à 11 %.`, '#epargne');

  // 14. Pension britannique dormante
  if (valeur('pension-uk') > 0) ajout('basse', 'Placements', `Pension britannique : ${eur(valeur('pension-uk'))} sans cotisations depuis 2021`,
    `Plan ${esc(R.pension.gestionnaire)} « paid up », investi dans un portefeuille piloté.`,
    `Garder l’adresse et l’e-mail à jour chez ${esc(R.pension.gestionnaire)} et vérifier une fois par an les frais annuels. Un transfert vers la France est complexe (régime fiscal spécifique, frais) : rarement intéressant pour ce montant.`, '#epargne');

  // 15. Crédit immobilier : rembourser par anticipation ou épargner
  const bien = M.immobilier?.[0];
  if (bien?.pret) ajout('basse', 'Immobilier', `Crédit immobilier à ${nb(parseNum(bien.pret.taux), 2)} % : le remboursement anticipé n’est pas prioritaire`,
    `Votre part du capital restant dû : ${eur(Immo.crd(bien, today) * Immo.part(bien))}. Rembourser par anticipation « rapporte » le taux du crédit, sans risque, mais immobilise l’argent dans le bien.`,
    `Tant que l’épargne de précaution n’est pas complète, elle passe avant. Ensuite, comparer le taux du crédit (${nb(parseNum(bien.pret.taux), 2)} %) au rendement net des livrets et des placements ; vérifier aussi dans l’offre de prêt les indemnités de remboursement anticipé.`, '#immobilier');

  // 16. Frais bancaires : renvoi vers la comparaison des banques
  const banque = fraisBancaires(M, ops12), B = R.banque;
  ajout('basse', 'Banque', `Frais bancaires : ${eur(banque.total)} sur 12 mois`,
    `${esc(B.actuelle)} ${eur(banque.principale)} (carte ${eur(banque.carte)}, virements ${eur(banque.virements)}) · ${esc(B.neo)} ${eur(banque.neo)} (abonnement).`,
    `Les frais sont déjà bas : changer de banque pour les frais seuls ne rapporte presque rien. Voir la comparaison des banques plus bas.`, '#recommandations');

  return recos.sort((a, b) => NIVEAUX[a.niveau].ordre - NIVEAUX[b.niveau].ordre);
}

// Frais bancaires des 12 derniers mois, hors frais de gestion des placements (conseils.frais) et hors arrondis RevPoints
const reFraisGestion = M => motifRe(reperesConseils(M).frais.motif);
function fraisBancaires(M, ops12) {
  const f = ops12.filter(t => normKey(t.categorie) === normKey('Banque & frais') && !/revpoints/i.test(t.libelle) && !(reFraisGestion(M)?.test(t.libelle)));
  const somme = l => -l.reduce((s, t) => s + t.montant, 0);
  const principale = f.filter(t => t.compte === 'courant'), neo = f.filter(t => t.compte.startsWith('revolut'));
  return { principale: somme(principale), neo: somme(neo), total: somme(f),
    carte: somme(principale.filter(t => /carte/i.test(t.libelle))), virements: somme(principale.filter(t => /virement/i.test(t.libelle))) };
}

// Quitter la banque principale pour une banque en ligne, et garder l'offre actuelle de la néobanque ou passer à son
// offre supérieure : coût de chaque option et, pour l'offre supérieure, ce qui compense son surcoût d'après vos
// opérations des 12 derniers mois (avantage inclus, dépenses par carte, abonnements partenaires déjà payés, voyages).
// Noms, tarifs et libellés viennent de budget.json → conseils.banque ; sans tarif, la carte n'est pas affichée.
function comparaisonBanque(M) {
  const B = reperesConseils(M).banque;
  if (!(parseNum(B.prixAn) > 0)) return '';
  const today = D.today(), cm = F.moisCourant();
  const dans12 = t => t.date >= D.addMonths(cm, -12) + '-01' && t.date < cm + '-01';
  const ops12 = M.transactions.filter(dans12);
  const fb = fraisBancaires(M, ops12);
  const actuels = M.comptes.filter(c => c.banque === B.actuelle && F.ouvert(c, today) && F.valeur(M, c.id, today) > 0);
  const somme = l => -l.reduce((s, t) => s + t.montant, 0);
  // Voyages à votre part (compte joint pour moitié), comme dans le budget
  const voyages = somme(vueDepenses(M, '').transactions.filter(t => dans12(t) && normKey(t.categorie) === normKey('Voyages')));
  // Avantage inclus (ex. abonnement de livraison) : frais évités sur chaque commande
  const reAv = motifRe(B.motifAvantage), reLiv = motifRe(B.motifLivraison);
  const avOps = reAv ? ops12.filter(t => t.montant < 0 && reAv.test(t.libelle)) : [];
  const livraisons = reLiv ? avOps.filter(t => reLiv.test(t.libelle)) : avOps, autresAv = avOps.filter(t => !livraisons.includes(t));
  const gainAvantage = livraisons.length * (parseNum(B.gainParCommande) || 0);
  // Dépenses par carte de la néobanque (euros et devises), base des points de fidélité
  const horsCarte = ['Virement interne', 'Épargne', 'Entre amis'].map(normKey);
  const cartes = id => somme(ops12.filter(t => t.compte === id && t.montant < 0 && !horsCarte.includes(normKey(t.categorie))));
  const neoEur = cartes('revolut'), neoDev = cartes('revolut-devises'), neoTot = neoEur + neoDev;
  const points = [neoTot * 0.005, neoTot * 0.01];   // de 1 point pour 2 € à 1 point par euro, 1 point ≈ 1 centime
  // Abonnements partenaires de l'offre supérieure déjà payés aujourd'hui
  const reP = motifRe(B.motifPartenaires);
  const partenaires = reP ? somme(ops12.filter(t => t.montant < 0 && reP.test(t.libelle))) : 0;
  const prixAn = parseNum(B.prixAn), surcout = prixAn - fb.neo, bas = gainAvantage + points[0] + partenaires, haut = gainAvantage + points[1] + partenaires;
  const sup = esc(B.offreSup), neo = esc(B.neo), act = esc(B.actuelle), cible = esc(B.cible);
  const verdict = bas >= surcout
    ? `même en hypothèse basse, vous récupérez ≈ ${eur(bas)} à ${eur(haut)} pour ${eur(surcout)} de plus : l’offre ${sup} se rentabilise, de peu${B.avantage ? `, surtout grâce à ${esc(B.avantage)}` : ''} ; l’assurance voyage vient en plus.`
    : haut >= surcout
      ? `≈ ${eur(bas)} à ${eur(haut)} récupérés pour ${eur(surcout)} de plus : à peu près l’équilibre. L’offre ${sup} devient rentable si vous utilisez son assurance voyage ou un abonnement que vous paieriez de toute façon.`
      : `au plus ${eur(haut)} récupérés pour ${eur(surcout)} de plus : l’offre ${sup} ne se rentabilise pas avec vos habitudes actuelles, sauf par l’assurance voyage.`;
  return `
    <p>${act} porte aujourd’hui : ${actuels.map(c => `${esc(c.nom)} ${eur(F.valeur(M, c.id, today))}`).join(', ')}, plus le salaire et les prélèvements (${esc(B.prelevements)}).</p>
    <div class="table-wrap"><table>
      <thead><tr><th>Option</th><th class="num">Coût par an</th><th>Ce que ça implique</th></tr></thead>
      <tbody>
        <tr><td><strong>Aujourd’hui : ${act} + ${neo} ${esc(B.offre)}</strong></td><td class="num">${eur(fb.principale + fb.neo)}</td>
          <td>${act} ${eur(fb.principale)} (carte et virements), ${neo} ${eur(fb.neo)}.</td></tr>
        <tr><td><strong>${cible} principale + ${neo} ${esc(B.offre)}</strong></td><td class="num">${eur(fb.neo)}</td>
          <td>${eur(fb.principale)} d’économie, une banque de moins. Le Livret A et le LDDS ne se transfèrent pas : les clôturer, puis les rouvrir et les réalimenter dans la nouvelle banque. Déplacer le salaire et les prélèvements ; vérifier dans l’offre de prêt une éventuelle clause de domiciliation${B.contratVie ? ` ; garder ${esc(B.contratVie)} ouvert si la banque l’accepte sans compte (date fiscale)` : ''}.</td></tr>
        <tr><td><strong>${cible} principale + ${neo} ${sup}</strong></td><td class="num">${eur(prixAn)}${parseNum(B.prixMois) ? `<div class="muted small">ou ${eur(parseNum(B.prixMois), true)}/mois sans engagement</div>` : ''}</td>
          <td>Mêmes démarches. ${eur(surcout)} de plus que l’offre actuelle : à compenser par les avantages ci-dessous.</td></tr>
      </tbody></table></div>
    <h3 class="cats-titre">L’offre ${sup} paie-t-elle ses ${eur(surcout)} de plus ? Vos 12 derniers mois</h3>
    <ul class="attentions">
      ${B.avantage ? `<li class="attention"><span class="status good">✓</span><div><strong>${esc(B.avantage)} : ≈ ${eur(gainAvantage)} par an</strong><div class="muted small">${livraisons.length} commandes (${eur(somme(livraisons))})${autresAv.length ? ` et ${autresAv.length} autres achats (${eur(somme(autresAv))})` : ''}. Estimation : environ ${eur(parseNum(B.gainParCommande) || 0, true)} de frais évités par commande.</div></div></li>` : ''}
      <li class="attention"><span class="status good">✓</span><div><strong>Points de fidélité : ≈ ${eur(points[0])} à ${eur(points[1])} par an</strong><div class="muted small">${eur(neoTot)} payés par carte ${neo} (${eur(neoEur)} en euros, ${eur(neoDev)} en devises). De 1 point pour 2 € à 1 point par euro, 1 point ≈ 1 centime : taux à vérifier dans l’application.</div></div></li>
      ${B.partenaires ? `<li class="attention"><span class="status ${partenaires > 0 ? 'good' : 'neutral'}">${partenaires > 0 ? '✓' : '●'}</span><div><strong>${esc(B.partenaires)} : ${eur(partenaires)} payés</strong><div class="muted small">${partenaires > 0 ? 'Ces abonnements, inclus dans l’offre, seraient économisés.' : 'Vous n’en payez aucun aujourd’hui : leur valeur affichée ne compte que si vous les utiliseriez et les paieriez de toute façon.'}</div></div></li>` : ''}
      <li class="attention"><span class="status warning">●</span><div><strong>Assurance voyage et annulation : le vrai argument</strong><div class="muted small">${eur(voyages)} de voyages à votre part sur 12 mois, dont ${eur(neoDev)} payés en devises. Utile si elle vous évite une assurance à chaque voyage ; peu utile si la carte de votre banque principale couvre déjà l’essentiel.</div></div></li>
    </ul>
    <p class="small"><strong>Lecture :</strong> quitter ${act} rapporte ${eur(fb.principale)} par an, avec ou sans l’offre ${sup} : c’est une décision à part. Pour l’offre ${sup}, ${verdict} ${parseNum(B.prixMois) ? `Elle est sans engagement au mois : essayez-la quelques mois et revenez à l’offre actuelle si vous n’en utilisez pas les avantages.` : ''}</p>
    ${B.tarifDu ? `<p class="small muted">Tarif en vigueur depuis le ${esc(B.tarifDu)} ; la liste des avantages inclus varie selon le pays : vérifiez-la dans l’application avant de souscrire.</p>` : ''}`;
}

function pageRecommandations(M, state) {
  const recos = recommandations(M), B = reperesConseils(M).banque, comparaison = comparaisonBanque(M);
  const filtre = NIVEAUX[state.niveauReco] ? state.niveauReco : '';
  const compte = n => recos.filter(r => r.niveau === n).length;
  const liste = recos.filter(r => !filtre || r.niveau === filtre).map((r, i) => `
    <li class="reco">
      <div class="reco-h"><span class="reco-rang">${i + 1}</span><span class="status ${NIVEAUX[r.niveau].cls}">● ${NIVEAUX[r.niveau].label}</span><span class="tag">${esc(r.theme)}</span></div>
      <h3>${r.titre}</h3>
      <p class="muted">${r.constat}</p>
      <p><strong>Piste :</strong> ${r.piste}</p>
      ${r.lien && r.lien !== '#recommandations' ? `<a class="link small" href="${r.lien}">Voir les données →</a>` : ''}
    </li>`).join('');
  const html = `
    <div class="page-h"><h1>Recommandations</h1><p class="muted">${recos.length} pistes calculées à partir de vos données au ${D.fmt(D.today())}</p></div>
    <div class="grid">
      <section class="card span-12">
        <div class="kpis">
          ${UI.kpi('Priorité haute', `<span class="status critical">${compte('haute')}</span>`, 'à traiter en premier')}
          ${UI.kpi('Priorité moyenne', `<span class="status warning">${compte('moyenne')}</span>`, 'dans les prochains mois')}
          ${UI.kpi('Priorité basse', `<span class="status neutral">${compte('basse')}</span>`, 'à garder en tête')}
        </div>
        <p class="small muted">Repères de bonne gestion appliqués à vos chiffres, recalculés à chaque mise à jour. Je ne suis pas conseiller financier agréé : pour un choix d’investissement, de fiscalité ou de banque, faites-vous confirmer la piste par un professionnel.</p>
      </section>
      <div class="span-12 onglets" role="group" aria-label="Filtrer par priorité">
        <button class="onglet" data-niveau="" aria-pressed="${!filtre}">Toutes (${recos.length})</button>
        ${Object.entries(NIVEAUX).map(([k, n]) => `<button class="onglet" data-niveau="${k}" aria-pressed="${filtre === k}">${n.label} (${compte(k)})</button>`).join('')}
      </div>
      <section class="span-12"><ol class="recos">${liste}</ol></section>
      ${comparaison ? UI.card(`Quitter ${esc(B.actuelle)} ? Passer à ${esc(B.neo)} ${esc(B.offreSup)} ?`, comparaison, { sub: 'Coûts, démarches et ce que l’offre supérieure vous rapporterait d’après vos 12 derniers mois', cls: 'span-12' }) : ''}
    </div>`;
  return { html, after() {
    document.querySelectorAll('.onglet[data-niveau]').forEach(b => b.addEventListener('click', () => {
      state.niveauReco = b.dataset.niveau; App.render({ garderScroll: true });
    }));
  } };
}

</script>
  <script>
'use strict';

/* ---------- Prévisionnel : patrimoine net projeté mois par mois ----------
   Départ : le patrimoine net d'aujourd'hui (même calcul que la vue d'ensemble), réparti entre liquidités, épargne
   (livrets, fonds monétaire), placements par enveloppe (PEA, assurance vie, PER, PEE, pension…) et immobilier (votre
   quote-part de la valeur et du capital restant dû).
   Chaque mois : revenus (salaire, éventuellement revalorisé à une date donnée, primes le mois habituel, autres
   revenus) − dépenses courantes hors crédit − votre part de l'échéance du prêt (intérêts, assurance, capital, d'après
   le tableau d'amortissement) ± événements ponctuels ± projet locatif (onglet Locatif : apport, loyers, charges,
   crédit, valeur du bien). Ce qui reste va en placements à hauteur de la part choisie, réparti entre les enveloppes,
   le reste en épargne de précaution jusqu'à la cible ; la cible atteinte, tout est placé. Un mois négatif puise dans
   les liquidités, puis l'épargne, puis les placements disponibles (le PER, le PEE et la pension restent bloqués).
   Chaque enveloppe rapporte son rendement, les biens se valorisent. Revenus et dépenses augmentent chaque janvier.
   Le mois en cours n'est projeté que pour ce qui reste à venir.
   Net de sortie : patrimoine net moins l'impôt sur les gains des placements s'ils étaient retirés et les frais de
   vente des biens (approximations : prélèvements sociaux, PFU, TMI ; abattements ignorés).
   Fourchette : rendements des placements ± 2 points et valorisation de l'immobilier ± 1 point.
   Montants à votre part (compte joint et bien à 50 %), revenus nets d'impôt (virements reçus).
   Les hypothèses saisies restent dans ce navigateur jusqu'à « Enregistrer » : elles vont alors dans previsionnel.json
   du dépôt privé, avec une photo de la prévision des 12 mois, comparée ensuite au patrimoine réalisé. */

const PREVISION_KEY = 'suivi-comptes.previsionnel';
const PREVISION_FICHIER = 'previsionnel.json';
const NB_EVENEMENTS = 3;
const NOMS_MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
const SCENARIOS = { prudent: { placements: -2, immo: -1 }, central: { placements: 0, immo: 0 }, favorable: { placements: 2, immo: 1 } };
const CAT_INTERETS = 'Intérêts du crédit immobilier';
// Enveloppes de placement : rendement proposé, blocage, impôt à la sortie (ps : prélèvements sociaux sur les gains ;
// av : prélèvements sociaux + 7,5 % après 8 ans ; pfu : 30 % ; per : versements à la TMI + gains au PFU ; revenu : TMI)
const ENVELOPPES = [
  { cle: 'pea', types: ['pea'], nom: 'PEA', rdt: 6, bloque: false, impot: 'ps' },
  { cle: 'av', types: ['assurance-vie'], nom: 'Assurance vie', rdt: 4, bloque: false, impot: 'av' },
  { cle: 'cto', types: ['cto', 'crypto'], nom: 'Compte-titres', rdt: 6, bloque: false, impot: 'pfu' },
  { cle: 'per', types: ['per'], nom: 'PER', rdt: 5, bloque: true, impot: 'per' },
  { cle: 'pee', types: ['pee'], nom: 'PEE', rdt: 4, bloque: true, impot: 'ps' },
  { cle: 'pension', types: ['pension'], nom: 'Pension', rdt: 5, bloque: true, impot: 'revenu' },
];
// Champs gardés en texte (les autres sont des nombres)
const TEXTES_PREVISION = /^(ev(Mois|Lib|Montant)\d+|primeProchaine|nouveauSalaire|moisNouveauSalaire|locatif|locatifMois|objectif|objectifType|euros)$/;
const libelleMois = mk => `${NOMS_MOIS[Number(mk.slice(5, 7)) - 1]} ${mk.slice(0, 4)}`;
const tauxMensuel = t => Math.pow(1 + t / 100, 1 / 12) - 1;

// Enveloppes présentes : valeur et versements cumulés à votre part, versements des 12 derniers mois
function enveloppes(M) {
  const today = D.today(), il12 = D.endOfMonth(D.addMonths(F.moisCourant(), -12));
  return ENVELOPPES.map(e => {
    const comptes = M.comptes.filter(c => e.types.includes(c.type) && F.ouvert(c, today));
    const somme = f => comptes.reduce((s, c) => s + f(c) * c.quotePart, 0);
    const verse = somme(c => F.versements(M, c.id, today));
    return { ...e, comptes, valeur: somme(c => F.valeur(M, c.id, today)), verse, flux: Math.max(0, verse - somme(c => F.versements(M, c.id, il12))) };
  }).filter(e => e.comptes.length);
}

// Projet de l'onglet Locatif (saisies de ce navigateur, sinon valeurs par défaut), à 100 %
function projetLocatif(M) {
  let s = {};
  try { s = JSON.parse(store.get(localStorage, LOCATIF_KEY) || '{}'); } catch { s = {}; }
  const v = { ...hypothesesParDefaut(M) };
  Object.entries(s).forEach(([k, x]) => { const n = parseNum(x); if (n != null) v[k] = n; });
  const cout = v.prix + v.travaux + v.prix * v.notaire / 100, credit = Math.max(0, cout - v.apport);
  const r = v.taux / 1200, n = v.duree * 12;
  const echeance = credit > 0 ? (r > 0 ? credit * r / (1 - Math.pow(1 + r, -n)) : credit / n) : 0;
  return { v, cout, credit, apport: Math.min(v.apport, cout), echeance, assurance: credit * v.assurance / 1200, r };
}

// Valeurs proposées par défaut, tirées des données
function hypothesesPrevision(M) {
  const V = vueDepenses(M, ''), cm = F.moisCourant(), loc = hypothesesParDefaut(M);
  // Dépenses courantes hors crédit : moyenne des 12 derniers mois complets, sans remonter avant le mois qui suit
  // le dernier achat immobilier (les mois d'avant comptaient un loyer)
  const achat = (M.immobilier || []).map(b => D.monthKey(b.dateAchat)).sort().pop();
  let debut = D.addMonths(cm, -12);
  if (achat && D.addMonths(achat, 1) > debut) debut = D.addMonths(achat, 1);
  const mois = debut < cm ? D.range(debut, D.addMonths(cm, -1)) : [];
  const horsCredit = mk => { const p = F.pnl(V, mk); return p.charges + (p.parCat.get(normKey(CAT_INTERETS)) || 0); };
  const depenses = mois.length ? mois.reduce((s, mk) => s + horsCredit(mk), 0) / mois.length : F.budgetTotal(V, cm);
  // Mois des primes : celui du plus gros virement de salaire des 3 dernières années
  const sal = M.transactions.filter(t => t.montant > 0 && normKey(t.categorie) === normKey('Salaire') && t.date >= D.addMonths(cm, -36) + '-01');
  const max = sal.reduce((a, t) => (!a || t.montant > a.montant ? t : a), null);
  const credits = (M.immobilier || []).filter(b => b.pret).reduce((s, b) => s + (parseNum(b.pret.mensualite) || 0) * Immo.part(b), 0);
  // Répartition des nouveaux placements : comme les versements des 12 derniers mois (à défaut, comme les encours)
  const env = enveloppes(M), base = env.some(e => e.flux > 0) ? 'flux' : 'valeur', tot = env.reduce((s, e) => s + e[base], 0);
  const parts = env.map(e => (tot > 0 ? Math.round(e[base] / tot * 100) : Math.round(100 / env.length)));
  if (parts.length) parts[parts.indexOf(Math.max(...parts))] += 100 - parts.reduce((s, x) => s + x, 0);
  return {
    salaire: loc.salMoi, primes: loc.primesMoi, moisPrimes: max ? Number(max.date.slice(5, 7)) : 12, primeProchaine: '', autres: 0, hausseSalaire: 2,
    nouveauSalaire: '', moisNouveauSalaire: '',
    depenses: Math.round(depenses / 10) * 10, inflation: 2,
    cible: Math.max(1000, Math.round(6 * (depenses + credits) / 1000) * 1000), partPlacee: 50,
    ...Object.fromEntries(env.flatMap((e, i) => [[`rdt_${e.cle}`, e.rdt], [`part_${e.cle}`, parts[i]]])),
    rdtEpargne: 2, rdtImmo: 1.5, horizon: 20, tmi: 30, fraisVente: 5,
    locatif: '', locatifMois: D.addMonths(cm, 12), locatifPart: 50,
    objectif: '', objectifType: 'disponible', euros: 'courants',
    ...Object.fromEntries(Array.from({ length: NB_EVENEMENTS }, (_, i) => [[`evMois${i}`, ''], [`evLib${i}`, ''], [`evMontant${i}`, '']]).flat()),
  };
}

// Mois (AAAA-MM) de la prochaine prime : celui de l'année en cours s'il n'est pas passé, sinon l'an prochain
function moisProchainePrime(moisPrimes) {
  const cm = F.moisCourant(), an = Number(cm.slice(0, 4)), mk = `${an}-${pad(Number(moisPrimes) || 12)}`;
  return mk >= cm ? mk : `${an + 1}-${mk.slice(5)}`;
}

// Projection du mois en cours jusqu'à décembre de l'année de l'horizon.
// ecarts : points ajoutés aux rendements ; extra : épargne supplémentaire chaque mois (dépenses en moins)
function projectionPrevision(M, v, ecarts = SCENARIOS.central, { extra = 0 } = {}) {
  const today = D.today(), cm = F.moisCourant(), P0 = F.patrimoine(M, today);
  const biens = (M.immobilier || []).map(b => ({ b, q: Immo.part(b), valeur: Immo.valeur(b, today) * Immo.part(b) }));
  const crd0 = biens.reduce((s, x) => s + Immo.crd(x.b, today) * x.q, 0);
  const env = enveloppes(M).map(e => ({ ...e, val: e.valeur, versements: e.verse,
    r: tauxMensuel((v['rdt_' + e.cle] ?? e.rdt) + ecarts.placements), part: Math.max(0, v['part_' + e.cle] || 0) }));
  const totPart = env.reduce((s, e) => s + e.part, 0);
  let ep = P0.par.epargne;
  // Liquidités, autres actifs et autres dettes : le reste du patrimoine net
  let liq = P0.net - ep - env.reduce((s, e) => s + e.val, 0) - biens.reduce((s, x) => s + x.valeur, 0) + crd0;
  // Échéances du prêt par mois, à votre part
  const echeances = new Map();
  biens.forEach(x => x.b.echeancier.forEach(e => {
    const mk = D.monthKey(e.date), a = echeances.get(mk) || { date: e.date, interets: 0, assurance: 0, capital: 0 };
    a.interets += e.interets * x.q; a.assurance += e.assurance * x.q; a.capital += e.capital * x.q;
    echeances.set(mk, a);
  }));
  const rEp = tauxMensuel(v.rdtEpargne), rIm = tauxMensuel(v.rdtImmo + ecarts.immo);
  const evenements = Array.from({ length: NB_EVENEMENTS }, (_, i) => ({ mois: v[`evMois${i}`], montant: parseNum(v[`evMontant${i}`]) || 0 })).filter(e => e.mois && e.montant);
  // Déjà reçu et déjà dépensé ce mois-ci : seul le reste du mois en cours est projeté
  const p = F.pnl(vueDepenses(M, ''), cm);
  const dejaRecu = p.revenus, dejaDepense = p.charges + (p.parCat.get(normKey(CAT_INTERETS)) || 0);
  const an0 = Number(cm.slice(0, 4)), g = v.hausseSalaire / 100, lignes = [];
  // Prochaine prime : montant saisi s'il y en a un, sinon la moyenne annuelle ; nouveau salaire à partir d'un mois
  const prochaine = moisProchainePrime(v.moisPrimes), primeSaisie = parseNum(v.primeProchaine);
  const nouveau = parseNum(v.nouveauSalaire), depuis = /^\d{4}-\d{2}$/.test(v.moisNouveauSalaire) ? v.moisNouveauSalaire : null;
  // Projet locatif, à votre part, acheté au mois choisi (au plus tôt ce mois-ci)
  const L = v.locatif ? projetLocatif(M) : null, qL = (v.locatifPart ?? 100) / 100;
  const achatL = L ? ([v.locatifMois, cm].filter(x => /^\d{4}-\d{2}$/.test(x)).sort().pop()) : null;
  const rLv = L ? tauxMensuel(L.v.revalBien + ecarts.immo) : 0;
  let locVal = 0, locCrd = 0, locK = -1;
  D.range(cm, `${an0 + v.horizon}-12`).forEach((mk, i) => {
    const ans = Number(mk.slice(0, 4)) - an0;
    const kRev = Math.pow(1 + g, ans), kDep = Math.pow(1 + v.inflation / 100, ans);
    const salaire = nouveau != null && depuis && mk >= depuis ? nouveau * Math.pow(1 + g, Number(mk.slice(0, 4)) - Number(depuis.slice(0, 4))) : v.salaire * kRev;
    const prime = Number(mk.slice(5, 7)) !== v.moisPrimes ? 0 : mk === prochaine && primeSaisie != null ? primeSaisie : v.primes * kRev;
    let revenus = salaire + v.autres * kRev + prime;
    let depenses = v.depenses * kDep - (i > 0 ? extra : 0);
    if (i === 0) { revenus = Math.max(0, revenus - dejaRecu); depenses = Math.max(0, depenses - dejaDepense); }
    const e = echeances.get(mk), dueEnsuite = e && (i > 0 || e.date > today);
    let interets = dueEnsuite ? e.interets : 0, assurance = dueEnsuite ? e.assurance : 0, capital = dueEnsuite ? e.capital : 0;
    let evts = evenements.filter(x => x.mois === mk).reduce((s, x) => s + x.montant, 0);
    // Projet locatif : apport le mois de l'achat, puis loyers, charges et échéances
    let apportBien = 0, achatLocatif = 0;
    if (L && mk >= achatL) {
      if (mk === achatL) {
        locVal = L.v.prix * qL; locCrd = L.credit * qL; locK = 0;
        achatLocatif = -L.apport * qL; evts += achatLocatif; apportBien = locVal - locCrd;
      } else {
        locK++;
        const an = Math.floor((locK - 1) / 12);
        revenus += L.v.loyer * (1 - L.v.vacance / 12) * Math.pow(1 + L.v.revalLoyer / 100, an) * qL;
        depenses += L.v.chargesLoc * Math.pow(1 + L.v.revalCharges / 100, an) * qL;
        if (locCrd > 0.005) {
          const iL = locCrd * L.r, cL = Math.min(locCrd, L.echeance * qL - iL);
          interets += iL; capital += cL; assurance += L.assurance * qL; locCrd -= cL;
        }
      }
    }
    // Épargne du mois, capital des crédits compris (il réduit la dette) ; le reste est disponible pour vos comptes
    const epargne = revenus - depenses - interets - assurance + evts, disponible = epargne - capital;
    // Rendements sur les soldes de début de mois (le mois en cours au prorata des jours restants)
    const prorata = i === 0 ? (D.daysInMonth(mk) - Number(today.slice(8, 10))) / D.daysInMonth(mk) : 1;
    let rendements = ep * rEp * prorata;
    ep += ep * rEp * prorata;
    env.forEach(x => { const gx = x.val * x.r * prorata; x.val += gx; rendements += gx; });
    let valorisation = 0;
    biens.forEach(x => { const gx = x.valeur * rIm * prorata; x.valeur += gx; valorisation += gx; });
    if (L && mk > achatL) { const gx = locVal * rLv; locVal += gx; valorisation += gx; }
    if (disponible >= 0) {
      const versPrecaution = totPart > 0 ? Math.min(Math.max(0, v.cible - ep), disponible * (1 - v.partPlacee / 100)) : disponible;
      ep += versPrecaution;
      env.forEach(x => { const a = (disponible - versPrecaution) * x.part / (totPart || 1); x.val += a; x.versements += a; });
    } else {
      // Retraits : liquidités, épargne, puis placements disponibles au prorata ; au-delà, découvert
      let manque = -disponible;
      const puiser = solde => { const x = Math.min(Math.max(0, solde), manque); manque -= x; return x; };
      liq -= puiser(liq); ep -= puiser(ep);
      const libres = env.filter(x => !x.bloque), totLibre = libres.reduce((s, x) => s + Math.max(0, x.val), 0);
      if (manque > 0 && totLibre > 0) {
        const pris = Math.min(manque, totLibre);
        libres.forEach(x => { const a = pris * Math.max(0, x.val) / totLibre; x.versements *= x.val > 0 ? 1 - a / x.val : 1; x.val -= a; });
        manque -= pris;
      }
      liq -= manque;
    }
    const immo = biens.reduce((s, x) => s + x.valeur, 0) + locVal;
    const crd = biens.reduce((s, x) => s + Immo.crd(x.b, D.endOfMonth(mk)) * x.q, 0) + locCrd;
    const plDispo = env.filter(x => !x.bloque).reduce((s, x) => s + x.val, 0), plBloque = env.filter(x => x.bloque).reduce((s, x) => s + x.val, 0);
    const net = liq + ep + plDispo + plBloque + immo - crd;
    // Impôt si tout était retiré, et frais de vente des biens
    const tmi = v.tmi / 100, impots = env.reduce((s, x) => {
      const gain = Math.max(0, x.val - x.versements);
      return s + ({ ps: gain * 0.172, av: gain * 0.247, pfu: gain * 0.3, per: Math.max(0, x.versements) * tmi + gain * 0.3, revenu: x.val * tmi }[x.impot] || 0);
    }, 0);
    lignes.push({ mk, revenus, depenses, interets, assurance, capital, evts, achatLocatif, epargne, rendements, valorisation, apportBien,
      liq, ep, plDispo, plBloque, immo, crd, net, dispo: liq + ep + plDispo, sortie: net - impots - immo * v.fraisVente / 100 });
  });
  return { net0: P0.net, lignes };
}

// Montants en euros d'aujourd'hui : chaque mois est ramené à aujourd'hui avec la hausse des dépenses (inflation)
function enEurosConstants(R, inflation) {
  return { ...R, lignes: R.lignes.map((x, i) => {
    const k = Math.pow(1 + inflation / 100, i / 12);
    return Object.fromEntries(Object.entries(x).map(([c, y]) => [c, typeof y === 'number' ? y / k : y]));
  }) };
}

// Patrimoine prévu (photo prise un mois précédent) face au patrimoine réalisé, sur les 12 derniers mois
function comparaisonPrevision(M) {
  const photos = M.previsionDepot?.photos || [], cm = F.moisCourant();
  return D.range(D.addMonths(cm, -12), D.addMonths(cm, -1)).map(mk => {
    const p = photos.filter(x => x.mois < mk && x.net?.[mk] != null).sort((a, b) => a.mois.localeCompare(b.mois)).pop();
    return p ? { mk, photo: p.mois, prevu: p.net[mk], reel: F.patrimoine(M, D.endOfMonth(mk)).net } : null;
  }).filter(Boolean);
}

  <script>
'use strict';

/* ---------- Investissement locatif : capacité d'emprunt et projection du projet ----------
   Capacité : règles du Haut Conseil de stabilité financière (HCSF) appliquées par les banques ; mensualités de tous
   les crédits, assurance comprise, au plus 35 % des revenus nets avant impôt, durée au plus 25 ans. Le loyer attendu
   est retenu à 70 %, comme le font la plupart des banques. Le crédit en cours (mensualité et assurance des deux
   emprunteurs) vient d'immobilier.json.
   Projet : coût total (prix, travaux, frais de notaire) moins l'apport = crédit nécessaire ; on vérifie que sa
   mensualité tient dans la capacité, puis on projette année par année les loyers (revalorisés, nets de la vacance),
   les charges (indexées) et les échéances, jusqu'à la revente à la fin de la détention. Le TRI porte sur les fonds
   propres : l'apport au départ, les cash-flows chaque année, puis le prix de revente moins le capital restant dû.
   Montants avant impôt. Les hypothèses saisies (dont le salaire du conjoint) restent dans ce navigateur : elles ne
   sont ni dans la page publiée ni dans le dépôt. */

const LOCATIF_KEY = 'suivi-comptes.locatif';
const HCSF = { endettement: 0.35, loyerRetenu: 0.7 };

// Mensualité (assurance comprise) d'un prêt de 1 € : taux et assurance annuels en %, durée en années
function coefMensuel(taux, ans, assurance) {
  const r = taux / 100 / 12, n = ans * 12;
  return (r > 0 ? r / (1 - Math.pow(1 + r, -n)) : 1 / n) + assurance / 100 / 12;
}

// Valeurs proposées par défaut, tirées des données : salaire habituel (médiane des virements de salaire des 12
// derniers mois) et moyenne annuelle des primes sur les 3 dernières années disponibles. Une prime = la part d'un
// virement qui dépasse de plus de 30 % le salaire habituel de l'époque (médiane des virements à ± 6 mois).
function hypothesesParDefaut(M) {
  const cm = F.moisCourant(), fin = cm + '-01';
  const ops = M.transactions.filter(t => t.date >= D.addMonths(cm, -36) + '-01' && t.date < fin && t.montant > 0 && normKey(t.categorie) === normKey('Salaire'));
  const mediane = l => l.length ? [...l].sort((a, b) => a - b)[Math.floor(l.length / 2)] : 0;
  const med = mediane(ops.filter(t => t.date >= D.addMonths(cm, -12) + '-01').map(t => t.montant));
  const proches = t => ops.filter(x => Math.abs(D.diffDays(x.date, t.date)) <= 183).map(x => x.montant);
  const surplus = ops.reduce((s, t) => { const ref = mediane(proches(t)); return s + (t.montant > 1.3 * ref ? t.montant - ref : 0); }, 0);
  const annees = ops.length ? Math.max(1, Math.min(3, (D.diffDays(ops[0].date, fin) + 15) / 365.25)) : 1;
  const primes = surplus / annees;
  return {
    salMoi: Math.round(med), moisMoi: 12, primesMoi: Math.round(primes / 100) * 100, partMoi: 70, autresMoi: 0,
    salConjoint: '', moisConjoint: 12, primesConjoint: 0, partConjoint: 70, autresConjoint: 0,
    prix: 150000, travaux: 0, notaire: 8, apport: 20000,
    loyer: 750, vacance: 0.5, chargesLoc: 150, revalLoyer: 1.5, revalCharges: 2, revalBien: 1.5, detention: 20,
    taux: 3.65, duree: 25, assurance: 0.30 };
}
const PERSONNES = [{ cle: 'Moi', nom: 'Vous' }, { cle: 'Conjoint', nom: 'Conjoint' }];
// Revenus mensuels retenus d'une personne : salaire sur n mois ramené au mois, plus la part retenue des primes
const revenusPersonne = (v, cle) => v['sal' + cle] * (v['mois' + cle] || 12) / 12 + v['primes' + cle] * v['part' + cle] / 100 / 12 + v['autres' + cle];

// Crédit en cours : mensualité et assurance de l'échéance du mois (les deux emprunteurs)
function creditsEnCours(M) {
  const today = D.today();
  return (M.immobilier || []).filter(b => b.pret && b.echeancier?.length).map(b => {
    const e = b.echeancier.find(x => x.date >= today) || b.echeancier[b.echeancier.length - 1];
    return { nom: b.pret.nom || b.nom, mensualite: parseNum(b.pret.mensualite) || 0, assurance: e.assurance || 0, fin: b.echeancier[b.echeancier.length - 1].date };
  });
}

// Projection annuelle du projet : crédit amorti mois par mois, loyers et charges revalorisés, revente en fin de détention
function projectionLocatif(v) {
  const cout = v.prix + v.travaux + v.prix * v.notaire / 100;
  const credit = Math.max(0, cout - v.apport), fondsPropres = Math.min(v.apport, cout);
  const r = v.taux / 100 / 12, n = v.duree * 12;
  const echeance = credit > 0 ? (r > 0 ? credit * r / (1 - Math.pow(1 + r, -n)) : credit / n) : 0;
  const assurance = credit * v.assurance / 100 / 12;
  const annees = []; let crd = credit, cumul = 0;
  const H = Math.max(1, Math.round(v.detention));
  for (let a = 1; a <= H; a++) {
    let interets = 0, capital = 0, credits = 0;
    for (let m = 0; m < 12; m++) {
      if (crd <= 0.005) break;
      const i = crd * r, c = Math.min(crd, echeance - i);
      interets += i; capital += c; crd -= c; credits += echeance + assurance;
    }
    const loyers = v.loyer * 12 * Math.pow(1 + v.revalLoyer / 100, a - 1) * (1 - v.vacance / 12);
    const charges = v.chargesLoc * 12 * Math.pow(1 + v.revalCharges / 100, a - 1);
    const valeur = v.prix * Math.pow(1 + v.revalBien / 100, a);
    const cashflow = loyers - charges - credits;
    cumul += cashflow;
    annees.push({ a, loyers, charges, credits, interets, capital, crd: Math.max(0, crd), cashflow, cumul, valeur });
  }
  const der = annees[annees.length - 1], revente = der.valeur - der.crd;
  // TRI des fonds propres : apport, cash-flows annuels, puis revente nette du capital restant dû
  const flux = [-fondsPropres, ...annees.map((x, i) => x.cashflow + (i === annees.length - 1 ? revente : 0))];
  const van = t => flux.reduce((s, f, i) => s + f / Math.pow(1 + t, i), 0);
  let tri = null;
  if (fondsPropres > 0) {
    let lo = -0.99, hi = 1;
    while (van(lo) * van(hi) > 0 && hi < 1e3) hi *= 2;
    if (van(lo) * van(hi) <= 0) { for (let k = 0; k < 200; k++) { const m = (lo + hi) / 2; if (van(lo) * van(m) <= 0) hi = m; else lo = m; } tri = (lo + hi) / 2; }
  }
  return { cout, credit, fondsPropres, mensualite: echeance + assurance, annees, revente, tri,
    gainTotal: flux.reduce((s, f) => s + f, 0), effortMax: Math.min(0, ...annees.map(x => x.cashflow)) };
}
