<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#030b17">
  <title>Desk Patrimoine</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%234f6bff'/%3E%3Crect x='13' y='34' width='10' height='17' rx='3' fill='white'/%3E%3Crect x='27' y='23' width='10' height='28' rx='3' fill='white'/%3E%3Crect x='41' y='13' width='10' height='38' rx='3' fill='white'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <style>
/* Thème « néobanque » : sombre bleu nuit par défaut, clair en option (bouton ◐) */
:root {
  color-scheme: dark;
  --page: #030b17;
  --page-glow: radial-gradient(1200px 700px at 8% -10%, rgba(38, 92, 170, .55), transparent 60%), radial-gradient(900px 600px at 100% 0%, rgba(20, 60, 120, .25), transparent 60%);
  --sidebar: rgba(4, 14, 30, .72);
  --surface: #161d27;
  --surface-2: #222b37;
  --surface-3: #2c3643;
  --border: rgba(255, 255, 255, .07);
  --text: #f5f7fa;
  --text-2: #b6c0cd;
  --muted: #7d8898;
  --grid: rgba(255, 255, 255, .06);
  --axis: rgba(255, 255, 255, .14);
  --series-1: #24c99a; --series-2: #ff7a45; --series-3: #5b8cff; --series-4: #f5b83d;
  --series-5: #e86fa8; --series-6: #9b7bff; --series-7: #35c3e8; --series-8: #ff5c64;
  --div-pos: #24c99a;
  --div-neg: #ff5c64;
  --good: #24c99a; --warning: #f5b83d; --critical: #ff5c64;
  --good-text: #2fd6a4; --critical-text: #ff6b72; --warning-text: #f5b83d;
  --critical-soft: rgba(255, 92, 100, .14);
  --accent: #4f6bff;
  --accent-soft: rgba(79, 107, 255, .18);
  --radius: 22px;
  --radius-sm: 14px;
}
:root[data-theme="light"] {
  color-scheme: light;
  --page: #f2f4f8;
  --page-glow: radial-gradient(1200px 600px at 8% -10%, rgba(79, 107, 255, .12), transparent 60%);
  --sidebar: rgba(255, 255, 255, .78);
  --surface: #ffffff;
  --surface-2: #f0f2f6;
  --surface-3: #e5e8ee;
  --border: rgba(10, 20, 40, .07);
  --text: #0a1120;
  --text-2: #4a5568;
  --muted: #8a94a6;
  --grid: rgba(10, 20, 40, .06);
  --axis: rgba(10, 20, 40, .14);
  --series-1: #12a982; --series-2: #f0662f; --series-3: #4069f5; --series-4: #d99a12;
  --series-5: #d6528f; --series-6: #7a5af0; --series-7: #1aa6cc; --series-8: #e5484f;
  --div-pos: #12a982; --div-neg: #e5484f;
  --good: #12a982; --warning: #d99a12; --critical: #e5484f;
  --good-text: #0b8a68; --critical-text: #cf3a41; --warning-text: #a26f00;
  --critical-soft: rgba(229, 72, 79, .09);
  --accent: #3d5afe;
  --accent-soft: rgba(61, 90, 254, .10);
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--page-glow), var(--page); background-attachment: fixed; color: var(--text);
  font: 14px/1.45 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  font-feature-settings: "tnum" 1, "cv11" 1;
  -webkit-font-smoothing: antialiased; min-height: 100vh;
}
a { color: var(--accent); }
h1 { font-size: 34px; font-weight: 800; margin: 0; letter-spacing: -.025em; }
h2 { font-size: 15px; font-weight: 600; margin: 0; color: var(--text-2); }
code { background: var(--surface-2); padding: 1px 6px; border-radius: 6px; font-size: 12px; }

/* Barre latérale (barre d'onglets en bas d'écran sur mobile) */
.sidebar {
  position: fixed; inset: 0 auto 0 0; width: 104px; z-index: 10;
  display: flex; flex-direction: column; align-items: center; gap: 22px; padding: 20px 8px;
  background: var(--sidebar); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  border-right: 1px solid var(--border);
}
.brand {
  width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center;
  background: var(--text); color: var(--page); font-weight: 800; font-size: 18px; letter-spacing: -.04em; text-decoration: none;
}
.tabs { display: flex; flex-direction: column; gap: 10px; width: 100%; }
.tabs a {
  display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 6px 4px; border-radius: 16px;
  color: var(--text-2); text-decoration: none; font-weight: 600; font-size: 12px; text-align: center; line-height: 1.2;
}
.tabs svg { width: 46px; height: 40px; padding: 9px 12px; border-radius: 14px; fill: currentColor; transition: background .15s; }
.tabs svg .cut { fill: none; stroke: var(--sidebar); stroke-width: 2.2; }
.tabs a:hover { color: var(--text); }
.tabs a:hover svg { background: var(--surface-2); }
.tabs a[aria-current="page"] { color: var(--text); }
.tabs a[aria-current="page"] svg { background: var(--surface-3); }
.tools { margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.tool-btns { display: flex; gap: 6px; }
.pill { font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); color: var(--text-2); white-space: nowrap; }
.pill.demo { box-shadow: inset 0 0 0 1px var(--warning); }
.pill.github { box-shadow: inset 0 0 0 1px var(--good); }
.icon-btn {
  width: 36px; height: 36px; border-radius: 999px; border: 0; background: var(--surface-2);
  color: var(--text-2); font-size: 16px; cursor: pointer;
}
.icon-btn:hover { background: var(--surface-3); color: var(--text); }

/* Mise en page */
main { max-width: 1320px; margin: 0 auto; padding: 28px 32px 48px 136px; }
.page-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 22px; }
.page-h p { margin: 0; flex-basis: 100%; color: var(--muted); }
/* Sous-onglets (Dépenses : une banque ou tous les comptes) */
.onglets { display: flex; gap: 8px; flex-wrap: wrap; margin: -6px 0 18px; }
.onglet {
  border: 0; border-radius: 999px; padding: 8px 16px; background: var(--surface-2); color: var(--text-2);
  font: inherit; font-weight: 600; cursor: pointer;
}
.onglet:hover { background: var(--surface-3); color: var(--text); }
.onglet[aria-pressed="true"] { background: var(--text); color: var(--page); }
.note-interne { margin: 12px 0 0; }
tr.ligne-courante td { background: var(--accent-soft); font-weight: 600; }
/* Sections repliables */
.repli > summary { list-style: none; cursor: pointer; margin-bottom: 0; }
.repli > summary::-webkit-details-marker { display: none; }
.repli > summary .chevron { color: var(--muted); font-size: 18px; transition: transform .15s; }
.repli[open] > summary { margin-bottom: 16px; }
.repli[open] > summary .chevron { transform: rotate(90deg); }
.repli > summary:hover h2 { color: var(--text); }

/* Épargne : bloc principal, anneau, cartes par support */
.epargne-hero { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 24px; align-items: center;
  background: linear-gradient(135deg, var(--hero-tint, rgba(79, 107, 255, .2)), transparent 60%), var(--surface); }
.epargne-hero .hero-value { margin: 4px 0 6px; }
.donut-wrap { display: grid; gap: 14px; justify-items: center; }
.donut-wrap .chart { width: 200px; }
.legende { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; width: 100%; font-size: 13px; }
.legende li { display: flex; align-items: center; gap: 8px; }
.legende .pastille { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.legende .val { margin-left: auto; color: var(--text-2); }
.supports { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.support { all: unset; box-sizing: border-box; cursor: pointer; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 14px 16px; border-top: 4px solid var(--c); display: grid; gap: 2px; }
.support:hover { background: var(--surface-2); }
.support:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.support .nom { font-size: 13px; color: var(--text-2); font-weight: 600; }
.support .montant { font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
.support .detail { font-size: 12px; color: var(--muted); }
.onglet[aria-pressed="true"][style*="--c"] { background: var(--c); color: #fff; }

/* Dépenses : tuiles par catégorie */
.titre-section { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin: 4px 2px 12px; }
.titre-section h2 { font-size: 18px; margin: 0; }
.titre-section.sous { margin-top: 22px; }
.titre-section h3 { font-size: 14px; margin: 0; color: var(--text-2); }
.cat-tuiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.cat-tuiles.petites { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
.cat-tuile { all: unset; box-sizing: border-box; cursor: pointer; display: grid; gap: 6px; padding: 14px 16px; border-radius: var(--radius-sm);
  background: linear-gradient(160deg, color-mix(in srgb, var(--c, var(--muted)) 16%, transparent), transparent 70%), var(--surface); border: 1px solid var(--border); }
.cat-tuile:hover { background-color: var(--surface-2); }
.cat-tuile:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.cat-tuile.sel { border-color: var(--c, var(--text)); box-shadow: 0 0 0 1px var(--c, var(--text)); }
.cat-tuile.vide { opacity: .55; }
.cat-tuile .nom { font-size: 13px; font-weight: 600; color: var(--text-2); display: flex; align-items: center; gap: 8px; min-width: 0; }
.cat-tuile .montant { font-size: 22px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.cat-tuile .detail { font-size: 12px; color: var(--muted); }
.cat-tuile .jauge { position: relative; height: 6px; border-radius: 4px; background: var(--surface-3); }
.cat-tuile .jauge > span { display: block; height: 100%; border-radius: 4px; background: var(--c); }
.cat-tuile .jauge > span.over { background: var(--critical); }
.cat-tuile .jauge i { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--text); opacity: .5; }
.cat-tuile.hors { background: var(--surface); }
.cat-tuile.hors .montant { font-size: 18px; }
.pastille { display: inline-block; width: 10px; height: 10px; border-radius: 3px; flex: none; background: var(--c); vertical-align: middle; }
.jauge-budget { margin: 6px 0 12px; max-width: 520px; }
.hero-kpis { margin: 14px 0 10px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.ops-wrap { max-height: 560px; overflow-y: auto; }
@media (max-width: 760px) {
  .epargne-hero { grid-template-columns: 1fr; }
  .cat-tuiles, .cat-tuiles.petites { grid-template-columns: 1fr 1fr; gap: 10px; }
  .cat-tuile { padding: 12px; }
  .cat-tuile .montant { font-size: 19px; }
  /* Opérations : une carte par opération (libellé, puis date et montant, puis catégorie) */
  table.ops-cat, table.ops-cat tbody, table.ops-cat td { display: block; }
  table.ops-cat tr { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  table.ops-cat td { padding: 0; }
  table.ops-cat td:nth-child(2) { grid-column: 1 / -1; grid-row: 1; }
  table.ops-cat td:nth-child(1) { grid-row: 2; }
  table.ops-cat td:nth-child(3) { grid-row: 2; text-align: right; }
  table.ops-cat td:nth-child(4) { grid-column: 1 / -1; }
  table.ops-cat .small-select select { max-width: none; }
}

/* Points d'attention (vue d'ensemble) */
.attentions { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.attention { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; background: var(--surface-2); border-radius: var(--radius-sm); }
.attention .status { flex: none; margin-top: 1px; }

/* Recommandations */
.recos { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.reco { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; }
.reco h3 { margin: 0; font-size: 15px; line-height: 1.35; }
.reco p { margin: 0; font-size: 13.5px; line-height: 1.5; }
.reco .link { margin-top: auto; }
.reco-h { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.reco-rang { font-size: 12px; font-weight: 700; color: var(--text-2); min-width: 20px; }
.reco-h .status { font-size: 12px; font-weight: 600; }
@media (max-width: 900px) { .recos { grid-template-columns: 1fr; } }
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 18px; }
.span-4 { grid-column: span 4; } .span-5 { grid-column: span 5; } .span-6 { grid-column: span 6; }
.span-7 { grid-column: span 7; } .span-8 { grid-column: span 8; } .span-12 { grid-column: span 12; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px 24px; min-width: 0; }
.card-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 16px; }
.card-h h2::after { content: " ›"; color: var(--muted); font-weight: 500; }
.card-sub { margin: 3px 0 0; color: var(--muted); font-size: 12px; }

.muted { color: var(--muted); }
.small { font-size: 12px; }
.center { text-align: center; }
.pad { padding: 32px 0; }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pos { color: var(--good-text); }
.neg { color: var(--critical-text); }
.row-between { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.link { font-weight: 600; text-decoration: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* Chiffres clés */
.hero { display: grid; grid-template-columns: minmax(260px, 1fr) 2fr; gap: 28px; align-items: center;
  background: linear-gradient(135deg, rgba(79, 107, 255, .22), transparent 55%), var(--surface); }
.hero .kpi-label { font-size: 14px; }
.hero-value { font-size: 48px; font-weight: 800; letter-spacing: -.035em; line-height: 1.05; margin: 6px 0 12px; }
.hero-deltas { display: grid; gap: 5px; font-size: 13px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.kpi { background: var(--surface-2); border-radius: var(--radius-sm); padding: 14px 16px; min-width: 0; }
.kpi-label { font-size: 13px; color: var(--text-2); font-weight: 500; }
.kpi-value { font-size: 26px; font-weight: 800; margin: 3px 0; letter-spacing: -.025em; }
.kpi-sub { font-size: 12px; color: var(--muted); }
.delta { font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.delta.up { color: var(--good-text); }
.delta.down { color: var(--critical-text); }
.delta.flat { color: var(--text-2); }

/* Mobile : barre d'onglets en bas */
@media (max-width: 760px) {
  .sidebar {
    inset: auto 0 0 0; width: auto; height: auto; flex-direction: row; justify-content: space-around; gap: 0;
    padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); border-right: 0; border-top: 1px solid var(--border);
  }
  .brand, .tools .pill { display: none; }
  .tabs { flex-direction: row; justify-content: space-around; gap: 0; flex: 1; min-width: 0; }
  .tabs a { flex: 1 1 0; min-width: 0; font-size: 9.5px; gap: 2px; padding: 2px 1px; }
  .tabs a span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .tabs svg { width: 34px; height: 30px; padding: 5px 8px; }
  .tools { margin: 0; }
  .tool-btns { flex-direction: column; gap: 4px; }
  .icon-btn { width: 30px; height: 30px; font-size: 14px; }
  main { padding: 18px 16px 96px; }
  h1 { font-size: 28px; }
  .hero-value { font-size: 38px; }
  .kpis { grid-template-columns: 1fr 1fr; gap: 10px; }
  .kpi { padding: 12px; }
  .kpi-value { font-size: 21px; overflow-wrap: anywhere; }
  .kpi-value .delta { white-space: normal; }
}

/* Statuts : toujours icône + libellé */
.status { font-size: 12px; font-weight: 600; white-space: nowrap; }
.status.good { color: var(--good-text); }
.status.warning { color: var(--warning-text); }
.status.critical { color: var(--critical-text); }
.status.neutral { color: var(--text-2); }
.tag { font-size: 11px; color: var(--text-2); background: var(--surface-2); border-radius: 999px; padding: 1px 8px; font-weight: 500; }

/* Barres de progression */
.track { position: relative; height: 8px; border-radius: 999px; background: var(--surface-2); overflow: visible; }
.track.big { height: 14px; margin: 10px 0 8px; }
.fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--accent), #7d93ff); }
.fill.over { background: var(--critical); }
.pace { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--text); border-radius: 1px; opacity: .55; }

table.ops-cat td { padding: 5px 6px; font-size: 13px; vertical-align: middle; }
.small-select select { min-width: 0; width: 100%; max-width: 210px; padding: 5px 10px; font-size: 13px; }
.kpis-2 { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
.corr-bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin: 0 0 14px; font-size: 13px; color: var(--text-2); }
.corr-bar .check { display: flex; gap: 6px; align-items: center; cursor: pointer; }
.corr-status { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.btn.small { padding: 6px 14px; font-size: 13px; }
.budget-sum { margin-bottom: 14px; }
.facts { display: grid; gap: 8px; margin: 0 0 12px; }
.facts div { display: flex; justify-content: space-between; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
.facts dt { color: var(--text-2); }
.facts dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
.alloc { display: grid; gap: 14px; }
.alloc .track { margin-top: 6px; }

/* Tableaux */
.table-wrap { overflow-x: auto; margin: 0 -4px; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 10px 8px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
thead th { font-size: 12px; color: var(--muted); font-weight: 500; }
tfoot td, tfoot th { font-weight: 650; border-bottom: 0; }
tbody tr:hover { background: rgba(127, 140, 160, .07); }
.hist th[scope="row"] { font-weight: 500; }
.over-cell { background: var(--critical-soft); }
.over-cell .ico { color: var(--critical-text); font-size: 10px; }
.stale { color: var(--warning-text); }
.nowrap { white-space: nowrap; }
tr.ligne-clic { cursor: pointer; }
tr.ligne-clic:focus-visible { outline: 2px solid var(--accent, currentColor); outline-offset: -2px; }
tr.ligne-clic .chevron { display: inline-block; color: var(--text-2, inherit); transition: transform .15s; }
tr.ligne-clic.ouvert .chevron { transform: rotate(90deg); }
tr.ligne-detail > td { background: var(--surface-2); padding: 10px 12px 14px; }
tr.ligne-detail:hover { background: none; }
table.ops { width: auto; min-width: 60%; }
table.ops th, table.ops td { padding: 5px 10px; font-size: .9em; }
.heat-table th, .heat-table td { padding: 7px 6px; }
.heat-table td.heat { border-left: 2px solid var(--surface); }
.heat-table th[scope="row"] { font-weight: 500; white-space: nowrap; }
.strong-cell { font-weight: 650; border-left: 1px solid var(--border); }

.chart { position: relative; width: 100%; }

/* Formulaire */
.form { display: grid; gap: 14px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form label { display: grid; gap: 4px; font-size: 13px; color: var(--text-2); font-weight: 500; }
.form label.check { display: flex; gap: 8px; align-items: flex-start; font-weight: 400; }
input:not([type="checkbox"]), select {
  font: inherit; color: var(--text); background: var(--surface-2); border: 1px solid transparent;
  border-radius: 12px; padding: 9px 12px; width: 100%;
}
input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.select select { width: auto; min-width: 200px; border-radius: 999px; padding: 10px 16px; font-weight: 600; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btn {
  font: inherit; font-weight: 600; padding: 10px 18px; border-radius: 999px; cursor: pointer; text-decoration: none; display: inline-block;
  border: 0; background: var(--surface-2); color: var(--text);
}
.btn:hover { background: var(--surface-3); }
.btn.primary { background: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; color: var(--text-2); }
.steps { padding-left: 18px; margin: 0 0 12px; display: grid; gap: 8px; }
.alert { border-radius: var(--radius-sm); padding: 12px 16px; margin-bottom: 14px; font-size: 13px; background: var(--surface-2); border-left: 3px solid var(--muted); }
.alert ul { margin: 6px 0 0; padding-left: 18px; }

  <script>
'use strict';

/* ---------- Formatage ---------- */
const FMT = {
  eur0: new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }),
  eur2: new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR', minimumFractionDigits: 2, maximumFractionDigits: 2 }),
  eurK: new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR', notation: 'compact', maximumFractionDigits: 1 }),
  pct1: new Intl.NumberFormat('fr-FR', { style: 'percent', minimumFractionDigits: 1, maximumFractionDigits: 1 }),
};
const eur = (v, dec) => (dec ? FMT.eur2 : FMT.eur0).format(v || 0);
const eurShort = v => Math.abs(v) >= 1000 ? FMT.eurK.format(v) : FMT.eur0.format(v);
const eurSigned = (v, dec) => (v > 0 ? '+' : '') + eur(v, dec);
const pct = v => (v == null || !isFinite(v)) ? '—' : FMT.pct1.format(v);
const pctSigned = v => (v == null || !isFinite(v)) ? '—' : (v > 0 ? '+' : '') + FMT.pct1.format(v);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const normKey = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();

/* ---------- Dates (chaînes AAAA-MM-JJ, mois AAAA-MM) ---------- */
const pad = n => String(n).padStart(2, '0');
const D = {
  iso: d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()),
  today: () => D.iso(new Date()),
  monthKey: s => s.slice(0, 7),
  addMonths(mk, n) {
    let [y, m] = mk.split('-').map(Number);
    m += n;
    y += Math.floor((m - 1) / 12);
    m = ((m - 1) % 12 + 12) % 12 + 1;
    return y + '-' + pad(m);
  },
  daysInMonth(mk) { const [y, m] = mk.split('-').map(Number); return new Date(y, m, 0).getDate(); },
  endOfMonth: mk => mk + '-' + pad(D.daysInMonth(mk)),
  range(from, to) { const out = []; for (let m = from; m <= to; m = D.addMonths(m, 1)) out.push(m); return out; },
  monthLabel(mk, long) {
    const [y, m] = mk.split('-').map(Number);
    return new Date(y, m - 1, 1).toLocaleDateString('fr-FR', long ? { month: 'long', year: 'numeric' } : { month: 'short', year: '2-digit' });
  },
  fmt: s => s ? s.slice(8, 10) + '/' + s.slice(5, 7) + '/' + s.slice(0, 4) : '—',
  diffDays: (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000),
};

/* ---------- Lecture CSV / nombres / dates ---------- */
function parseCSV(text) {
  const lines = String(text).replace(/^﻿/, '').split(/\r?\n/).filter(l => l.trim() !== '');
  if (!lines.length) return [];
  const sep = lines[0].split(';').length >= lines[0].split(',').length ? ';' : ',';
  const split = line => {
    const out = []; let cur = '', q = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (q) {
        if (c === '"') { if (line[i + 1] === '"') { cur += '"'; i++; } else q = false; }
        else cur += c;
      } else if (c === '"') q = true;
      else if (c === sep) { out.push(cur); cur = ''; }
      else cur += c;
    }
    out.push(cur);
    return out.map(s => s.trim());
  };
  const head = split(lines[0]).map(normKey);
  return lines.slice(1).map(l => {
    const cells = split(l), o = {};
    head.forEach((h, i) => { o[h] = cells[i] ?? ''; });
    return o;
  });
}

function parseNum(s) {
  if (s == null) return null;
  if (typeof s === 'number') return isFinite(s) ? s : null;
  s = String(s).replace(/[\s  €]/g, '');
  if (s === '') return null;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  const n = Number(s);
  return isFinite(n) ? n : null;
}

function parseDate(s) {
  s = String(s ?? '').trim();
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (m) return `${m[3]}-${pad(m[2])}-${pad(m[1])}`;
  return null;
}

/* ---------- Accès GitHub ---------- */
const FICHIERS = { comptes: 'comptes.json', soldes: 'soldes.csv', transactions: 'transactions.csv', budget: 'budget.json' };

async function ghFetch(cfg, file) {
  const path = [cfg.dossier, file].filter(Boolean).join('/').replace(/^\/+|\/+$/g, '').split('/').map(encodeURIComponent).join('/');
  const url = `https://api.github.com/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}/contents/${path}?ref=${encodeURIComponent(cfg.branche || 'main')}`;
  const headers = { Accept: 'application/vnd.github.raw+json' };
  if (cfg.token) headers.Authorization = 'Bearer ' + cfg.token;
  let r;
  try { r = await fetch(url, { headers, cache: 'no-store' }); }
  catch (e) { throw new Error(`Impossible de joindre GitHub (${file}). Vérifiez votre connexion.`); }
  if (!r.ok) {
    const why = {
      401: 'token invalide ou expiré',
      403: 'accès refusé (droits du token insuffisants ou limite d’appels atteinte)',
      404: 'fichier introuvable, ou dépôt non accessible avec ce token',
    }[r.status] || `erreur HTTP ${r.status}`;
    throw new Error(`${file} : ${why}.`);
  }
  return r.text();
}

// Écrit un fichier du dépôt (nécessite un token avec Contents : Read and write).
async function ghPut(cfg, file, text, message) {
  const path = [cfg.dossier, file].filter(Boolean).join('/').replace(/^\/+|\/+$/g, '').split('/').map(encodeURIComponent).join('/');
  const url = `https://api.github.com/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}/contents/${path}`;
  const headers = { Accept: 'application/vnd.github+json', Authorization: 'Bearer ' + cfg.token };
  const branche = cfg.branche || 'main';
  let sha;
  const g = await fetch(`${url}?ref=${encodeURIComponent(branche)}`, { headers, cache: 'no-store' });
  if (g.ok) sha = (await g.json()).sha;
  const bytes = new TextEncoder().encode(text);
  const content = btoa(Array.from(bytes, b => String.fromCharCode(b)).join(''));
  const r = await fetch(url, { method: 'PUT', headers, body: JSON.stringify({ message, content, branch: branche, ...(sha ? { sha } : {}) }) });
  if (!r.ok) {
    throw new Error(r.status === 403 || r.status === 404
      ? 'votre token n’a que le droit de lecture (il faut « Contents : Read and write » pour enregistrer)'
      : `erreur HTTP ${r.status}`);
  }
}

async function loadFromGitHub(cfg) {
  const [c, s, t, b] = await Promise.all(Object.values(FICHIERS).map(f => ghFetch(cfg, f)));
  // positions.csv est facultatif (détail des lignes d'un PEA / compte-titres)
  let p = '', erreurPositions = null;
  try { p = await ghFetch(cfg, 'positions.csv'); }
  catch (e) { if (!/introuvable/.test(e.message)) erreurPositions = e.message; }
  // operations.csv est facultatif (achats, ventes, dividendes par ligne)
  let o = '';
  try { o = await ghFetch(cfg, 'operations.csv'); }
  catch (e) { if (!/introuvable/.test(e.message)) erreurPositions = erreurPositions || e.message; }
  // categories.json est facultatif (corrections de catégories faites dans la page Dépenses)
  let corrections = null;
  try { corrections = JSON.parse(await ghFetch(cfg, 'categories.json')); } catch (e) { corrections = null; }
  // immobilier.json est facultatif (biens immobiliers et leurs prêts)
  let immobilier = null;
  try { immobilier = JSON.parse(await ghFetch(cfg, 'immobilier.json')); }
  catch (e) { if (!/introuvable/.test(e.message)) erreurPositions = erreurPositions || 'immobilier.json : ' + e.message; }
  let comptes, budget;
  try { comptes = JSON.parse(c); } catch (e) { throw new Error('comptes.json : JSON invalide (' + e.message + ').'); }
  try { budget = JSON.parse(b); } catch (e) { throw new Error('budget.json : JSON invalide (' + e.message + ').'); }
  const M = buildModel({ comptes, soldes: parseCSV(s), transactions: parseCSV(t), budget, positions: parseCSV(p), operations: parseCSV(o), corrections, immobilier }, 'github');
  if (erreurPositions) M.warnings.unshift('Données facultatives non chargées — ' + erreurPositions);
  return M;
}

/* ---------- Modèle ---------- */
const TYPES = {
  'courant':       { label: 'Compte courant', classe: 'liquidites' },
  'livret':        { label: 'Livret',         classe: 'epargne' },
  'fonds-monetaire': { label: 'Fonds monétaire', classe: 'epargne' },
  'pel':           { label: 'PEL / CEL',      classe: 'epargne' },
  'assurance-vie': { label: 'Assurance vie',  classe: 'placements' },
  'pea':           { label: 'PEA',            classe: 'placements' },
  'cto':           { label: 'Compte-titres',  classe: 'placements' },
  'per':           { label: 'PER',            classe: 'placements' },
  'pee':           { label: 'PEE',            classe: 'placements' },
  'pension':       { label: 'Pension',        classe: 'placements' },
  'crypto':        { label: 'Crypto',         classe: 'placements' },
  'credit':        { label: 'Crédit',         classe: 'dettes' },
};
const CLASSES = {
  liquidites: 'Liquidités',
  epargne:    'Épargne réglementée',
  placements: 'Placements',
  autre:      'Autres actifs',
  immobilier: 'Immobilier',
  dettes:     'Dettes',
};
const typeInfo = t => TYPES[t] || { label: t || 'Autre', classe: 'autre' };

function buildModel(raw, source) {
  const warnings = [];
  const comptes = (Array.isArray(raw.comptes) ? raw.comptes : raw.comptes?.comptes || []).map(c => ({
    id: String(c.id), nom: c.nom || String(c.id), banque: c.banque || '',
    // onglet : regroupement dans la page Dépenses (par défaut, la banque)
    onglet: c.onglet || c.banque || c.nom || String(c.id),
    // quotePart : part de ce compte qui vous revient (compte joint : 0.5) dans le patrimoine et la vue consolidée
    quotePart: parseNum(c.quotePart) ?? 1,
    type: String(c.type || 'autre').toLowerCase(), taux: parseNum(c.taux),
    // ferme : date de clôture ; le compte reste dans l'historique mais n'est plus listé ensuite
    ferme: c.ferme ? parseDate(c.ferme) : null,
  }));
  const ids = new Set(comptes.map(c => c.id));

  const soldes = [];
  (raw.soldes || []).forEach((r, i) => {
    const date = parseDate(r.date), solde = parseNum(r.solde), compte = String(r.compte ?? '').trim();
    if (!date || solde == null || !compte) { warnings.push(`soldes.csv, ligne ${i + 2} ignorée (date, compte ou solde illisible).`); return; }
    if (!ids.has(compte)) { warnings.push(`soldes.csv, ligne ${i + 2} : compte « ${compte} » absent de comptes.json.`); return; }
    soldes.push({ date, compte, solde, versements: parseNum(r.versements) });
  });
  soldes.sort((a, b) => a.date.localeCompare(b.date));

  const transactions = [];
  (raw.transactions || []).forEach((r, i) => {
    const date = parseDate(r.date), montant = parseNum(r.montant);
    if (!date || montant == null) { warnings.push(`transactions.csv, ligne ${i + 2} ignorée (date ou montant illisible).`); return; }
    const categorie = r.categorie || 'Non catégorisé', libelle = r.libelle || '';
    transactions.push({ id: `${date}|${libelle}|${montant}`, date, montant, libelle, categorie, categorieOrigine: categorie, compte: r.compte || '' });
  });
  transactions.sort((a, b) => a.date.localeCompare(b.date));

  const b = raw.budget || {};
  const budget = {
    mensuel: b.mensuel || {},
    exceptions: b.exceptions || {},
    exclues: (b.exclues || ['Épargne', 'Virement interne']).map(normKey),
    pnl: b.pnl || null,
  };

  const positions = [];
  (raw.positions || []).forEach((r, i) => {
    const date = parseDate(r.date), quantite = parseNum(r.quantite), cours = parseNum(r.cours), compte = String(r.compte ?? '').trim();
    if (!date || quantite == null || cours == null || !r.titre) { warnings.push(`positions.csv, ligne ${i + 2} ignorée (date, titre, quantité ou cours illisible).`); return; }
    positions.push({ date, compte, titre: r.titre, ticker: r.ticker || '', quantite, cours, pru: parseNum(r.pru) });
  });
  positions.sort((a, b) => a.date.localeCompare(b.date));

  // report = quantité déjà détenue au début de l'historique des opérations
  const operations = [];
  (raw.operations || []).forEach((r, i) => {
    const date = parseDate(r.date), quantite = parseNum(r.quantite), operation = String(r.operation || '').trim().toLowerCase();
    if (!date || !r.titre || !['achat', 'vente', 'dividende', 'attribution', 'report'].includes(operation)) { warnings.push(`operations.csv, ligne ${i + 2} ignorée (date, titre ou opération illisible).`); return; }
    operations.push({ date, compte: String(r.compte ?? '').trim(), titre: r.titre, operation, quantite: quantite || 0, prix: parseNum(r.prix), montant: parseNum(r.montant) });
  });
  operations.sort((a, b) => a.date.localeCompare(b.date));

  // Biens immobiliers : on garde ceux qui ont une date d'achat ; l'échéancier du prêt est calculé une fois
  const immobilier = (raw.immobilier?.biens || []).filter(b => b && parseDate(b.dateAchat)).map(b => {
    const bien = { ...b, dateAchat: parseDate(b.dateAchat),
      estimations: (b.estimations || []).map(e => ({ ...e, date: parseDate(e.date), valeur: parseNum(e.valeur) }))
        .filter(e => e.date && e.valeur != null).sort((x, y) => x.date.localeCompare(y.date)) };
    bien.echeancier = b.pret ? Immo.echeancier(b.pret) : [];
    return bien;
  });

  // Échéances de prêt : le capital remboursé réduit la dette, c'est de l'épargne ; seuls les intérêts restent
  // une charge. Chaque prélèvement du montant de la mensualité (catégorie « Crédit immobilier ») est scindé
  // d'après l'échéancier : la part de capital devient une opération « Capital remboursé ».
  immobilier.forEach(b => {
    const mens = parseNum(b.pret?.mensualite);
    if (!mens) return;
    const jours = (x, y) => Math.abs(new Date(x) - new Date(y)) / 864e5;
    transactions.filter(t => normKey(t.categorie) === normKey('Crédit immobilier') && Math.abs(t.montant + mens) < 0.01).forEach(t => {
      const e = b.echeancier.find(e => jours(e.date, t.date) <= 10);
      if (!e) return;
      t.montant = Math.round((t.montant + e.capital) * 100) / 100;
      transactions.push({ id: t.id + '|capital', date: t.date, montant: -e.capital, libelle: `${t.libelle} (capital)`,
        categorie: 'Capital remboursé', categorieOrigine: 'Capital remboursé', compte: t.compte });
    });
  });
  transactions.sort((a, b) => a.date.localeCompare(b.date));

  const M = { comptes, soldes, transactions, budget, positions, operations, immobilier, source, chargeLe: new Date(), warnings, parCompte: {}, parLigne: {} };
  comptes.forEach(c => { M.parCompte[c.id] = []; });
  soldes.forEach(s => M.parCompte[s.compte].push(s));
  positions.forEach(p => { const k = p.compte + '|' + p.titre; (M.parLigne[k] = M.parLigne[k] || []).push(p); });
  M.correctionsDepot = Corrections.nettoyer(raw.corrections);
  Corrections.appliquer(M);
  return M;
}

/* ---------- Corrections de catégories ----------
   categories.json (dépôt) : { "libelles": { clé de libellé: catégorie }, "operations": { id: catégorie } }
   Les corrections faites dans la page sont gardées dans ce navigateur tant qu'elles ne sont pas
   enregistrées dans le dépôt. Priorité : opération > libellé > catégorie de transactions.csv. */
const CORR_KEY = 'suivi-comptes.corrections';
const Corrections = {
  // Clé de libellé : sans chiffres ni ponctuation, pour regrouper « BOLT.EU/O/250110 » et « BOLT.EU/O/250128 »
  cle: libelle => normKey(libelle).replace(/\d+/g, ' ').replace(/[^a-z&']+/g, ' ').replace(/\s+/g, ' ').trim(),
  nettoyer: c => ({ libelles: { ...(c?.libelles || {}) }, operations: { ...(c?.operations || {}) } }),
  locales() { try { return Corrections.nettoyer(JSON.parse(localStorage.getItem(CORR_KEY) || 'null')); } catch { return Corrections.nettoyer(null); } },
  sauverLocales(c) { try { localStorage.setItem(CORR_KEY, JSON.stringify(c)); } catch { /* stockage indisponible */ } },
  effacerLocales() { try { localStorage.removeItem(CORR_KEY); } catch { /* stockage indisponible */ } },
  nbLocales() { const c = Corrections.locales(); return Object.keys(c.libelles).length + Object.keys(c.operations).length; },
  fusion(M) {
    const l = Corrections.locales(), d = M.correctionsDepot || Corrections.nettoyer(null);
    return { libelles: { ...d.libelles, ...l.libelles }, operations: { ...d.operations, ...l.operations } };
  },
  appliquer(M) {
    delete M._pnlPlan;   // le plan du P&L dépend des catégories en usage
    const c = Corrections.fusion(M);
    M.transactions.forEach(t => {
      t.categorie = c.operations[t.id] || c.libelles[Corrections.cle(t.libelle)] || t.categorieOrigine;
    });
  },
  // Change la catégorie d'une opération, ou de toutes celles qui ont le même libellé
  changer(M, t, categorie, toutLeLibelle) {
    const l = Corrections.locales(), d = M.correctionsDepot;
    if (toutLeLibelle) {
      const k = Corrections.cle(t.libelle);
      l.libelles[k] = categorie;
      // Les corrections d'opérations isolées de ce libellé sont remplacées par la règle
      M.transactions.filter(x => Corrections.cle(x.libelle) === k).forEach(x => {
        delete l.operations[x.id];
        if (d.operations[x.id]) l.operations[x.id] = categorie;
      });
    } else {
      l.operations[t.id] = categorie;
    }
    Corrections.sauverLocales(l);
    Corrections.appliquer(M);
  },
  // Contenu de categories.json une fois les corrections locales fusionnées
  texte(M) {
    const c = Corrections.fusion(M), tri = o => Object.fromEntries(Object.entries(o).sort(([a], [b]) => a.localeCompare(b)));
    return JSON.stringify({ libelles: tri(c.libelles), operations: tri(c.operations) }, null, 2) + '\n';
  },
};

/* ---------- Immobilier (immobilier.json) ---------- */
const Immo = {
  // Échéancier d'un prêt à taux fixe et mensualités constantes. Avec "capitalParEcheance" (tableau
  // d'amortissement de la banque), il est repris tel quel ; sinon il est recalculé (intérêts arrondis au
  // centime, écarts possibles de quelques centimes). Assurance : cotisation mensuelle par année et par assuré.
  echeancier(p) {

    const banque = (p.capitalParEcheance || []).map(parseNum), n = banque.length || parseNum(p.duree);

/* ---------- Calculs ---------- */
const F = {

  premierMois(M) {
    const firsts = [M.soldes[0]?.date, M.transactions[0]?.date].filter(Boolean).sort();
    return firsts.length ? D.monthKey(firsts[0]) : F.moisCourant();

  mois(M, max) {

  exclue: (M, cat) => M.budget.exclues.includes(normKey(cat)),
  budget(M, mk) {

      if (!parCat.has(k)) parCat.set(k, { label: t.categorie, montant: 0 });

     vient en déduction). Une catégorie non listée va dans Charges › Autres (ou Hors exploitation › Autres

  SECTIONS: ['Revenus', 'Charges', 'Épargne', 'Hors exploitation'],
  pnlPlan(M) {

    const sec = s => groupes.find(g => g.section === s);

    // Catégories rencontrées dans les opérations mais absentes du plan
    const nets = new Map();
    M.transactions.forEach(t => nets.set(normKey(t.categorie), { label: t.categorie, net: (nets.get(normKey(t.categorie))?.net || 0) + t.montant }));
    nets.forEach(({ label, net }, k) => {
      if (plan.has(k)) return;

      else if (!cfg && net > 0) ajouter('Revenus', label, label);

  pnl(M, mk) {

    for (const t of M.transactions) {

      const k = normKey(t.categorie);
      parCat.set(k, (parCat.get(k) || 0) + t.montant);

  // Versé vers l'épargne dans le mois : section « Épargne » du P&L, nette des retraits d'épargne

  // Toutes les catégories connues (opérations, budget, exclusions), triées

  perf(M, ids, d0, d1) {

     Flux du point de vue de l'épargnant, aux dates des relevés : la valeur en début de période (ou au premier
     relevé d'un compte ouvert ensuite) compte comme un versement, chaque hausse des versements cumulés comme un
     versement (négatif), chaque baisse comme un retrait (positif), et la valeur à d1 comme un encaissement final.
     Sans d0 : depuis le premier relevé de chaque compte. Comptes sans versements renseignés exclus.
     Renvoie { taux, debut, annees } ou null. */
  tri(M, ids, d0, d1) {
    const flux = new Map(), add = (d, v) => flux.set(d, (flux.get(d) || 0) + v);
    let debut = null;
    ids.forEach(id => {
      if (!F.hasVersements(M, id)) return;
      const snaps = (M.parCompte[id] || []).filter(s => s.date <= d1);
      if (!snaps.length) return;
      const base = d0 ? F.snap(M, id, d0) : null;
      let vPrec, suite;
      if (base) {

        const p = snaps[0];
        if (d0 && p.date <= d0) return;
        add(p.date, -p.solde); vPrec = p.versements ?? p.solde;
        suite = snaps.slice(1);
        if (!debut || p.date < debut) debut = p.date;
      }
      suite.forEach(s => { if (s.versements != null) { add(s.date, -(s.versements - vPrec)); vPrec = s.versements; } });
      add(d1, F.valeur(M, id, d1));
    });
    const pts = [...flux].filter(([, v]) => Math.abs(v) > 0.005).sort((a, b) => a[0].localeCompare(b[0]));
    if (pts.length < 2 || !debut) return null;

    const ans = pts.map(([d, v]) => [(new Date(d).getTime() - t0) / 31557600000, v]);
    const annees = (new Date(d1).getTime() - new Date(debut).getTime()) / 31557600000;
    const f = r => ans.reduce((s, [t, v]) => s + v / Math.pow(1 + r, t), 0);

  rendementsMensuels(M, ids) {

  // Rendements mensuels chaînés par année civile (performance « time-weighted »).
  rendementsAnnuels(mensuels) {

    mensuels.forEach(r => {

  },

  /* Lignes (positions.csv) */
  positionsAt(M, compte, date) {
    let d = null;
    for (const p of M.positions) if (p.compte === compte && p.date <= date) d = p.date;
    return d ? M.positions.filter(p => p.compte === compte && p.date === d) : [];
  },
  coursAt(M, compte, titre, date) {
    let r = null;
    for (const p of M.parLigne[compte + '|' + titre] || []) { if (p.date <= date) r = p; else break; }
    return r ? r.cours : null;
  },
  comptesAvecPositions: M => [...new Set(M.positions.map(p => p.compte))],

  /* Opérations (operations.csv) */
  // Historique d'une ligne : opérations, début de la détention actuelle, dividendes reçus.
  // depuis = date du premier achat depuis le dernier passage à zéro ; avantDebut = ligne déjà
  // détenue au début de l'historique (date d'achat réelle inconnue).
  historiqueLigne(M, compte, titre) {
    const ops = (M.operations || []).filter(o => o.compte === compte && o.titre === titre);
    if (!ops.length) return null;
    let q = 0, depuis = null, avantDebut = false, dividendes = 0;
    for (const o of ops) {
      if (o.operation === 'dividende') { dividendes += o.montant || 0; continue; }
      const avant = q;
      q += o.operation === 'vente' ? -o.quantite : o.quantite;
      if (avant <= 1e-9 && q > 1e-9) { depuis = o.date; avantDebut = o.operation === 'report'; }
      if (q <= 1e-9) { q = 0; depuis = null; avantDebut = false; }
    }
    return { ops: ops.filter(o => o.operation !== 'report'), depuis, avantDebut, dividendes };
  },
};

'use strict';

/* Données fictives générées localement (mode démo). Même format que les fichiers du dépôt. */
const DEMO = {
  generate() {
    let seed = 20261021;
    const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

    const between = (a, b) => a + rnd() * (b - a);
    const int = (a, b) => Math.floor(between(a, b + 1));
    const r2 = v => Math.round(v * 100) / 100;
    const pick = a => a[Math.floor(rnd() * a.length)];

    const today = D.today(), cm = D.monthKey(today), dayNow = Number(today.slice(8, 10));
    const start = D.addMonths(cm, -21);
    const year = Number(cm.slice(0, 4));
    const julyKey = (cm >= year + '-07' ? year : year - 1) + '-07';
    const decKey = (year - 1) + '-12';

    const comptes = { comptes: [
      { id: 'joint',    nom: 'Compte joint',  banque: 'Banque A',   type: 'courant' },
      { id: 'livret-a', nom: 'Livret A',      banque: 'Banque A',   type: 'livret', taux: 1.7 },
      { id: 'ldds',     nom: 'LDDS',          banque: 'Banque A',   type: 'livret', taux: 1.7 },
      { id: 'av',       nom: 'Assurance vie', banque: 'Assureur B', type: 'assurance-vie' },
      { id: 'pea',      nom: 'PEA',           banque: 'Courtier C', type: 'pea' },
    ] };

    const budget = {
      mensuel: { Logement: 1250, Courses: 650, Factures: 220, Transport: 250, Restaurants: 220, Shopping: 200, Loisirs: 150, Voyages: 100, Abonnements: 75, 'Santé': 60 },
      exceptions: { [julyKey]: { Voyages: 1500 }, [decKey]: { Shopping: 450, Cadeaux: 400 } },
      exclues: ['Épargne', 'Virement interne'],
    };

    const soldes = [], transactions = [];
    const st = {
      'livret-a': { v: 14000, f: 14000, add: 200 },
      'ldds':     { v: 7500,  f: 7500,  add: 100 },
      'av':       { v: 24000, f: 21500, add: 300, mu: 0.004, sd: 0.012 },
      'pea':      { v: 11000, f: 9500,  add: 250, mu: 0.006, sd: 0.035 },
    };

    D.range(start, cm).forEach(mk => {
      const date = mk === cm ? today : D.endOfMonth(mk);
      const month = Number(mk.slice(5, 7));
      const full = mk !== cm || dayNow >= 28;
      soldes.push({ date, compte: 'joint', solde: r2(3200 + gauss() * 700) });
      Object.entries(st).forEach(([id, s]) => {
        if (full) { s.f += s.add; s.v += s.add; }
        if (s.mu != null) s.v *= 1 + s.mu + gauss() * s.sd * (mk === cm ? Math.sqrt(dayNow / 30) : 1);
        else if (month === 12) s.v *= 1.017;
        soldes.push({ date, compte: id, solde: r2(s.v), versements: s.f });
      });

      const add = (day, libelle, montant, categorie) => {
        if (mk === cm && day > dayNow) return;
        transactions.push({ date: mk + '-' + pad(Math.min(day, D.daysInMonth(mk))), libelle, montant: r2(montant), categorie, compte: 'joint' });
      };
      const many = (n, cat, a, b, libs) => { for (let i = 0; i < n; i++) add(int(1, 28), pick(libs), -between(a, b), cat); };

      add(27, 'Salaire Alex', 3150, 'Salaire');
      add(27, 'Salaire Sam', 2550, 'Salaire');
      add(3, 'Loyer', -1250, 'Logement');
      add(8, 'Électricité', -between(70, 130), 'Factures');
      add(10, 'Assurance habitation', -28.5, 'Factures');
      add(12, 'Box internet', -39.99, 'Factures');
      add(14, 'Forfaits mobiles', -25.98, 'Factures');
      add(2, 'Salle de sport', -39.9, 'Abonnements');
      add(15, 'Streaming vidéo', -13.49, 'Abonnements');
      add(18, 'Streaming musique', -17.99, 'Abonnements');
      add(1, 'Pass transports', -86.4, 'Transport');
      many(int(9, 12), 'Courses', 25, 110, ['Supermarché', 'Marché', 'Boulangerie', 'Épicerie bio', 'Drive']);
      many(int(3, 7), 'Restaurants', 18, 65, ['Restaurant', 'Brasserie', 'Livraison repas', 'Café']);
      many(int(1, 3), 'Transport', 55, 75, ['Carburant', 'Péage', 'Train']);
      many(int(1, 4), 'Loisirs', 12, 70, ['Cinéma', 'Concert', 'Librairie', 'Musée']);
      many(month === 12 ? int(3, 5) : int(0, 3), 'Shopping', 25, 160, ['Vêtements', 'Maison', 'High-tech']);
      many(int(0, 2), 'Santé', 20, 55, ['Pharmacie', 'Médecin']);
      if (month === 12) many(int(2, 4), 'Cadeaux', 40, 120, ['Cadeaux']);
      else if (rnd() < 0.15) many(1, 'Cadeaux', 30, 80, ['Cadeau anniversaire']);
      if (month === 7 || month === 8) many(int(1, 2), 'Voyages', 300, 800, ['Location vacances', 'Billets avion', 'Hôtel']);
      else if (rnd() < 0.25) many(1, 'Voyages', 80, 250, ['Week-end', 'Train week-end']);
      add(28, 'Virement épargne', -850, 'Épargne');

    return { comptes, soldes, transactions, budget };
  },
};

    return {
      responsive: true, maintainAspectRatio: false, animation: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: {
          display: legend, position: 'top', align: 'start',
          labels: { color: c.text2, usePointStyle: true, pointStyle: 'rectRounded', boxWidth: 10, boxHeight: 10, padding: 14 },
        },
        tooltip: {
          backgroundColor: c.surface3, titleColor: c.text, bodyColor: c.text2, footerColor: c.text,
          titleFont: { weight: '700', size: 13 }, padding: 12, cornerRadius: 12, boxPadding: 4, usePointStyle: true,
          borderColor: c.axis, borderWidth: 1,
          callbacks: { label: ctx => ` ${ctx.dataset.label} : ${eur(ctx.parsed.y)}` },
        },
      },
      scales: {
        x: { stacked, grid: { display: false }, border: { display: false }, ticks: { color: c.muted, maxRotation: 0, autoSkipPadding: 12 } },
        y: { stacked, grid: { color: c.grid }, border: { display: false, dash: [4, 4] }, ticks: { color: c.muted, callback: v => eurShort(v), maxTicksLimit: 5, padding: 8 } },
      },
    };
  },

  line(canvas, labels, series, { stacked = false, area = false } = {}) {
    const c = this.colors();
    const datasets = series.map((s, i) => {
      const col = s.color || c.series[i % 8];
      // Première courbe (hors empilement) : dégradé discret sous la ligne
      const degrade = !area && i === 0 && !s.dash;
      return {
        label: s.label, data: s.data, borderColor: col,
        backgroundColor: degrade ? (ctx => Charts.degrade(ctx, col)) : (area ? col + '33' : col),
        borderWidth: i === 0 ? 2.5 : 2, pointRadius: 0, pointHoverRadius: 5, pointHoverBorderWidth: 2, pointHoverBorderColor: c.surface,
        pointHoverBackgroundColor: col, tension: 0.35, borderDash: s.dash || [],
        fill: area ? (i === 0 ? 'origin' : '-1') : (degrade ? 'origin' : false),
      };
    });
    const opts = this.options(c, { stacked, legend: series.length > 1 });
    if (stacked) opts.scales.y.beginAtZero = true;
    if (stacked) opts.plugins.tooltip.callbacks.footer = items => 'Total : ' + eur(items.reduce((s, it) => s + it.parsed.y, 0));
    return this.make(canvas, { type: 'line', data: { labels, datasets }, options: opts, plugins: [this.crosshair] });
  },

  // Dégradé vertical de la couleur vers la transparence, sur la hauteur de la zone de tracé
  degrade(ctx, col) {
    const { chart } = ctx, a = chart.chartArea;
    if (!a) return col + '22';
    const g = chart.ctx.createLinearGradient(0, a.top, 0, a.bottom);
    g.addColorStop(0, col + '55'); g.addColorStop(1, col + '00');
    return g;
  },

  // Barres mensuelles + ligne de référence (même axe).
  barsWithLine(canvas, labels, bars, line, { highlightLast = false } = {}) {
    const c = this.colors();
    const colors = bars.data.map((_, i) => highlightLast && i === bars.data.length - 1 ? c.series[0] + '80' : c.series[0]);
    const datasets = [
      { type: 'bar', label: bars.label, data: bars.data, backgroundColor: colors, borderRadius: 6, borderSkipped: 'start', categoryPercentage: 0.7, barPercentage: 0.9, order: 2 },
    ];
    // line facultative (pas de budget dans la vue par banque)
    if (line) datasets.push({ type: 'line', label: line.label, data: line.data, borderColor: c.text2, borderWidth: 2, borderDash: [5, 4], pointRadius: 0, pointHoverRadius: 4, stepped: 'middle', order: 1 });
    return this.make(canvas, { type: 'bar', data: { labels, datasets }, options: this.options(c) });
  },

  // Anneau de répartition (légende tracée à côté en HTML).
  donut(canvas, labels, data, colors) {
    const c = this.colors();
    return this.make(canvas, {
      type: 'doughnut',
      data: { labels, datasets: [{ data, backgroundColor: colors, borderColor: c.surface, borderWidth: 3, hoverOffset: 6 }] },
      options: {
        responsive: true, maintainAspectRatio: false, animation: false, cutout: '68%',
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: c.surface3, titleColor: c.text, bodyColor: c.text2, padding: 12, cornerRadius: 12, borderColor: c.axis, borderWidth: 1,
            callbacks: { label: ctx => { const t = ctx.dataset.data.reduce((s, v) => s + v, 0); return ` ${eur(ctx.parsed)} · ${pct(t ? ctx.parsed / t : null)}`; } },
          },
        },
      },
    });
  },

  // Barres empilées (une série par composante, ex. capital / intérêts / assurance par année).
  stackedBars(canvas, labels, series, { highlight = -1 } = {}) {
    const c = this.colors();
    const datasets = series.map((s, i) => {
      const col = s.color || c.series[i % 8];
      return { label: s.label, data: s.data, backgroundColor: s.data.map((_, j) => highlight >= 0 && j !== highlight ? col + '99' : col),
        borderRadius: 4, categoryPercentage: 0.75, barPercentage: 0.9 };
    });
    const opts = this.options(c, { stacked: true });
    opts.plugins.tooltip.callbacks.footer = items => 'Total : ' + eur(items.reduce((s, it) => s + it.parsed.y, 0));
    return this.make(canvas, { type: 'bar', data: { labels, datasets }, options: opts });
  },

  // Barres positives / négatives (gains mensuels), deux pôles divergents.
  signedBars(canvas, labels, label, data, { tooltip } = {}) {
    const c = this.colors();
    const opts = this.options(c, { legend: false });
    if (tooltip?.label) opts.plugins.tooltip.callbacks.label = tooltip.label;
    const datasets = [{ label, data, backgroundColor: data.map(v => v >= 0 ? c.pos : c.neg), borderRadius: 6, borderSkipped: 'start', categoryPercentage: 0.7, barPercentage: 0.9 }];
    return this.make(canvas, { type: 'bar', data: { labels, datasets }, options: opts });
  },

  make(canvas, cfg) {
    if (typeof Chart === 'undefined') {
      canvas.parentElement.innerHTML = '<p class="muted center">Graphique indisponible (bibliothèque non chargée, êtes-vous hors ligne ?)</p>';
      return null;
    }
    Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
    Chart.defaults.font.size = 12;
    const ch = new Chart(canvas, cfg);
    this.list.push(ch);
    return ch;
  },
};

</script>
  <script>
'use strict';

/* ---------- Petits composants HTML ---------- */
const UI = {
  card: (title, body, { sub = '', cls = '', actions = '' } = {}) => `
    <section class="card ${cls}">
      <header class="card-h"><div><h2>${title}</h2>${sub ? `<p class="card-sub">${sub}</p>` : ''}</div>${actions}</header>
      ${body}
    </section>`,
  kpi: (label, value, sub = '', cls = '') => `
    <div class="kpi ${cls}"><div class="kpi-label">${label}</div><div class="kpi-value">${value}</div>${sub ? `<div class="kpi-sub">${sub}</div>` : ''}</div>`,
  // Variation avec flèche ; invert = une hausse est une mauvaise nouvelle (dépenses).
  delta(v, base, { invert = false, suffix = '' } = {}) {
    if (v == null || !isFinite(v)) return '<span class="muted">—</span>';
    const good = invert ? v < 0 : v > 0;
    const cls = Math.abs(v) < 0.5 ? 'flat' : good ? 'up' : 'down';
    const arrow = Math.abs(v) < 0.5 ? '■' : v > 0 ? '▲' : '▼';
    const p = base ? ` (${pctSigned(v / Math.abs(base))})` : '';
    return `<span class="delta ${cls}">${arrow} ${eurSigned(v)}${p}</span>${suffix ? ` <span class="muted">${suffix}</span>` : ''}`;
  },
  status(ratio, pace) {
    if (ratio > 1.005) return '<span class="status critical">▲ Dépassé</span>';
    if (ratio >= 0.995) return '<span class="status neutral">● Atteint</span>';
    if (ratio > Math.max(0.9, pace ?? 0.9)) return '<span class="status warning">● À surveiller</span>';
    return '<span class="status good">✓ OK</span>';
  },
  chart: (id, h = 280) => `<div class="chart" style="height:${h}px"><canvas id="${id}"></canvas></div>`,
  // Section repliable (fermée par défaut) ; son état ouvert est retenu dans state.replis entre deux rendus
  // (ouvert : ouverte par défaut, tant que l'utilisateur ne l'a pas refermée)
  repli: (id, title, body, { sub = '', cls = 'span-12', state, ouvert = false } = {}) => `
    <details class="card repli ${cls}" data-repli="${esc(id)}" ${state?.replis?.has(id) || (ouvert && !state?.replisFermes?.has(id)) ? 'open' : ''}>
      <summary class="card-h"><div><h2>${title}</h2>${sub ? `<p class="card-sub">${sub}</p>` : ''}</div><span class="chevron" aria-hidden="true">▸</span></summary>
      ${body}
    </details>`,
  // Mémorise l'ouverture des sections repliables d'une page
  suivreReplis(state) {
    document.querySelectorAll('details[data-repli]').forEach(d => d.addEventListener('toggle', () => {
      const o = state.replis || (state.replis = new Set()), f = state.replisFermes || (state.replisFermes = new Set()), k = d.dataset.repli;
      if (d.open) { o.add(k); f.delete(k); } else { o.delete(k); f.add(k); }
    }));
  },
  empty: msg => `<p class="muted center pad">${msg}</p>`,
};

/* ---------- Points d'attention ----------
   Constats calculés à partir des données (pas des conseils) : soldes négatifs, épargne disponible rapportée aux
   charges, catégories toujours au-dessus du budget, évolution du taux d'épargne, opérations à classer, comptes
   non mis à jour. V = vue consolidée (vueDepenses). */
function pointsAttention(M, V) {
  const today = D.today(), cm = F.moisCourant(), pts = [];
  const mois = n => D.range(D.addMonths(cm, -n), D.addMonths(cm, -1));
  const ajout = (niveau, titre, texte, lien) => pts.push({ niveau, titre, texte, lien });

  // Comptes courants passés dans le rouge en fin de mois (6 derniers mois)
  const debut6 = D.endOfMonth(D.addMonths(cm, -6));
  const neg = M.soldes.filter(s => s.solde < 0 && s.date > debut6 && F.classe(M.comptes.find(c => c.id === s.compte) || {}) === 'liquidites');
  if (neg.length) {
    const noms = [...new Set(neg.map(s => M.comptes.find(c => c.id === s.compte).nom))];
    ajout('critical', `${neg.length} fin${neg.length > 1 ? 's' : ''} de mois dans le rouge`,
      `${noms.join(', ')} : ${neg.map(s => `${eur(s.solde)} au ${D.fmt(s.date)}`).join(', ')}.`, '#overview');
  }

  // Épargne disponible (livrets, fonds monétaire) rapportée aux charges mensuelles moyennes (6 derniers mois)
  const dispo = M.comptes.filter(c => F.classe(c) === 'epargne' && F.ouvert(c, today)).reduce((s, c) => s + F.valeur(M, c.id, today) * c.quotePart, 0);
  const charges6 = mois(6).reduce((s, m) => s + F.pnl(V, m).charges, 0) / 6;
  if (charges6 > 0) {
    const n = dispo / charges6;
    ajout(n < 3 ? 'critical' : n < 6 ? 'warning' : 'good', `Épargne disponible : ${n.toLocaleString('fr-FR', { maximumFractionDigits: 1 })} mois de charges`,
      `${eur(dispo)} sur livrets et fonds monétaire, pour ${eur(charges6)} de charges nettes par mois en moyenne (6 derniers mois).`, '#epargne');
  }

  // Catégories au-dessus du budget chacun des 3 derniers mois
  const m3 = mois(3), lignes = m3.map(m => F.lignesBudget(V, m));
  const toujours = lignes[0].filter(r => r.budget > 0 && lignes.every(l => { const x = l.find(y => y.key === r.key); return x && x.spent > x.budget; }));
  if (toujours.length) ajout('warning', `${toujours.length} catégorie${toujours.length > 1 ? 's' : ''} au-dessus du budget 3 mois de suite`,
    toujours.map(r => `${esc(r.label)} (${eur(m3.reduce((s, m, i) => s + (lignes[i].find(y => y.key === r.key)?.spent || 0), 0) / 3)} / ${eur(r.budget)} par mois)`).join(', ') + '.', '#depenses');

  // Taux d'épargne : 3 derniers mois contre 12 derniers mois
  const taux = ms => { const P = ms.map(m => F.pnl(V, m)), r = P.reduce((s, p) => s + p.revenus, 0); return r > 0 ? P.reduce((s, p) => s + p.resultat, 0) / r : null; };
  const t3 = taux(mois(3)), t12 = taux(mois(12));
  if (t3 != null && t12 != null) ajout(t3 < t12 - 0.05 ? 'warning' : 'good', `Taux d’épargne : ${pct(t3)} sur 3 mois`,
    `contre ${pct(t12)} sur 12 mois (revenus − charges nettes, compte joint à votre part).`, '#depenses');

  // Opérations importantes non identifiées (Divers, Non catégorisé) sur 3 mois
  const aClasser = V.transactions.filter(t => t.date >= m3[0] + '-01' && t.montant <= -100 && ['divers', 'non categorise'].includes(normKey(t.categorie)));
  if (aClasser.length) ajout('warning', `${aClasser.length} opération${aClasser.length > 1 ? 's' : ''} de plus de 100 € à classer`,
    aClasser.map(t => `${esc(t.libelle)} ${eur(-t.montant)} (${D.fmt(t.date)})`).join(', ') + '.', '#depenses');

  // Comptes dont le solde n'a pas été mis à jour depuis plus de 40 jours
  const vieux = M.comptes.filter(c => F.ouvert(c, today) && F.derniereMaj(M, c.id) && D.diffDays(F.derniereMaj(M, c.id), today) > 40);
  if (vieux.length) ajout('neutral', `${vieux.length} compte${vieux.length > 1 ? 's' : ''} à mettre à jour`,
    vieux.map(c => `${esc(c.nom)} (${D.fmt(F.derniereMaj(M, c.id))})`).join(', ') + '.', '#overview');

  const ordre = { critical: 0, warning: 1, neutral: 2, good: 3 }, icone = { critical: '▲', warning: '●', neutral: '●', good: '✓' };
  return pts.sort((a, b) => ordre[a.niveau] - ordre[b.niveau]).map(p => `
    <li class="attention"><span class="status ${p.niveau}">${icone[p.niveau]}</span>
      <div><strong>${p.titre}</strong><div class="muted small">${p.texte}</div></div></li>`).join('');
}

/* ---------- Vue d'ensemble ---------- */
function pageOverview(M) {
  const today = D.today(), cm = F.moisCourant();
  const now = F.patrimoine(M, today);
  const finMoisDernier = F.patrimoine(M, D.endOfMonth(D.addMonths(cm, -1)));
  const debutAnnee = F.patrimoine(M, (Number(cm.slice(0, 4)) - 1) + '-12-31');
  const ilYaUnAn = F.patrimoine(M, D.endOfMonth(D.addMonths(cm, -12)));

  // Budget du mois : vue consolidée (virements internes neutralisés, comptes partagés à votre part)
  const V = vueDepenses(M, '');
  const dep = F.depenses(V, cm), bud = F.budgetTotal(V, cm), rev = F.revenus(V, cm);
  const prevMk = D.addMonths(cm, -1), revPrev = F.pnl(V, prevMk).revenus;
  const tauxEpargne = F.pnl(V, prevMk).taux;
  const ratio = bud > 0 ? dep.total / bud : 0;
  const pace = Number(today.slice(8, 10)) / D.daysInMonth(cm);
  const depasse = F.lignesBudget(V, cm).filter(r => r.budget > 0 && r.spent > r.budget);

  const tiles = ['liquidites', 'epargne', 'placements', 'immobilier', 'autre', 'dettes']
    .filter(k => !['autre', 'immobilier', 'dettes'].includes(k) || now.par[k] !== 0)
    .map(k => UI.kpi(CLASSES[k], eur(now.par[k]),
      `${pct(now.net ? now.par[k] / now.net : null)} du patrimoine · ${UI.delta(now.par[k] - finMoisDernier.par[k])}`))
    .join('');

  const comptesRows = M.comptes.filter(c => F.ouvert(c, today)).map(c => {
    const maj = F.derniereMaj(M, c.id), age = maj ? D.diffDays(maj, today) : null;
    return `<tr>
      <td><strong>${esc(c.nom)}</strong><div class="muted small">${esc(c.banque)}</div></td>
      <td>${esc(typeInfo(c.type).label)}</td>
      <td class="num">${eur(F.valeur(M, c.id, today), true)}</td>
      <td class="num ${age > 40 ? 'stale' : 'muted'}">${maj ? D.fmt(maj) : '—'}${age > 40 ? ' <span title="Solde non mis à jour depuis plus de 40 jours">⚠</span>' : ''}</td>
    </tr>`;
  }).join('');

  const last = M.transactions.slice(-8).reverse().map(t => `
    <tr><td class="muted">${D.fmt(t.date)}</td><td>${esc(t.libelle)}<div class="muted small">${esc(t.categorie)}</div></td>
    <td class="num ${t.montant > 0 ? 'pos' : ''}">${eurSigned(t.montant, true)}</td></tr>`).join('');

  const html = `
    <div class="page-h"><h1>Vue d'ensemble</h1><p class="muted">Situation au ${D.fmt(today)}</p></div>
    <div class="grid">
      <section class="card hero span-12">
        <div class="hero-main">
          <div class="kpi-label">Patrimoine net</div>
          <div class="hero-value">${eur(now.net)}</div>
          <div class="hero-deltas">
            <div>${UI.delta(now.net - finMoisDernier.net, finMoisDernier.net)} <span class="muted">depuis fin ${D.monthLabel(prevMk, true)}</span></div>
            <div>${UI.delta(now.net - debutAnnee.net, debutAnnee.net)} <span class="muted">depuis le 1er janvier</span></div>
            <div>${UI.delta(now.net - ilYaUnAn.net, ilYaUnAn.net)} <span class="muted">sur 12 mois</span></div>
          </div>
        </div>
        <div class="kpis">${tiles}</div>
      </section>

      ${UI.card('Évolution du patrimoine', UI.chart('ch-patrimoine', 300), { sub: '24 derniers mois, par grande classe d’actifs', cls: 'span-8' })}

      ${UI.card(`${D.monthLabel(cm, true).replace(/^./, c => c.toUpperCase())}`, `
        <div class="budget-sum">
          <div class="row-between"><span>Dépenses</span><strong>${eur(dep.total)} <span class="muted">/ ${eur(bud)}</span></strong></div>
          <div class="track big"><div class="fill ${ratio > 1 ? 'over' : ''}" style="width:${Math.min(ratio, 1) * 100}%"></div><div class="pace" style="left:${pace * 100}%" title="Avancement du mois"></div></div>
          <div class="row-between small muted"><span>${pct(ratio)} du budget consommé</span><span>${pct(pace)} du mois écoulé</span></div>
        </div>
        <dl class="facts">
          <div><dt>Revenus du mois</dt><dd>${rev ? eur(rev) : `<span class="muted">pas encore reçus (${D.monthLabel(prevMk)} : ${eur(revPrev)})</span>`}</dd></div>
          <div><dt>Reste à dépenser</dt><dd>${bud - dep.total >= 0 ? eur(bud - dep.total) : `<span class="neg">${eur(bud - dep.total)}</span>`}</dd></div>
          <div><dt>Taux d’épargne (${D.monthLabel(prevMk)})</dt><dd>${pct(tauxEpargne)}</dd></div>
        </dl>
        ${depasse.length ? `<p class="small"><span class="status critical">▲ Dépassé</span> ${depasse.map(r => esc(r.label)).join(', ')}</p>` : '<p class="small"><span class="status good">✓ OK</span> Aucune catégorie en dépassement</p>'}
        <a class="link" href="#depenses">Détail des dépenses →</a>`, { sub: 'Mois en cours', cls: 'span-4' })}

      ${UI.card('Points d’attention', `<ul class="attentions">${pointsAttention(M, V) || '<li class="muted">Rien à signaler.</li>'}</ul>
        <p class="small muted">Constats calculés à partir de vos données, pas des conseils financiers.</p>`, { sub: 'Mis à jour à chaque chargement', cls: 'span-12' })}

      ${UI.card('Comptes', `<div class="table-wrap"><table>
        <thead><tr><th>Compte</th><th>Type</th><th class="num">Solde</th><th class="num">Mise à jour</th></tr></thead>
        <tbody>${comptesRows}</tbody>
        <tfoot><tr><td colspan="2">Total</td><td class="num">${eur(now.net, true)}</td><td></td></tr></tfoot></table></div>`, { cls: 'span-7' })}

      ${UI.card('Dernières opérations', last ? `<div class="table-wrap"><table><tbody>${last}</tbody></table></div>` : UI.empty('Aucune opération.'), { cls: 'span-5' })}
    </div>`;

  return { html, after() {
    const months = F.mois(M, 24);
    const P = months.map(mk => F.patrimoine(M, F.dateFin(mk)));
    const keys = ['liquidites', 'epargne', 'placements', 'autre'].filter(k => P.some(p => p.par[k] !== 0));
    const series = keys.map(k => ({ label: CLASSES[k], data: P.map(p => p.par[k]) }));
    // Immobilier net du crédit (votre quote-part), pour garder un empilement positif
    if (P.some(p => p.immoNet !== 0)) series.push({ label: 'Immobilier (net du crédit)', data: P.map(p => p.immoNet) });
    Charts.line(document.getElementById('ch-patrimoine'), months.map(m => D.monthLabel(m)), series, { stacked: true, area: true });
  } };
}

/* ---------- Dépenses ---------- */
/* Vue de la page Dépenses : une banque (ses comptes, virements vers vos autres comptes compris, sans budget),
   ou tous les comptes, où les virements entre vos comptes sont neutralisés (retirés des deux côtés) et où
   un compte partagé (quotePart < 1, ex. compte joint) ne compte que pour votre part : ses opérations sont
   réduites à cette part, et les apports du co-titulaire (« Participation conjoint »), qui financent la sienne,
   sont retirés. */
const INTERNE = 'Virement interne', APPORT_COTITULAIRE = 'Participation conjoint';
function opsVotrePart(M) {
  const parts = new Map(M.comptes.filter(c => c.quotePart < 1).map(c => [c.id, c.quotePart]));
  return M.transactions.flatMap(t => {
    const q = parts.get(t.compte);
    if (q == null) return [t];
    if (normKey(t.categorie) === normKey(APPORT_COTITULAIRE)) return [];
    // Copie à votre part ; l'id et la catégorie d'origine restent ceux de l'opération (corrections de catégorie)
    return [Object.assign(Object.create(t), { montant: Math.round(t.montant * q * 100) / 100, part: q })];
  });
}
// Comptes qui ont des opérations (comptes courants), et leurs banques
function comptesAvecOps(M, banque) {
  const avecOps = new Set(M.transactions.map(t => t.compte));
  return M.comptes.filter(c => avecOps.has(c.id) && (banque == null || c.onglet === banque));
}
const banquesDepenses = M => [...new Set(comptesAvecOps(M).map(c => c.onglet))];
function vueDepenses(M, banque) {
  const interne = t => normKey(t.categorie) === normKey(INTERNE);
  if (!banque) {
    const V = { ...M, transactions: opsVotrePart(M).filter(t => !interne(t)), internes: M.transactions.filter(interne) };
    delete V._pnlPlan;
    return V;
  }
  const ids = new Set(comptesAvecOps(M, banque).map(c => c.id));
  const transactions = M.transactions.filter(t => ids.has(t.compte));
  const V = { ...M, transactions, internes: transactions.filter(interne), banque, idsBanque: [...ids],
    // Les apports du co-titulaire sont une entrée d'argent du compte, pas une baisse de ses dépenses
    budget: { ...M.budget, mensuel: {}, exceptions: {}, exclues: [...M.budget.exclues, normKey(APPORT_COTITULAIRE)] } };
  delete V._pnlPlan;
  return V;
}

// Couleur stable de chaque catégorie, d'après son rang dans les dépenses des 12 derniers mois de la vue
function couleursCategories(M, cm) {
  const tot = new Map();
  D.range(D.addMonths(cm, -11), cm).forEach(m => F.depenses(M, m).parCat.forEach((v, k) => tot.set(k, (tot.get(k) || 0) + v.montant)));
  const c = Charts.colors(), rang = [...tot].sort((a, b) => b[1] - a[1]).map(([k]) => k);
  return k => { const i = rang.indexOf(k); return i < 0 ? c.muted : c.series[i % c.series.length]; };
}

function pageDepenses(Mtout, state) {
  const banques = banquesDepenses(Mtout);
  const banque = banques.includes(state.banque) ? state.banque : '';
  const M = vueDepenses(Mtout, banque), parBanque = !!banque;
  const cm = F.moisCourant(), today = D.today();
  const allMonths = F.mois(M).reverse();
  const mk = allMonths.includes(state.mois) ? state.mois : cm;
  const isCurrent = mk === cm;
  const pace = isCurrent ? Number(today.slice(8, 10)) / D.daysInMonth(mk) : 1;
  const couleur = couleursCategories(M, cm);
  const palette = Charts.colors().series;

  // ---- Chiffres du mois ----
  const dep = F.depenses(M, mk), bud = F.budgetTotal(M, mk), rows = F.lignesBudget(M, mk);
  const moy3 = k => [1, 2, 3].reduce((a, i) => a + (F.depenses(M, D.addMonths(mk, -i)).parCat.get(k)?.montant || 0), 0) / 3;
  const dep3 = [1, 2, 3].reduce((a, i) => a + F.depenses(M, D.addMonths(mk, -i)).total, 0) / 3;
  // Projection : pour chaque catégorie, le plus élevé entre le déjà-dépensé et la moyenne des 3 mois précédents
  // (les charges fixes déjà payées en début de mois ne sont pas extrapolées)
  const projection = isCurrent ? rows.reduce((s, r) => s + Math.max(r.spent, moy3(r.key)), 0) : null;
  const P = F.pnl(M, mk), verse = F.versementsEpargne(M, mk);
  const ratioBudget = bud > 0 ? dep.total / bud : 0;
  const internesMois = M.internes.filter(t => D.monthKey(t.date) === mk);
  const recuInterne = internesMois.filter(t => t.montant > 0).reduce((s, t) => s + t.montant, 0);
  const envoyeInterne = -internesMois.filter(t => t.montant < 0).reduce((s, t) => s + t.montant, 0);
  const soldeBanque = parBanque ? M.idsBanque.reduce((s, id) => s + F.valeur(M, id, F.dateFin(mk)), 0) : 0;
  const nomsComptes = b => comptesAvecOps(Mtout, b).map(c => c.nom).join(', ');
  const nomCompte = new Map(Mtout.comptes.map(c => [c.id, c.onglet || c.nom]));

  // ---- Onglets par banque (une couleur par banque) ----
  const coulBanque = b => b ? palette[(banques.indexOf(b) + 2) % palette.length] : 'var(--accent)';
  const onglets = banques.length > 1 ? `<nav class="onglets" aria-label="Comptes">
    ${['', ...banques].map(b => `<button type="button" class="onglet" data-banque="${esc(b)}" aria-pressed="${b === banque}" ${b ? `style="--c:${coulBanque(b)}"` : ''} title="${b ? esc(nomsComptes(b)) : 'Virements entre vos comptes neutralisés, compte joint à votre part'}">${b ? esc(b) : 'Tous les comptes'}</button>`).join('')}
  </nav>` : '';

  // ---- Répartition du mois (anneau) : 6 premières catégories, puis « autres » ----
  let parts = [...dep.parCat].filter(([, v]) => v.montant > 0.5).map(([k, v]) => ({ key: k, label: v.label, v: v.montant, c: couleur(k) })).sort((a, b) => b.v - a.v);
  if (parts.length > 7) parts = [...parts.slice(0, 6), { label: `${parts.length - 6} autres`, v: parts.slice(6).reduce((s, p) => s + p.v, 0), c: Charts.colors().muted }];
  const totalParts = parts.reduce((s, p) => s + p.v, 0);
  const legende = parts.map(p => `<li><span class="pastille" style="background:${p.c}"></span>${esc(p.label)}<span class="val">${eur(p.v)} · ${pct(totalParts ? p.v / totalParts : null)}</span></li>`).join('');

  // ---- Bandeau principal ----
  const jauge = parBanque ? '' : `
    <div class="jauge-budget">
      <div class="track big"><div class="fill ${ratioBudget > 1 ? 'over' : ''}" style="width:${Math.min(ratioBudget, 1) * 100}%"></div>${isCurrent ? `<div class="pace" style="left:${pace * 100}%" title="Avancement du mois"></div>` : ''}</div>
      <div class="row-between small muted"><span>${pct(ratioBudget)} du budget de ${eur(bud)}</span><span>${bud - dep.total >= 0 ? `reste ${eur(bud - dep.total)}` : `<span class="neg">dépassement de ${eur(dep.total - bud)}</span>`}</span></div>
    </div>`;
  const deltas = parBanque
    ? `<div>${UI.delta(dep.total - dep3, dep3, { invert: true })} <span class="muted">vs moyenne des 3 mois précédents</span></div>
       <div class="muted">${esc(nomsComptes(banque))} · solde ${isCurrent ? 'actuel' : 'fin de mois'} <strong>${eur(soldeBanque)}</strong></div>`
    : `<div>${UI.delta(dep.total - dep3, dep3, { invert: true })} <span class="muted">vs moyenne des 3 mois précédents</span></div>
       ${isCurrent ? `<div><span class="muted">Projection fin de mois</span> <strong>${eur(projection)}</strong> ${UI.delta(projection - bud, null, { invert: true, suffix: 'vs budget' })}</div>` : ''}`;
  const mini = parBanque ? `
      ${UI.kpi('Revenus', eur(P.revenus), 'salaire et autres revenus')}
      ${UI.kpi('Reçu de vos comptes', eur(recuInterne), 'virements depuis vos autres comptes')}
      ${UI.kpi('Envoyé vers vos comptes', eur(envoyeInterne), 'virements vers vos autres comptes')}` : `
      ${UI.kpi('Revenus', eur(P.revenus), isCurrent && !P.revenus ? 'pas encore reçus ce mois-ci' : 'salaire et autres revenus')}
      ${UI.kpi('Capacité d’épargne', `<span class="${P.resultat < 0 ? 'neg' : 'pos'}">${eurSigned(P.resultat)}</span>`, `revenus − dépenses · taux ${pct(P.taux)}`)}
      ${UI.kpi('Versé sur l’épargne', eur(verse), 'net, capital du crédit compris')}`;
  const noteInterne = !parBanque && internesMois.length ? `<p class="small muted">${internesMois.length} virements entre vos comptes neutralisés ce mois-ci (${eur(envoyeInterne)} envoyés, ${eur(recuInterne)} reçus).</p>` : '';

  // ---- Tuiles par catégorie ----
  const sel = state.catOuverte || null;
  const maxSpent = Math.max(...rows.map(r => r.spent), 1);
  const tuiles = rows.filter(r => Math.abs(r.spent) >= 0.5 || r.budget > 0).sort((a, b) => b.spent - a.spent || b.budget - a.budget).map(r => {
    const ratio = r.budget > 0 ? r.spent / r.budget : r.spent / maxSpent, m3 = moy3(r.key);
    const w = Math.max(0, Math.min(ratio, 1)) * 100, over = r.budget > 0 && r.spent > r.budget;
    return `<button type="button" class="cat-tuile ${sel === r.key ? 'sel' : ''} ${Math.abs(r.spent) < 0.5 ? 'vide' : ''}" data-cat="${esc(r.key)}" style="--c:${couleur(r.key)}" aria-pressed="${sel === r.key}">
      <span class="nom"><span class="pastille"></span>${esc(r.label)}</span>
      <span class="montant ${r.spent < 0 ? 'pos' : ''}">${eur(r.spent)}</span>
      <span class="jauge"><span class="${over ? 'over' : ''}" style="width:${w}%"></span>${isCurrent && r.budget > 0 ? `<i style="left:${pace * 100}%"></i>` : ''}</span>
      <span class="detail">${r.budget > 0 ? `budget ${eur(r.budget)}${over ? ' · <b class="neg">dépassé</b>' : ''}` : parBanque ? `${pct(dep.total ? r.spent / dep.total : null)} du mois` : 'hors budget'} · moy. 3 mois ${eur(m3)}</span>
    </button>`;
  }).join('');

  // Mouvements hors dépenses : revenus, épargne, virements, capital du crédit
  const opsMois = M.transactions.filter(t => D.monthKey(t.date) === mk);
  const clesDep = new Set(rows.map(r => r.key)), autres = new Map();
  opsMois.forEach(t => {
    const k = normKey(t.categorie);
    if (clesDep.has(k)) return;
    const a = autres.get(k) || { key: k, label: t.categorie, net: 0, n: 0 };
    a.net += t.montant; a.n++; autres.set(k, a);
  });
  const tuilesHors = [...autres.values()].sort((a, b) => b.net - a.net).map(a => `
    <button type="button" class="cat-tuile hors ${sel === a.key ? 'sel' : ''}" data-cat="${esc(a.key)}" aria-pressed="${sel === a.key}">
      <span class="nom">${esc(a.label)}</span>
      <span class="montant ${a.net > 0 ? 'pos' : ''}">${eurSigned(a.net)}</span>
      <span class="detail">${a.n} opération${a.n > 1 ? 's' : ''}</span>
    </button>`).join('');

  // ---- Opérations (filtrées par la catégorie choisie) et changement de catégorie ----
  const toutesCats = F.categories(Mtout);
  const optionsCat = c => toutesCats.map(x => `<option ${x === c ? 'selected' : ''}>${esc(x)}</option>`).join('') + '<option value="__nouvelle">+ Nouvelle catégorie…</option>';
  const liste = (sel ? opsMois.filter(t => normKey(t.categorie) === sel) : opsMois).sort((a, b) => b.date.localeCompare(a.date) || a.montant - b.montant);
  const labelSel = sel ? (rows.find(r => r.key === sel)?.label || autres.get(sel)?.label || sel) : null;
  const lignesOps = liste.map(t => `
    <tr><td class="muted nowrap">${D.fmt(t.date)}</td>
      <td><span class="pastille" style="background:${couleur(normKey(t.categorie))}"></span> ${esc(t.libelle)}${t.categorie !== t.categorieOrigine ? ` <span class="tag" title="Catégorie d’origine : ${esc(t.categorieOrigine)}">corrigé</span>` : ''}${t.part ? ` <span class="tag" title="Compte partagé : montant total ${eur(t.montant / t.part, true)}">votre part ${pct(t.part)}</span>` : ''}
        ${parBanque && M.idsBanque.length < 2 ? '' : `<div class="muted small">${esc(nomCompte.get(t.compte) || t.compte)}</div>`}</td>
      <td class="num nowrap ${t.montant > 0 ? 'pos' : ''}">${eurSigned(t.montant, true)}</td>
      <td><label class="select small-select"><span class="sr">Catégorie</span><select class="sel-cat" data-id="${esc(t.id)}">${optionsCat(t.categorie)}</select></label></td></tr>`).join('');
  const nbLoc = Corrections.nbLocales();
  const barreCorr = `<div class="corr-bar">
    <label class="check"><input type="checkbox" id="chk-libelle" ${state.toutLibelle !== false ? 'checked' : ''}> Appliquer un changement de catégorie à toutes les opérations du même libellé</label>
    ${nbLoc ? `<span class="corr-status"><span class="status warning">● ${nbLoc} correction${nbLoc > 1 ? 's' : ''} gardée${nbLoc > 1 ? 's' : ''} dans ce navigateur</span>
      ${Mtout.source === 'github' ? '<button class="btn small primary" id="btn-corr-save">Enregistrer sur GitHub</button>' : ''}
      <button class="btn small" id="btn-corr-dl">Télécharger categories.json</button>
      <button class="btn small ghost" id="btn-corr-reset">Annuler</button></span>` : ''}
    ${state.corrMsg ? `<span class="small ${state.corrMsg.ok ? 'pos' : 'neg'}">${esc(state.corrMsg.texte)}</span>` : ''}
  </div>`;

  // ---- Historique 6 mois par catégorie ----
  const hist = D.range(D.addMonths(mk, -5), mk);
  const histData = hist.map(m => new Map(F.lignesBudget(M, m).map(r => [r.key, r])));
