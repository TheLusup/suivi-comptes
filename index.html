  const internesMois = M.internes.filter(t => D.monthKey(t.date) === mk);
  const recuInterne = internesMois.filter(t => t.montant > 0).reduce((s, t) => s + t.montant, 0);
  const envoyeInterne = -internesMois.filter(t => t.montant < 0).reduce((s, t) => s + t.montant, 0);
  const soldeBanque = parBanque ? M.idsBanque.reduce((s, id) => s + F.valeur(M, id, F.dateFin(mk)), 0) : 0;
  const optionsCat = sel => toutesCats.map(c => `<option ${c === sel ? 'selected' : ''}>${esc(c)}</option>`).join('') + '<option value="__nouvelle">+ Nouvelle catégorie…</option>';
  const tableOps = list => list.length ? `<div class="table-wrap"><table class="ops-cat"><tbody>${[...list].sort((a, b) => b.date.localeCompare(a.date) || a.montant - b.montant).map(t => `
    <tr><td class="muted nowrap">${D.fmt(t.date)}</td>
      <td>${esc(t.libelle)}${t.categorie !== t.categorieOrigine ? ` <span class="tag" title="Catégorie d’origine : ${esc(t.categorieOrigine)}">corrigé</span>` : ''}${t.part ? ` <span class="tag" title="Compte partagé : montant total ${eur(t.montant / t.part, true)}">votre part ${pct(t.part)}</span>` : ''}</td>
      <td class="num nowrap ${t.montant > 0 ? 'pos' : ''}">${eurSigned(t.montant, true)}</td>
      <td><label class="select small-select"><span class="sr">Catégorie</span><select class="sel-cat" data-id="${esc(t.id)}">${optionsCat(t.categorie)}</select></label></td></tr>`).join('')}</tbody></table></div>`
    : UI.empty('Aucune opération.');

  const lignes = rows.map(r => {
    const ratio = r.budget > 0 ? r.spent / r.budget : (r.spent > 0 ? Infinity : 0);
    const w = r.budget > 0 ? Math.min(ratio, 1) * 100 : 100;
    const ouverte = state.catOuverte === r.key;
    const detail = opsMois.filter(t => normKey(t.categorie) === r.key);
    return `<div class="cat-row cat-clic ${ouverte ? 'ouvert' : ''}" data-cat="${esc(r.key)}" tabindex="0" role="button" aria-expanded="${ouverte}" title="Voir les opérations">
      <div class="cat-name"><span class="chevron" aria-hidden="true">▸</span> ${esc(r.label)}${r.horsBudget && !parBanque ? ' <span class="tag">hors budget</span>' : ''}</div>
      <div class="cat-bar">
        <div class="track"><div class="fill ${ratio > 1 ? 'over' : ''} ${r.horsBudget ? 'hb' : ''}" style="width:${w}%"></div>
        ${isCurrent && r.budget > 0 ? `<div class="pace" style="left:${pace * 100}%"></div>` : ''}</div>
      </div>
      <div class="cat-val num"><strong>${eur(r.spent)}</strong> <span class="muted">/ ${r.budget ? eur(r.budget) : '—'}</span></div>
      <div class="cat-status">${r.budget > 0 ? UI.status(ratio, isCurrent ? pace : 1) : '<span class="muted small">—</span>'}</div>
    </div>
    <div class="cat-detail" ${ouverte ? '' : 'hidden'}>${tableOps(detail)}</div>`;
  }).join('');

  // Catégories du mois absentes du budget : revenus et mouvements exclus (épargne, virements…), cliquables aussi
  const clesBudget = new Set(rows.map(r => r.key));
  const autres = new Map();
  opsMois.forEach(t => {
    const k = normKey(t.categorie);
    if (clesBudget.has(k)) return;
    const a = autres.get(k) || { key: k, label: t.categorie, net: 0, exclue: F.exclue(M, t.categorie) };
    a.net += t.montant; autres.set(k, a);
  });
  const ligneAutre = a => {
    const ouverte = state.catOuverte === a.key;
    return `<div class="cat-row cat-clic ${ouverte ? 'ouvert' : ''}" data-cat="${esc(a.key)}" tabindex="0" role="button" aria-expanded="${ouverte}" title="Voir les opérations">
      <div class="cat-name"><span class="chevron" aria-hidden="true">▸</span> ${esc(a.label)}</div>
      <div class="cat-bar"></div>
      <div class="cat-val num"><strong class="${a.net > 0 ? 'pos' : ''}">${eurSigned(a.net)}</strong></div>
      <div class="cat-status"><span class="muted small">${a.exclue ? 'exclu' : a.net > 0 ? 'revenu' : ''}</span></div>
    </div>
    <div class="cat-detail" ${ouverte ? '' : 'hidden'}>${tableOps(opsMois.filter(t => normKey(t.categorie) === a.key))}</div>`;
  };
  const listeAutres = [...autres.values()].sort((x, y) => (x.exclue - y.exclue) || (y.net - x.net));
  const lignesAutres = listeAutres.map(ligneAutre).join('');

  const nbLoc = Corrections.nbLocales();
  const barreCorr = `<div class="corr-bar">
    <label class="check"><input type="checkbox" id="chk-libelle" ${state.toutLibelle !== false ? 'checked' : ''}> Appliquer un changement de catégorie à toutes les opérations du même libellé</label>
    ${nbLoc ? `<span class="corr-status"><span class="status warning">● ${nbLoc} correction${nbLoc > 1 ? 's' : ''} gardée${nbLoc > 1 ? 's' : ''} dans ce navigateur</span>
      ${M.source === 'github' ? '<button class="btn small primary" id="btn-corr-save">Enregistrer sur GitHub</button>' : ''}
      <button class="btn small" id="btn-corr-dl">Télécharger categories.json</button>
      <button class="btn small ghost" id="btn-corr-reset">Annuler</button></span>` : ''}
    ${state.corrMsg ? `<span class="small ${state.corrMsg.ok ? 'pos' : 'neg'}">${esc(state.corrMsg.texte)}</span>` : ''}
  </div>`;

  // Historique sur 6 mois par catégorie
  const hist = D.range(D.addMonths(mk, -5), mk);
  const cats = new Map();
  hist.forEach(m => F.lignesBudget(M, m).forEach(r => { if (!cats.has(r.key)) cats.set(r.key, r.label); }));
  const histData = hist.map(m => new Map(F.lignesBudget(M, m).map(r => [r.key, r])));
  const histRows = [...cats].map(([k, label]) => `<tr><th scope="row">${esc(label)}</th>${histData.map(h => {
    const r = h.get(k);
    if (!r || (!r.spent && !r.budget)) return '<td class="num muted">—</td>';
    const over = r.budget > 0 && r.spent > r.budget;
    return `<td class="num ${over ? 'over-cell' : ''}" title="Budget : ${r.budget ? eur(r.budget) : 'aucun'}">${over ? '<span class="ico">▲</span> ' : ''}${eur(r.spent)}</td>`;
  }).join('')}</tr>`).join('');
  const histTotals = hist.map(m => {
    const t = F.depenses(M, m).total, b = F.budgetTotal(M, m);
    if (parBanque) return `<td class="num">${eur(t)}</td>`;
    return `<td class="num ${t > b ? 'over-cell' : ''}">${t > b ? '<span class="ico">▲</span> ' : ''}${eur(t)}<div class="muted small">/ ${eur(b)}</div></td>`;
  }).join('');

  const options = allMonths.map(m => `<option value="${m}" ${m === mk ? 'selected' : ''}>${D.monthLabel(m, true)}${m === cm ? ' (en cours)' : ''}</option>`).join('');

  const nomsComptes = b => comptesAvecOps(Mtout, b).map(c => c.nom).join(', ');
  const onglets = banques.length > 1 ? `<nav class="onglets" aria-label="Comptes">
    ${['', ...banques].map(b => `<button type="button" class="onglet" data-banque="${esc(b)}" aria-pressed="${b === banque}" title="${b ? esc(nomsComptes(b)) : 'Virements entre vos comptes neutralisés'}">${b ? esc(b) : 'Tous les comptes'}</button>`).join('')}
  </nav>` : '';
  const kpisBudget = parBanque ? `
        ${UI.kpi('Dépensé', eur(dep.total), `${esc(nomsComptes(banque))} · ${isCurrent ? `au ${D.fmt(today)}` : D.monthLabel(mk, true)}`)}
        ${UI.kpi('Reçu de vos comptes', eur(recuInterne), 'virements depuis vos autres comptes')}
        ${UI.kpi('Envoyé vers vos comptes', eur(envoyeInterne), 'virements vers vos autres comptes')}
        ${UI.kpi(isCurrent ? 'Solde actuel' : 'Solde fin de mois', eur(soldeBanque), banque)}` : `
        ${UI.kpi('Dépensé', eur(dep.total), isCurrent ? `au ${D.fmt(today)} · ${pct(pace)} du mois écoulé` : D.monthLabel(mk, true))}
        ${UI.kpi('Budget', eur(bud), `${rows.filter(r => r.budget > 0).length} catégories`)}
        ${UI.kpi(reste >= 0 ? 'Reste à dépenser' : 'Dépassement', `<span class="${reste < 0 ? 'neg' : ''}">${eur(Math.abs(reste))}</span>`, `${pct(bud ? dep.total / bud : null)} du budget consommé`)}
        ${isCurrent
          ? UI.kpi('Projection fin de mois', eur(projection), `d’après les 3 derniers mois · ${UI.delta(projection - bud, null, { invert: true, suffix: 'vs budget' })}`)
          : UI.kpi('Écart au budget', UI.delta(dep.total - bud, bud, { invert: true }), 'positif = dépassement')}`;
  const ecartInterne = recuInterne - envoyeInterne;
  const noteInterne = !parBanque && internesMois.length ? `<p class="small muted note-interne">${internesMois.length} virements entre vos comptes neutralisés ce mois-ci (${eur(envoyeInterne)} envoyés, ${eur(recuInterne)} reçus${Math.abs(ecartInterne) >= 0.5 ? ` · écart ${eurSigned(ecartInterne)}, virement pas encore arrivé ou compte non suivi` : ''}).</p>` : '';

  const html = `
    <div class="page-h">
      <h1>Dépenses</h1>
      <label class="select"><span class="sr">Mois</span><select id="sel-mois">${options}</select></label>
    </div>
    ${onglets}
    ${barreCorr}
    <div class="grid">
      <section class="card span-12"><div class="kpis four">${kpisBudget}
      </div>
      <div class="kpis four kpis-2">
        ${UI.kpi('Revenus', eur(rev), isCurrent && !rev ? 'pas encore reçus ce mois-ci' : 'section Revenus du P&L')}
        ${parBanque ? `
        ${UI.kpi('Charges', eur(P.charges), 'nettes des remboursements')}
        ${UI.kpi('Variation du solde', `<span class="${P.variation < 0 ? 'neg' : 'pos'}">${eurSigned(P.variation)}</span>`, 'toutes opérations, virements compris')}` : `
        ${UI.kpi('Capacité d’épargne', `<span class="${epargne < 0 ? 'neg' : 'pos'}">${eurSigned(epargne)}</span>`, `revenus − charges (${eur(P.charges)})`)}
        ${UI.kpi('Taux d’épargne', pct(taux), `moyenne des 12 derniers mois : ${pct(taux12)}`)}`}
        ${UI.kpi('Versé sur l’épargne', eur(verse), 'net, vers livrets, assurance vie…')}
      </div>${noteInterne}</section>

      ${UI.card('Des revenus à l’épargne', UI.chart('ch-waterfall', 320), { sub: `${D.monthLabel(mk, true)} · revenus, puis chaque groupe de charges du P&L, jusqu’à ce qui reste`, cls: 'span-12' })}

      ${state.pnlDetail
        ? UI.card('P&L mensuel', tablePnl(M, mk, state), { sub: '12 mois jusqu’au mois sélectionné · cliquez sur un groupe pour le détailler, sur un montant pour voir ses opérations', cls: 'span-12',
          actions: '<button type="button" class="btn small" id="btn-pnl-vue">Revenir au résumé</button>' })
        : UI.card('P&L', pnlResume(M, mk, state), { sub: 'Moyennes mensuelles sur les 12 derniers mois complets', cls: 'span-12',
          actions: '<button type="button" class="btn small" id="btn-pnl-vue">Voir le détail mensuel</button>' })}

      ${UI.card('Budget par catégorie', `<div class="cats">${lignes || UI.empty('Aucune dépense pour ce mois.')}</div>
        ${lignesAutres ? `<h3 class="cats-titre">Revenus et mouvements hors budget</h3><div class="cats">${lignesAutres}</div>` : ''}
        <p class="legend-note small muted">${isCurrent ? '<span class="pace-key"></span> repère : avancement du mois · ' : ''}Cliquez sur une catégorie pour voir ses opérations et en changer la catégorie.</p>`,
        { sub: D.monthLabel(mk, true), cls: 'span-12' })}

      ${UI.card(parBanque ? 'Dépenses mensuelles' : 'Dépenses mensuelles vs budget', UI.chart('ch-mois', 280), { sub: '12 derniers mois (hors virements d’épargne)', cls: 'span-7' })}
      ${UI.card('Capacité d’épargne mensuelle', UI.chart('ch-epargne', 280), { sub: 'Revenus − charges du P&L, 12 derniers mois (taux au survol)', cls: 'span-5' })}

      ${UI.card('Historique par catégorie', `<div class="table-wrap"><table class="hist">
        <thead><tr><th>Catégorie</th>${hist.map(m => `<th class="num">${D.monthLabel(m)}</th>`).join('')}</tr></thead>
        <tbody>${histRows}</tbody>
        <tfoot><tr><th scope="row">Total</th>${histTotals}</tr></tfoot></table></div>
        <p class="small muted"><span class="status critical">▲</span> montant supérieur au budget de la catégorie</p>`, { sub: '6 mois jusqu’au mois sélectionné', cls: 'span-12' })}
    </div>`;

  return { html, after() {
    document.getElementById('sel-mois').addEventListener('change', e => { state.mois = e.target.value; App.render(); });
    document.getElementById('chk-libelle').addEventListener('change', e => { state.toutLibelle = e.target.checked; });
    document.querySelectorAll('.onglet').forEach(b => b.addEventListener('click', () => {
      state.banque = b.dataset.banque; state.catOuverte = null; App.render({ garderScroll: true });
    }));

    // Clic sur une catégorie : affiche / masque ses opérations
    document.querySelectorAll('.cat-clic').forEach(row => {
      const basculer = () => {
        const d = row.nextElementSibling, ouvrir = d.hidden;
        document.querySelectorAll('.cat-detail').forEach(x => { x.hidden = true; x.previousElementSibling.classList.remove('ouvert'); x.previousElementSibling.setAttribute('aria-expanded', 'false'); });
        d.hidden = !ouvrir; row.classList.toggle('ouvert', ouvrir); row.setAttribute('aria-expanded', String(ouvrir));
        state.catOuverte = ouvrir ? row.dataset.cat : null;
      };
      row.addEventListener('click', basculer);
      row.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); basculer(); } });
    });

    // Changement de catégorie
    const parId = new Map(Mtout.transactions.map(t => [t.id, t]));
    document.querySelectorAll('.sel-cat').forEach(sel => sel.addEventListener('change', () => {
      const t = parId.get(sel.dataset.id);
      let cat = sel.value;
      if (cat === '__nouvelle') {
        cat = (prompt('Nom de la nouvelle catégorie :') || '').trim();
        if (!cat) { sel.value = t.categorie; return; }
      }
      Corrections.changer(Mtout, t, cat, state.toutLibelle !== false);
      state.corrMsg = null;
      App.render({ garderScroll: true });
    }));

    // Enregistrement des corrections
    const save = document.getElementById('btn-corr-save');
    if (save) save.addEventListener('click', async () => {
      save.disabled = true; save.textContent = 'Enregistrement…';
      try {
        const texte = Corrections.texte(Mtout);
        await ghPut(App.getCfg(), 'categories.json', texte, 'Corrections de catégories');
        Mtout.correctionsDepot = JSON.parse(texte);
        Corrections.effacerLocales();
        state.corrMsg = { ok: true, texte: '✓ Corrections enregistrées dans categories.json.' };
      } catch (e) {
        state.corrMsg = { ok: false, texte: 'Enregistrement impossible : ' + e.message + '. Les corrections restent dans ce navigateur ; vous pouvez aussi télécharger categories.json.' };
      }
      App.render({ garderScroll: true });
    });
    const dl = document.getElementById('btn-corr-dl');
    if (dl) dl.addEventListener('click', () => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([Corrections.texte(Mtout)], { type: 'application/json' }));
      a.download = 'categories.json'; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    });
    const reset = document.getElementById('btn-corr-reset');
    if (reset) reset.addEventListener('click', () => {
      if (!confirm('Annuler les corrections non enregistrées ?')) return;
      Corrections.effacerLocales(); Corrections.appliquer(Mtout); state.corrMsg = null;
      App.render({ garderScroll: true });
    });

    // Waterfall : revenus, puis chaque groupe de charges du P&L (net), jusqu'à la capacité d'épargne
    const groupesCharges = F.pnlPlan(M).groupes.find(g => g.section === 'Charges').groupes
      .map(g => ({ label: g.nom, value: g.cats.reduce((s, c) => s + (P.parCat.get(normKey(c)) || 0), 0) }))
      .filter(g => Math.abs(g.value) >= 0.5).sort((a, b) => a.value - b.value);
    Charts.waterfall(document.getElementById('ch-waterfall'), [
      { label: 'Revenus', value: rev, total: true },
      ...groupesCharges,
      { label: epargne >= 0 ? 'Capacité d’épargne' : 'Déficit', value: epargne, total: true, fin: true },
    ]);

    // P&L : ouvrir / fermer un groupe ; clic sur un montant de catégorie → ses opérations du mois
    // P&L : bascule résumé / détail ; dans le résumé, « Charges » se replie, un groupe ouvre le détail sur lui
    document.getElementById('btn-pnl-vue')?.addEventListener('click', () => { state.pnlDetail = !state.pnlDetail; App.render({ garderScroll: true }); });
    const prCharges = document.getElementById('pr-charges');
    if (prCharges) {
      const basculer = () => { state.pnlChargesOuvert = state.pnlChargesOuvert === false; App.render({ garderScroll: true }); };
      prCharges.addEventListener('click', basculer);
      prCharges.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); basculer(); } });
    }
    document.querySelectorAll('.pr-ligne.sous[data-groupe]').forEach(el => {
      const ouvrir = () => { (state.pnlOuverts || (state.pnlOuverts = new Set())).add(el.dataset.groupe); state.pnlDetail = true; App.render({ garderScroll: true }); };
      el.addEventListener('click', ouvrir);
      el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); ouvrir(); } });
    });
    document.querySelectorAll('.pnl-groupe').forEach(tr => tr.addEventListener('click', () => {
      const ouverts = state.pnlOuverts || (state.pnlOuverts = new Set()), k = tr.dataset.groupe;
      ouverts.has(k) ? ouverts.delete(k) : ouverts.add(k);
      App.render({ garderScroll: true });
    }));
    document.querySelectorAll('.pnl-cell[data-cat]').forEach(td => td.addEventListener('click', e => {
      e.stopPropagation();
      state.mois = td.dataset.mois; state.catOuverte = td.dataset.cat;
      App.render();
      const row = document.querySelector(`.cat-clic[data-cat="${CSS.escape(td.dataset.cat)}"]`);
      if (row) row.scrollIntoView({ block: 'center' });
    }));

    const months = D.range(D.addMonths(cm, -11), cm);
    Charts.barsWithLine(document.getElementById('ch-mois'), months.map(m => D.monthLabel(m)),
      { label: 'Dépenses', data: months.map(m => F.depenses(M, m).total) },
      parBanque ? null : { label: 'Budget', data: months.map(m => F.budgetTotal(M, m)) },
      { highlightLast: true });
    const pM = months.map(m => F.pnl(M, m)), revM = pM.map(p => p.revenus), epM = pM.map(p => p.resultat);
    Charts.signedBars(document.getElementById('ch-epargne'), months.map(m => D.monthLabel(m)), 'Épargne', epM,
      { label: ctx => ` Épargne : ${eurSigned(ctx.parsed.y)} · taux ${pct(revM[ctx.dataIndex] > 0 ? epM[ctx.dataIndex] / revM[ctx.dataIndex] : null)}` });
  } };
}

/* ---------- Immobilier ---------- */
function pageImmobilier(M, state) {
  const biens = M.immobilier || [];
  if (!biens.length) return { html: `<div class="page-h"><h1>Immobilier</h1></div>${UI.card('Aucun bien', UI.empty('Décrivez vos biens et leurs prêts dans immobilier.json (voir le README).'))}` };
  const b = biens.find(x => x.id === state.bien) || biens[0];
  const today = D.today(), q = Immo.part(b), ech = b.echeancier, pret = b.pret || {};
  const valeur = Immo.valeur(b, today), crd = Immo.crd(b, today), net = valeur - crd;
  const prix = Immo.prixAchat(b), cout = Immo.coutTotal(b), surface = parseNum(b.surface);
  const estim = [...b.estimations].reverse().find(e => e.date <= today) || b.estimations[0];
  const payees = ech.filter(e => e.date <= today), prochaine = ech.find(e => e.date > today), fin = ech[ech.length - 1];
  const somme = (l, k) => l.reduce((s, e) => s + e[k], 0);
  const montant = parseNum(pret.montant) || 0, totInt = somme(ech, 'interets'), totAss = somme(ech, 'assurance');
  const intPayes = somme(payees, 'interets'), capRemb = somme(payees, 'capital'), assPayee = somme(payees, 'assurance');
  const mensTotale = (prochaine || fin) ? (parseNum(pret.mensualite) || 0) + (prochaine || fin).assurance : 0;
  const moi = (b.proprietaires || []).find(p => p.moi);

  // Votre coût mensuel du logement : opérations des catégories de charges, à votre part pour le compte joint
  // (12 derniers mois depuis l'achat)
  const cats = new Set((b.categoriesCharges || []).map(normKey)), ops = opsVotrePart(M);
  const cm = F.moisCourant(), mois12 = D.range(D.addMonths(cm, -12), D.addMonths(cm, -1)).filter(m => m >= D.monthKey(b.dateAchat));
  const parMois = mois12.map(m => -ops.filter(t => D.monthKey(t.date) === m && cats.has(normKey(t.categorie)))
    .reduce((s, t) => s + t.montant, 0));
  // Charges annuelles du bien pas (encore) visibles dans les comptes, comme la taxe foncière : votre part, au mois
  const annuelles = (b.chargesAnnuelles || []).filter(c => parseNum(c.montant));
  const parMoisAnnuelles = annuelles.reduce((s, c) => s + parseNum(c.montant), 0) * q / 12;
  const moyLogement = (parMois.length ? parMois.reduce((s, v) => s + v, 0) / parMois.length : 0) + parMoisAnnuelles;

  // Échéancier annuel
  const annees = [...new Set(ech.map(e => e.date.slice(0, 4)))];
  const anneeCourante = today.slice(0, 4);
  const lignesAn = annees.map(a => {
    const l = ech.filter(e => e.date.startsWith(a));
    return { a, n: l.length, capital: somme(l, 'capital'), interets: somme(l, 'interets'), assurance: somme(l, 'assurance'), crd: l[l.length - 1].crd };
  });
  const rowsAn = lignesAn.map(r => `<tr class="${r.a === anneeCourante ? 'ligne-courante' : r.a < anneeCourante ? 'muted' : ''}">
    <td>${r.a}</td><td class="num">${r.n}</td><td class="num">${eur(r.capital)}</td><td class="num">${eur(r.interets)}</td>
    <td class="num">${eur(r.assurance)}</td><td class="num"><strong>${eur(r.crd)}</strong></td></tr>`).join('');

  const acquisition = (b.acquisition || []).map(a => `<tr><td>${esc(a.poste)}${a.detail ? `<div class="muted small">${esc(a.detail)}</div>` : ''}</td><td class="num">${eur(a.montant)}</td></tr>`).join('');
  const apports = (b.proprietaires || []).reduce((s, p) => s + (parseNum(p.apport) || 0), 0);
  const financement = `${(b.proprietaires || []).map(p => `<tr><td>Apport ${esc(p.nom)}</td><td class="num">${eur(p.apport)}</td></tr>`).join('')}
    ${montant ? `<tr><td>${esc(pret.nom || 'Prêt')}</td><td class="num">${eur(montant)}</td></tr>` : ''}`;

  const selectHtml = biens.length > 1 ? `<label class="select"><span class="sr">Bien</span><select id="sel-bien">${biens.map(x => `<option value="${esc(x.id)}" ${x === b ? 'selected' : ''}>${esc(x.nom)}</option>`).join('')}</select></label>` : '';
  const pv = valeur - prix;

  const html = `
    <div class="page-h"><h1>Immobilier</h1>${selectHtml}
      <p class="muted">${esc(b.nom)} · ${esc(b.adresse || '')} · acheté le ${D.fmt(b.dateAchat)}</p></div>
    <div class="grid">
      <section class="card hero span-12">
        <div class="hero-main">
          <div class="kpi-label">Valeur nette${q < 1 ? ` · votre part (${pct(q)})` : ''}</div>
          <div class="hero-value">${eur(net * q)}</div>
          <div class="hero-deltas">
            <div><span class="muted">Bien entier :</span> ${eur(net)} <span class="muted">(${eur(valeur)} − ${eur(crd)} de crédit)</span></div>
            <div>${UI.delta(net * q - (moi ? parseNum(moi.apport) || 0 : 0))} <span class="muted">par rapport à votre apport${moi ? ` (${eur(moi.apport)})` : ''}</span></div>
          </div>
        </div>
        <div class="kpis">
          ${UI.kpi('Valeur estimée', eur(valeur), `${estim?.min && estim?.max ? `entre ${eur(estim.min)} et ${eur(estim.max)} · ` : ''}${esc(estim?.source || '')}${estim?.date ? ` (${D.fmt(estim.date)})` : ''}`)}
          ${UI.kpi('Capital restant dû', eur(crd), `${pct(montant ? capRemb / montant : null)} remboursé · fin ${fin ? D.fmt(fin.date) : '—'}`)}
          ${UI.kpi('Plus-value latente', UI.delta(pv), `vs prix d’achat (${eur(prix)}) · ${UI.delta(valeur - cout)} vs coût total`)}
        </div>
      </section>

      <section class="card span-12"><div class="kpis four">
        ${UI.kpi('Mensualité', eur(mensTotale, true), `${eur(pret.mensualite, true)} de prêt + ${eur((prochaine || fin)?.assurance, true)} d’assurance`)}
        ${UI.kpi('Prochaine échéance', prochaine ? D.fmt(prochaine.date) : '—', prochaine ? `n° ${prochaine.n}/${ech.length} · ${eur(prochaine.capital, true)} de capital, ${eur(prochaine.interets, true)} d’intérêts` : 'prêt remboursé')}
        ${UI.kpi('Intérêts payés', eur(intPayes), `${eur(totInt - intPayes)} restant à payer sur ${eur(totInt)}`)}
        ${UI.kpi('Votre coût du logement', eur(moyLogement), `par mois : moyenne sur ${parMois.length} mois de votre part (crédit, assurance, charges)${annuelles.length ? ` + ${annuelles.map(c => `${esc(c.poste.toLowerCase())} ${eur(parseNum(c.montant) * q / 12)}`).join(', ')}` : ''}`)}
      </div></section>

      ${UI.card('Valeur, crédit et valeur nette', UI.chart('ch-immo', 300), { sub: 'Bien entier, de l’achat à la fin du prêt (valeur estimée constante après la dernière estimation)', cls: 'span-8' })}
      ${UI.card('Le bien', `<dl class="facts">
        <div><dt>Description</dt><dd>${esc(b.description || '—')}</dd></div>
        <div><dt>Surface Carrez</dt><dd>${surface ? surface.toLocaleString('fr-FR') + ' m²' : '—'}</dd></div>
        <div><dt>Usage</dt><dd>${esc(b.usage || '—')}</dd></div>
        ${estim?.detail ? `<div><dt>Estimation</dt><dd>${esc(estim.detail)}</dd></div>` : ''}
        ${annuelles.map(c => `<div><dt>${esc(c.poste)}</dt><dd>${eur(c.montant)} par an${c.detail ? ` <span class="muted">(${esc(c.detail)})</span>` : ''}</dd></div>`).join('')}
        <div><dt>Propriétaires</dt><dd>${(b.proprietaires || []).map(p => `${esc(p.nom)} ${pct(parseNum(p.part))}`).join(' · ') || '—'}</dd></div>
        <div><dt>Notaire</dt><dd>${esc(b.notaire || '—')}</dd></div>
        <div><dt>Prêt</dt><dd>${eur(montant)} sur ${Math.round((parseNum(pret.duree) || 0) / 12)} ans à ${String(pret.taux ?? '—').replace('.', ',')} % (TAEG ${String(pret.taeg ?? '—').replace('.', ',')} %) · ${esc(pret.garantie || '')}</dd></div>
        <div><dt>Assurance</dt><dd>${esc(pret.assurance?.assureur || '—')}${pret.assurance?.quotite ? ` · ${esc(pret.assurance.quotite)}` : ''}</dd></div>
      </dl>`, { cls: 'span-4' })}

      ${UI.card('Remboursement par année', UI.chart('ch-immo-an', 280), { sub: 'Capital, intérêts et assurance (les deux emprunteurs)', cls: 'span-7' })}
      ${UI.card('Coût d’acquisition', `<div class="table-wrap"><table>
        <tbody>${acquisition}</tbody>
        <tfoot><tr><td>Coût total</td><td class="num">${eur(cout)}</td></tr></tfoot></table></div>
        <h3 class="cats-titre">Financement</h3>
        <div class="table-wrap"><table><tbody>${financement}</tbody>
        <tfoot><tr><td>Total</td><td class="num">${eur(apports + montant)}</td></tr></tfoot></table></div>
        <p class="small muted">Coût du crédit sur toute sa durée : ${eur(totInt)} d’intérêts et ${eur(totAss)} d’assurance.</p>`, { cls: 'span-5' })}

      ${UI.card('Votre coût mensuel du logement', parMois.length ? UI.chart('ch-immo-mois', 240) : UI.empty('Pas encore de mois complet depuis l’achat.'),
        { sub: `Catégories ${[...(b.categoriesCharges || [])].map(esc).join(', ')} : vos comptes, et votre part (${pct(q)}) des opérations du compte joint.`, cls: 'span-12' })}

      ${UI.card('Échéancier', `<div class="table-wrap"><table>
        <thead><tr><th>Année</th><th class="num">Échéances</th><th class="num">Capital</th><th class="num">Intérêts</th><th class="num">Assurance</th><th class="num">Restant dû fin d’année</th></tr></thead>
        <tbody>${rowsAn}</tbody>
        <tfoot><tr><td>Total</td><td class="num">${ech.length}</td><td class="num">${eur(somme(ech, 'capital'))}</td><td class="num">${eur(totInt)}</td><td class="num">${eur(totAss)}</td><td></td></tr></tfoot></table></div>
        <p class="small muted">Calculé à partir de l’offre de prêt (mensualités constantes, intérêts arrondis au centime) ; ${payees.length} échéance${payees.length > 1 ? 's' : ''} payée${payees.length > 1 ? 's' : ''} au ${D.fmt(today)} (${eur(assPayee)} d’assurance). Pour mettre à jour la valeur du bien, ajoutez une estimation datée dans <code>immobilier.json</code>.</p>`,
        { sub: 'Prêt et assurance des deux emprunteurs, par année civile', cls: 'span-12' })}
    </div>`;

  return { html, after() {
    const sel = document.getElementById('sel-bien');
    if (sel) sel.addEventListener('change', e => { state.bien = e.target.value; App.render(); });
    // Un point par mois, de l'achat à la dernière échéance
    const mois = D.range(D.monthKey(b.dateAchat), fin ? D.monthKey(fin.date) : cm);
    const dates = mois.map(m => m === cm ? today : D.endOfMonth(m));
    const v = dates.map(d => Immo.valeur(b, d)), c = dates.map(d => Immo.crd(b, d));
    Charts.line(document.getElementById('ch-immo'), mois.map(m => D.monthLabel(m)), [
      { label: 'Valeur nette', data: v.map((x, i) => x - c[i]) },
      { label: 'Valeur estimée', data: v, dash: [5, 4] },
      { label: 'Capital restant dû', data: c },
    ]);
    const i = lignesAn.findIndex(r => r.a === anneeCourante);
    Charts.stackedBars(document.getElementById('ch-immo-an'), lignesAn.map(r => r.a), [
      { label: 'Capital', data: lignesAn.map(r => r.capital) },
      { label: 'Intérêts', data: lignesAn.map(r => r.interets) },
      { label: 'Assurance', data: lignesAn.map(r => r.assurance) },
    ], { highlight: i });
    if (parMois.length) Charts.barsWithLine(document.getElementById('ch-immo-mois'), mois12.map(m => D.monthLabel(m)),
      { label: 'Logement (votre part)', data: parMois }, { label: 'Votre part de la mensualité', data: mois12.map(() => mensTotale * q) });
  } };
}

/* ---------- Épargne ---------- */
// Cellule colorée selon le signe et l'ampleur d'un rendement (pôles divergents, texte toujours en encre normale).
function cellRendement(p, title = '') {
  if (p == null || !isFinite(p)) return '<td class="num muted">—</td>';
  const force = Math.round(Math.min(Math.abs(p) / 0.06, 1) * 38);
  const col = p >= 0 ? 'var(--div-pos)' : 'var(--div-neg)';
  return `<td class="num heat" style="background:color-mix(in srgb, ${col} ${force}%, transparent)" title="${esc(title)}">${pctSigned(p)}</td>`;
}

function tableRendements(M, ids) {
  const mensuels = F.rendementsMensuels(M, ids);
  const annuels = F.rendementsAnnuels(mensuels);
  const parMois = new Map(mensuels.map(r => [r.mk, r]));
  const annees = [...annuels.keys()].sort().reverse();
  if (!annees.length) return UI.empty('Pas encore assez d’historique (il faut au moins deux relevés mensuels).');
  const noms = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
  const lignes = annees.map(y => {
    const a = annuels.get(y);
    const cells = noms.map((_, i) => { const r = parMois.get(`${y}-${pad(i + 1)}`); return cellRendement(r?.pct, r?.gain != null ? `Gain : ${eurSigned(r.gain)}` : ''); }).join('');
    return `<tr><th scope="row">${y}${y === F.moisCourant().slice(0, 4) ? ' <span class="muted small">(en cours)</span>' : ''}</th>${cells}
      <td class="num strong-cell">${pctSigned(a.indice - 1)}<div class="small">${UI.delta(a.gain)}</div></td></tr>`;
  }).join('');
  return `<div class="table-wrap"><table class="heat-table">
    <thead><tr><th></th>${noms.map(n => `<th class="num">${n}</th>`).join('')}<th class="num">Année</th></tr></thead>
    <tbody>${lignes}</tbody></table></div>
    <p class="small muted">Rendement de chaque mois hors versements ; l’année chaîne les mois (performance « time-weighted »). Survolez une case pour le gain en euros.</p>`;
}

function cartesPositions(M, compte, today, state, ouvert = false) {
  const cm = F.moisCourant();
  const lignes = F.positionsAt(M, compte.id, today).filter(p => p.quantite > 0);
  if (!lignes.length) return '';
  const total = lignes.reduce((s, p) => s + p.quantite * p.cours, 0);
  const dPrev = D.endOfMonth(D.addMonths(cm, -1)), dYtd = (Number(cm.slice(0, 4)) - 1) + '-12-31', d12 = D.endOfMonth(D.addMonths(cm, -12));
  const varDepuis = (p, d) => { const c0 = F.coursAt(M, compte.id, p.titre, d); return c0 ? p.cours / c0 - 1 : null; };
  let pvTotal = 0, coutTotal = 0, divTotal = 0;
  const avecOps = lignes.some(p => F.historiqueLigne(M, compte.id, p.titre));
  const nbCols = avecOps ? 13 : 11;
  const libOp = { achat: 'Achat', vente: 'Vente', dividende: 'Dividende', attribution: 'Attribution gratuite' };
  const rows = lignes.sort((a, b) => b.quantite * b.cours - a.quantite * a.cours).map((p, i) => {
    const val = p.quantite * p.cours;
    const cout = p.pru != null ? p.quantite * p.pru : null;
    if (cout != null) { pvTotal += val - cout; coutTotal += cout; }
    const h = avecOps ? F.historiqueLigne(M, compte.id, p.titre) : null;
    if (h) divTotal += h.dividendes;
    const debut = h?.depuis ? (h.avantDebut ? `avant le ${D.fmt(h.depuis)}` : D.fmt(h.depuis)) : '—';
    const detail = h ? `<tr class="ligne-detail" id="det-${esc(compte.id)}-${i}" hidden><td colspan="${nbCols}">
      ${h.avantDebut ? `<p class="small muted">Ligne déjà détenue au ${D.fmt(h.depuis)}, début de l’historique des opérations : les achats antérieurs n’y figurent pas.</p>` : ''}
      <table class="ops"><thead><tr><th>Date</th><th>Opération</th><th class="num">Qté</th><th class="num">Prix</th><th class="num">Montant</th></tr></thead>
      <tbody>${h.ops.slice().reverse().map(o => `<tr><td>${D.fmt(o.date)}</td><td>${libOp[o.operation]}</td>
        <td class="num">${o.operation === 'dividende' ? '' : o.quantite.toLocaleString('fr-FR')}</td>
        <td class="num">${o.prix ? eur(o.prix, true) : ''}</td>
        <td class="num">${o.montant ? eurSigned(o.montant) : ''}</td></tr>`).join('') || `<tr><td colspan="5" class="muted">Aucune opération depuis le début de l’historique.</td></tr>`}</tbody></table>
      </td></tr>` : '';
    return `<tr${h ? ` class="ligne-clic" data-detail="det-${esc(compte.id)}-${i}" tabindex="0" title="Afficher les opérations"` : ''}>
      <td>${h ? '<span class="chevron" aria-hidden="true">▸</span> ' : ''}<strong>${esc(p.titre)}</strong>${p.ticker ? ` <span class="muted small">${esc(p.ticker)}</span>` : ''}</td>
      ${avecOps ? `<td class="nowrap">${debut}</td>` : ''}
      <td class="num">${p.quantite.toLocaleString('fr-FR')}</td>
      <td class="num">${p.pru != null ? eur(p.pru, true) : '—'}</td>
      <td class="num">${eur(p.cours, true)}</td>
      <td class="num">${eur(val)}</td>
      <td class="num">${cout != null ? UI.delta(val - cout) : '<span class="muted">—</span>'}</td>
      <td class="num">${cout ? pctSigned(val / cout - 1) : '<span class="muted">—</span>'}</td>
      ${avecOps ? `<td class="num">${h?.dividendes ? eur(h.dividendes) : '<span class="muted">—</span>'}</td>` : ''}
      <td class="num muted">${pct(val / total)}</td>
      <td class="num">${pctSigned(varDepuis(p, dPrev))}</td>
      <td class="num">${pctSigned(varDepuis(p, dYtd))}</td>
      <td class="num">${pctSigned(varDepuis(p, d12))}</td>
    </tr>${detail}`;
  }).join('');

  const mois = D.range(D.addMonths(cm, -11), cm);
  const heat = lignes.map(p => `<tr><th scope="row">${esc(p.titre)}</th>${mois.map(m => {
    const c1 = F.coursAt(M, compte.id, p.titre, F.dateFin(m)), c0 = F.coursAt(M, compte.id, p.titre, D.endOfMonth(D.addMonths(m, -1)));
    return cellRendement(c0 && c1 ? c1 / c0 - 1 : null, c1 ? `Cours : ${eur(c1, true)}` : '');
  }).join('')}</tr>`).join('');

  return `
    ${UI.repli(`lignes-${compte.id}`, `Lignes — ${esc(compte.nom)}`, `<div class="table-wrap"><table>
      <thead><tr><th>Ligne</th>${avecOps ? '<th>1er achat</th>' : ''}<th class="num">Qté</th><th class="num">PRU</th><th class="num">Cours</th><th class="num">Valorisation</th><th class="num">+/- value</th><th class="num">vs PRU</th>${avecOps ? '<th class="num">Dividendes</th>' : ''}<th class="num">Poids</th><th class="num">1 mois</th><th class="num">Depuis 1er janv.</th><th class="num">12 mois</th></tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr><td colspan="${avecOps ? 5 : 4}">Total titres</td><td class="num">${eur(total)}</td><td class="num">${UI.delta(pvTotal)}</td><td class="num">${coutTotal ? pctSigned(pvTotal / coutTotal) : '—'}</td>${avecOps ? `<td class="num">${eur(divTotal)}</td>` : ''}<td colspan="4"></td></tr></tfoot>
      </table></div>
      <p class="small muted">« +/- value » : valorisation moins prix de revient (PRU × quantité). « vs PRU » : cours actuel comparé à votre prix de revient unitaire. Les colonnes 1 mois / 1er janv. / 12 mois comparent les cours (hors dividendes), quelle que soit la date d’achat.
      ${avecOps ? 'Cliquez sur une ligne pour voir ses achats, ventes et dividendes.' : 'Dates d’achat non disponibles pour ce contrat : les versements sont répartis automatiquement entre les fonds.'}</p>`,
      { sub: `${lignes.length} ligne${lignes.length > 1 ? 's' : ''} · ${eur(total)} · relevé du ${D.fmt(lignes[0].date)}`, state, ouvert })}
    ${UI.repli(`cours-${compte.id}`, `Variation mensuelle des cours — ${esc(compte.nom)}`, `<div class="table-wrap"><table class="heat-table">
      <thead><tr><th>Ligne</th>${mois.map(m => `<th class="num">${D.monthLabel(m)}</th>`).join('')}</tr></thead>
      <tbody>${heat}</tbody></table></div>`, { sub: '12 derniers mois', state })}`;
}

function pageEpargne(M, state) {
  const today = D.today(), cm = F.moisCourant();
  const comptes = M.comptes.filter(c => ['epargne', 'placements'].includes(F.classe(c)));
  if (!comptes.length) return { html: `<div class="page-h"><h1>Épargne & placements</h1></div>${UI.card('Aucun compte', UI.empty('Ajoutez des comptes de type livret, assurance-vie, pea… dans comptes.json.'))}` };
  // Onglets : tous les comptes, puis un par type de support (PEA, assurance vie, livrets…). Un onglet
  // regroupe aussi les comptes clôturés de son type (historique), mais n'apparaît que s'il en reste un ouvert.
  const ORDRE = ['pea', 'assurance-vie', 'per', 'pee', 'cto', 'livret', 'fonds-monetaire', 'pel', 'crypto'];
  const types = [...new Set(comptes.map(c => c.type))].sort((a, b) => (ORDRE.indexOf(a) + 1 || 99) - (ORDRE.indexOf(b) + 1 || 99));
  const groupes = types.map(type => {
    const cs = comptes.filter(c => c.type === type);
    const label = typeInfo(type).label + (type === 'livret' && cs.length > 1 ? 's' : '');
    return { type, label, comptes: cs };
  }).filter(g => g.comptes.some(c => F.ouvert(c, today)));
  const groupe = groupes.find(g => g.type === state.groupeEpargne) || null;
  const comptesVue = groupe ? groupe.comptes : comptes;
  const ouverts = comptesVue.filter(c => F.ouvert(c, today));
  // Un seul compte dans l'onglet : vue détaillée de ce compte (lignes, répartition par ligne)
  const choix = comptesVue.length === 1 ? comptesVue[0] : null;
  const ids = comptesVue.map(c => c.id);
  // Une couleur par type de support, la même partout (onglets, cartes, anneau, courbe)
  const COULEUR = { pea: 3, 'assurance-vie': 6, livret: 1, per: 4, pee: 7, 'fonds-monetaire': 5, cto: 2, pel: 2, crypto: 8 };
  const varCouleur = type => `var(--series-${COULEUR[type] || 7})`;
  const couleur = type => Charts.colors().series[(COULEUR[type] || 7) - 1];
  const onglets = groupes.length > 1 ? `<nav class="onglets" aria-label="Supports">
    ${[{ type: '', label: 'Tous les comptes', comptes }, ...groupes].map(g => `<button type="button" class="onglet" data-groupe="${esc(g.type)}" aria-pressed="${(groupe?.type || '') === g.type}" ${g.type ? `style="--c:${varCouleur(g.type)}"` : ''} title="${esc(g.comptes.map(c => c.nom).join(', '))}">${esc(g.label)}</button>`).join('')}
  </nav>` : '';

  const total = ids.reduce((s, id) => s + F.valeur(M, id, today), 0);
  // Plus-values : uniquement sur les comptes dont les versements sont renseignés
  const idsV = ids.filter(id => F.hasVersements(M, id));
  const vers = idsV.reduce((s, id) => s + F.versements(M, id, today), 0);
  const pv = idsV.length ? idsV.reduce((s, id) => s + F.valeur(M, id, today), 0) - vers : null;
  const horsV = ids.length - idsV.length;
  const d12 = D.endOfMonth(D.addMonths(cm, -12)), dYtd = (Number(cm.slice(0, 4)) - 1) + '-12-31';
  const p12 = F.perf(M, ids, d12, today), pYtd = F.perf(M, ids, dYtd, today);
  // TRI annualisé : n'a de sens qu'au-delà de quelques mois d'historique
  const triOk = t => t && t.annees >= 0.25 ? t : null;
  const triCell = t => t ? pctSigned(t.taux) : '<span class="muted">—</span>';
  const tri = triOk(F.tri(M, ids, null, today)), tri12 = triOk(F.tri(M, ids, d12, today));

  const totalTous = comptesVue.reduce((s, c) => s + F.valeur(M, c.id, today), 0);
  const rows = [...ouverts, ...comptesVue.filter(c => !F.ouvert(c, today))].map(c => {
    const v = F.valeur(M, c.id, today), f = F.versements(M, c.id, today), known = F.hasVersements(M, c.id);
    const p = F.perf(M, [c.id], d12, today), t = triOk(F.tri(M, [c.id], null, today));
    return `<tr${F.ouvert(c, today) ? '' : ' class="muted"'}>
      <td><strong>${esc(c.nom)}</strong><div class="muted small">${esc(c.banque)}${c.ferme ? `${c.banque ? ' · ' : ''}clôturé le ${D.fmt(c.ferme)}` : ''}</div></td>
      <td>${esc(typeInfo(c.type).label)}${c.taux != null ? ` <span class="muted small">${String(c.taux).replace('.', ',')} %</span>` : ''}</td>
      <td class="num">${eur(v)}</td>
      <td class="num">${known ? eur(f) : '<span class="muted">—</span>'}</td>
      <td class="num">${known ? UI.delta(v - f) : '<span class="muted">—</span>'}</td>
      <td class="num">${known && f > 0 ? pctSigned((v - f) / f) : '<span class="muted">—</span>'}</td>
      <td class="num">${known ? pctSigned(p.pct) : '<span class="muted">—</span>'}</td>
      <td class="num" title="${t ? `depuis le ${D.fmt(t.debut)}` : ''}">${triCell(t)}</td>
      <td class="num muted">${pct(totalTous ? v / totalTous : null)}</td>
    </tr>`;
  }).join('');

  // Répartition (anneau) : par ligne pour un compte détaillé, par compte dans un onglet de support, par
  // support sur « Tous les comptes » ; un compte sans lignes montre ses versements et ses gains.
  const lignesSel = choix ? F.positionsAt(M, choix.id, today).filter(p => p.quantite > 0) : [];
  const palette = Charts.colors().series;
  let parts, sousRepart;
  if (lignesSel.length) {
    parts = lignesSel.map((p, i) => ({ label: p.titre, v: p.quantite * p.cours })).sort((a, b) => b.v - a.v).map((p, i) => ({ ...p, c: palette[(i + (COULEUR[choix.type] || 7) - 1) % 8] }));
    sousRepart = 'par ligne';
  } else if (choix) {
    parts = pv != null && pv > 0 ? [{ label: 'Versé', v: vers, c: couleur(choix.type) }, { label: 'Gains', v: pv, c: palette[0] === couleur(choix.type) ? palette[2] : palette[0] }] : [{ label: choix.nom, v: total, c: couleur(choix.type) }];
    sousRepart = pv != null && pv > 0 ? 'versements et gains' : '';
  } else if (groupe) {
    parts = ouverts.map((c, i) => ({ label: c.nom, v: F.valeur(M, c.id, today), c: palette[(i + (COULEUR[groupe.type] || 7) - 1) % 8] }));
    sousRepart = 'par compte';
  } else {
    parts = groupes.map(g => ({ label: g.label, v: g.comptes.reduce((s, c) => s + F.valeur(M, c.id, today), 0), c: couleur(g.type) }));
    sousRepart = 'par support';
  }
  parts = parts.filter(p => p.v > 0.5);
  // Au-delà de 7 parts, les plus petites sont regroupées
  if (parts.length > 7) parts = [...parts.slice(0, 6), { label: `${parts.length - 6} autres`, v: parts.slice(6).reduce((s, p) => s + p.v, 0), c: Charts.colors().muted }];
  const totalParts = parts.reduce((s, p) => s + p.v, 0);
  const legende = parts.map(p => `<li><span class="pastille" style="background:${p.c}"></span>${esc(p.label)}<span class="val">${eur(p.v)} · ${pct(totalParts ? p.v / totalParts : null)}</span></li>`).join('');

  // Cartes par support (vue « Tous les comptes ») : un clic ouvre l'onglet du support
  const supports = groupe ? '' : `<section class="supports span-12">${groupes.map(g => {
    const gi = g.comptes.map(c => c.id), v = gi.reduce((s, id) => s + F.valeur(M, id, today), 0), t = triOk(F.tri(M, gi, null, today));
    const p = F.perf(M, gi, d12, today);
    return `<button type="button" class="support" data-groupe="${esc(g.type)}" style="--c:${varCouleur(g.type)}">
      <span class="nom">${esc(g.label)}</span><span class="montant">${eur(v)}</span>
      <span class="detail">${t ? `TRI ${pctSigned(t.taux)}` : 'TRI —'}${p.pct != null ? ` · 12 mois ${pctSigned(p.pct)}` : ''}</span></button>`;
  }).join('')}</section>`;

  const coulVue = choix ? varCouleur(choix.type) : groupe ? varCouleur(groupe.type) : 'var(--accent)';
  const html = `
    <div class="page-h"><h1>Épargne & placements</h1><p class="muted">${choix ? `${esc(choix.nom)}${choix.banque ? ` · ${esc(choix.banque)}` : ''}` : `${esc(groupe ? groupe.label : 'Tous les comptes')} · ${ouverts.length} compte${ouverts.length > 1 ? 's' : ''} ouvert${ouverts.length > 1 ? 's' : ''}`} · situation au ${D.fmt(today)}</p></div>
    ${onglets}
    <div class="grid">
      <section class="card epargne-hero span-12" style="--hero-tint: color-mix(in srgb, ${coulVue} 22%, transparent)">
        <div>
          <div class="kpi-label">${choix ? 'Valorisation' : 'Encours total'}</div>
          <div class="hero-value">${eur(total)}</div>
          <div class="hero-deltas">
            <div>${pv == null ? '<span class="muted">Versements non renseignés</span>' : `${UI.delta(pv)} <span class="muted">de plus-values sur ${eur(vers)} versés (${pctSigned(vers ? pv / vers : null)})</span>`}</div>
            <div>${p12.pct == null ? '<span class="muted">Historique de moins de 12 mois</span>' : `<strong>${pctSigned(p12.pct)}</strong> <span class="muted">sur 12 mois</span>`}${tri ? ` · <strong>${pctSigned(tri.taux)}</strong> <span class="muted">par an depuis le ${D.fmt(tri.debut)} (TRI)</span>` : ''}</div>
          </div>
          ${UI.chart('ch-valeur', 230)}
          <p class="small muted">${idsV.length ? `Valeur (trait plein) et versements cumulés (pointillés) : l’écart correspond aux gains${horsV ? ', sur les comptes dont les versements sont connus' : ''}.` : 'Évolution de la valeur.'}</p>
        </div>
        <div class="donut-wrap">
          ${UI.chart('ch-repartition', 200)}
          ${sousRepart ? `<div class="small muted">Répartition ${sousRepart}</div>` : ''}
          <ul class="legende">${legende}</ul>
        </div>
      </section>

      ${supports}

      <section class="card span-12"><div class="kpis four">
        ${UI.kpi('Plus-values latentes', pv == null ? '—' : UI.delta(pv), pv == null ? 'versements non renseignés' : `sur ${eur(vers)} versés · ${pctSigned(vers ? pv / vers : null)}${horsV ? ` · hors ${horsV} compte${horsV > 1 ? 's' : ''} sans versements` : ''}`)}
        ${UI.kpi('Performance 12 mois', pctSigned(p12.pct), p12.pct == null ? 'historique insuffisant' : `${UI.delta(p12.gain)} · ${eur(p12.flux)} versés`)}
        ${UI.kpi('Depuis le 1er janvier', pctSigned(pYtd.pct), pYtd.pct == null ? 'historique insuffisant' : `${UI.delta(pYtd.gain)} · ${eur(pYtd.flux)} versés`)}
        ${UI.kpi('TRI annualisé', tri ? pctSigned(tri.taux) : '—', tri ? `depuis le ${D.fmt(tri.debut)}${tri12 ? ` · ${pctSigned(tri12.taux)} sur 12 mois` : ''}` : 'versements non renseignés ou historique insuffisant')}
      </div></section>

      ${UI.card('Gains mensuels', UI.chart('ch-gains', 240), { sub: 'Variation de valeur hors versements, 12 derniers mois', cls: choix ? 'span-12' : 'span-6' })}
      ${choix ? '' : UI.card('Encours par compte', UI.chart('ch-comptes', 240), { sub: '24 derniers mois', cls: 'span-6' })}

      ${comptesVue.map(c => cartesPositions(M, c, today, state, !!choix)).join('')}

      ${UI.repli('rendements', 'Performance mensuelle et annuelle', tableRendements(M, ids), { sub: choix ? esc(choix.nom) : groupe ? esc(groupe.label) : 'Ensemble de l’épargne et des placements', state })}

      ${UI.repli('detail-comptes', 'Détail par compte', `<div class="table-wrap"><table>
        <thead><tr><th>Compte</th><th>Type</th><th class="num">Valeur</th><th class="num">Versé</th><th class="num">Plus-value</th><th class="num">Perf. totale</th><th class="num">Perf. 12 mois</th><th class="num">TRI annuel</th><th class="num">Poids</th></tr></thead>
        <tbody>${rows}</tbody>
        <tfoot><tr><td colspan="2">Total</td><td class="num">${eur(total)}</td><td class="num">${idsV.length ? eur(vers) : '—'}</td><td class="num">${pv == null ? '—' : UI.delta(pv)}</td><td class="num">${pv != null && vers ? pctSigned(pv / vers) : '—'}</td><td class="num">${pctSigned(p12.pct)}</td><td class="num">${triCell(tri)}</td><td></td></tr></tfoot>
        </table></div>
        <p class="small muted">Performance 12 mois calculée hors versements (méthode de Dietz simplifiée). TRI : taux de rendement interne annualisé depuis le premier relevé du compte, qui tient compte de la date de chaque versement et retrait (relevés mensuels). « — » : versements non renseignés dans soldes.csv ou moins de 3 mois d’historique. PEA : versements estimés à partir du prix de revient ; fonds monétaire Revolut : historique reconstitué.</p>`,
        { sub: `${comptesVue.length} compte${comptesVue.length > 1 ? 's' : ''} · versé, plus-value, performance, TRI, poids`, state })}
    </div>`;

  return { html, after() {
    document.querySelectorAll('.onglet[data-groupe], .support[data-groupe]').forEach(b => b.addEventListener('click', () => {
      state.groupeEpargne = b.dataset.groupe; App.render({ garderScroll: b.classList.contains('onglet') });
    }));
    UI.suivreReplis(state);
    if (parts.length) Charts.donut(document.getElementById('ch-repartition'), parts.map(p => p.label), parts.map(p => p.v), parts.map(p => p.c));
    // Clic (ou Entrée) sur une ligne : affiche / masque ses opérations
    document.querySelectorAll('tr.ligne-clic').forEach(tr => {
      const basculer = () => { const d = document.getElementById(tr.dataset.detail); d.hidden = !d.hidden; tr.classList.toggle('ouvert', !d.hidden); };
      tr.addEventListener('click', basculer);
      tr.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); basculer(); } });
    });
    const m24 = F.mois(M, 24), lab24 = m24.map(m => D.monthLabel(m));
    // Comparaison valeur / versements sur les seuls comptes dont les versements sont connus,
    // à partir du premier relevé de ces comptes
    const idsC = idsV.length ? idsV : ids;
    const mC = m24.filter(m => idsC.some(id => F.snap(M, id, F.dateFin(m))));
    const cv = document.getElementById('ch-valeur');
    if (mC.length < 2) cv.parentElement.innerHTML = UI.empty('La courbe apparaîtra à partir du deuxième relevé mensuel.');
    else Charts.line(cv, mC.map(m => D.monthLabel(m)), [
      { label: 'Valeur', data: mC.map(m => idsC.reduce((s, id) => s + F.valeur(M, id, F.dateFin(m)), 0)), color: choix ? couleur(choix.type) : groupe ? couleur(groupe.type) : Charts.colors().series[0] },
      ...(idsV.length ? [{ label: 'Versements cumulés', data: mC.map(m => idsV.reduce((s, id) => s + F.versements(M, id, F.dateFin(m)), 0)), color: Charts.colors().text2, dash: [5, 4] }] : []),
    ]);
    const m12 = D.range(D.addMonths(cm, -11), cm);
    Charts.signedBars(document.getElementById('ch-gains'), m12.map(m => D.monthLabel(m)), 'Gain',
      m12.map(m => F.perf(M, ids, D.endOfMonth(D.addMonths(m, -1)), F.dateFin(m)).gain));
    if (choix) return;
    const top = comptesVue.slice(0, 7);
    const series = top.map(c => ({ label: c.nom, data: m24.map(m => F.valeur(M, c.id, F.dateFin(m))) }));
    if (comptesVue.length > 7) series.push({ label: 'Autres', data: m24.map(m => comptesVue.slice(7).reduce((s, c) => s + F.valeur(M, c.id, F.dateFin(m)), 0)) });
    Charts.line(document.getElementById('ch-comptes'), lab24, series);
  } };
}

/* ---------- Paramètres ---------- */
function pageParametres(M, state) {
  const cfg = App.getCfg();
  const warn = M?.warnings?.length ? `<div class="alert warning"><strong>${M.warnings.length} avertissement(s) au chargement :</strong><ul>${M.warnings.slice(0, 15).map(w => `<li>${esc(w)}</li>`).join('')}</ul></div>` : '';
  const err = state.error ? `<div class="alert critical"><strong>Échec du chargement :</strong> ${esc(state.error)}</div>` : '';
  const ok = M && !state.error ? `<div class="alert good">✓ Données chargées (${M.source === 'demo' ? 'mode démo' : `${esc(cfg.owner)}/${esc(cfg.repo)}`}) : ${M.comptes.length} comptes, ${M.soldes.length} soldes, ${M.transactions.length} opérations, ${M.positions.length} lignes de positions.</div>` : '';

  const html = `
    <div class="page-h"><h1>Paramètres</h1></div>
    <div class="grid">
      ${UI.card('Connexion au dépôt GitHub', `
        ${err}${ok}${warn}
        <form id="cfg-form" class="form" autocomplete="off">
          <div class="form-row">
            <label>Propriétaire<input name="owner" required value="${esc(cfg.owner || '')}" placeholder="mon-pseudo"></label>
            <label>Dépôt<input name="repo" required value="${esc(cfg.repo || '')}" placeholder="mes-finances"></label>
          </div>
          <div class="form-row">
            <label>Branche<input name="branche" value="${esc(cfg.branche || 'main')}"></label>
            <label>Dossier des données<input name="dossier" value="${esc(cfg.dossier ?? 'data')}"></label>
          </div>
          <label>Token GitHub (fine-grained, lecture seule)
            <input name="token" type="password" value="${esc(cfg.token || '')}" placeholder="github_pat_…" spellcheck="false">
          </label>
          <label class="check"><input type="checkbox" name="remember" ${cfg.remember ? 'checked' : ''}> Mémoriser le token sur cet appareil (sinon il est oublié à la fermeture de l’onglet)</label>
          <div class="btns">
            <button class="btn primary" type="submit">Enregistrer et charger</button>
            <button class="btn" type="button" id="btn-demo">Utiliser les données de démo</button>
            <button class="btn ghost" type="button" id="btn-forget">Oublier le token</button>
          </div>
        </form>`, { sub: 'Le token reste dans votre navigateur ; il n’est envoyé qu’à api.github.com.', cls: 'span-7' })}

      ${UI.card('Créer le token', `
        <ol class="steps">
          <li>GitHub → <em>Settings</em> → <em>Developer settings</em> → <em>Personal access tokens</em> → <strong>Fine-grained tokens</strong> → <em>Generate new token</em>.</li>
          <li><em>Repository access</em> : <strong>Only select repositories</strong> → votre dépôt de données (privé).</li>
          <li><em>Permissions</em> → <em>Repository permissions</em> → <strong>Contents : Read-only</strong>. Rien d’autre.</li>
          <li>Choisissez une date d’expiration, générez, puis collez le token ici.</li>
        </ol>
        <p class="small muted">Fichiers attendus dans <code>${esc(cfg.dossier ?? 'data')}/</code> : ${Object.values(FICHIERS).map(f => `<code>${f}</code>`).join(', ')}. Modèles et explications dans le README.</p>`, { cls: 'span-5' })}
    </div>`;

  return { html, after() {
    const form = document.getElementById('cfg-form');
    form.addEventListener('submit', e => {
      e.preventDefault();
      const fd = new FormData(form);
      App.saveCfg({ owner: fd.get('owner').trim(), repo: fd.get('repo').trim(), branche: fd.get('branche').trim() || 'main', dossier: fd.get('dossier').trim(), token: fd.get('token').trim(), demo: false }, !!fd.get('remember'));
      App.load('overview');
    });
    document.getElementById('btn-demo').addEventListener('click', () => { App.saveCfg({ ...App.getCfg(), demo: true }, App.getCfg().remember); App.load('overview'); });
    document.getElementById('btn-forget').addEventListener('click', () => { App.saveCfg({ ...App.getCfg(), token: '' }, false); App.render(); });
  } };
}

</script>
  <script>
'use strict';

const CFG_KEY = 'suivi-comptes.cfg';
const THEME_KEY = 'suivi-comptes.theme';
const store = {
  get(s, k) { try { return s.getItem(k); } catch { return null; } },
  set(s, k, v) { try { v == null ? s.removeItem(k) : s.setItem(k, v); } catch { /* stockage indisponible */ } },
};

const PAGES = { overview: pageOverview, depenses: pageDepenses, epargne: pageEpargne, immobilier: pageImmobilier, parametres: pageParametres };

const App = {
  M: null,
  state: { mois: null, error: null, loading: false },

  getCfg() {
    let cfg = {};
    try { cfg = JSON.parse(store.get(localStorage, CFG_KEY) || '{}'); } catch { cfg = {}; }
    if (!cfg.remember) cfg.token = store.get(sessionStorage, CFG_KEY + '.token') || '';
    return cfg;
  },
  saveCfg(cfg, remember) {
    const { token, ...rest } = cfg;
    rest.remember = remember;
    if (remember) { rest.token = token; store.set(sessionStorage, CFG_KEY + '.token', null); }
    else store.set(sessionStorage, CFG_KEY + '.token', token || null);
    store.set(localStorage, CFG_KEY, JSON.stringify(rest));
  },

  route() { const r = location.hash.slice(1); return PAGES[r] ? r : 'overview'; },

  async load(goTo) {
    const cfg = this.getCfg();
    this.state.error = null;
    if (!cfg.demo && !(cfg.owner && cfg.repo && cfg.token)) {
      this.M = null;
      if (location.hash !== '#parametres') location.hash = 'parametres'; else this.render();
      return;
    }
    this.state.loading = true; this.render();
    try {
      this.M = cfg.demo ? buildModel(DEMO.generate(), 'demo') : await loadFromGitHub(cfg);
    } catch (e) {
      this.M = null; this.state.error = e.message;
      goTo = 'parametres';
    }
    this.state.loading = false;
    if (goTo && location.hash !== '#' + goTo) location.hash = goTo; else this.render();
  },

  render({ garderScroll = false } = {}) {
    const route = this.route(), view = document.getElementById('view'), y = window.scrollY;
    document.querySelectorAll('[data-route]').forEach(a => a.setAttribute('aria-current', a.dataset.route === route ? 'page' : 'false'));
    const pill = document.getElementById('source-pill');
    pill.className = 'pill ' + (this.M ? this.M.source : 'none');
    pill.textContent = this.state.loading ? 'Chargement…' : this.M
      ? (this.M.source === 'demo' ? 'Démo' : 'GitHub · ' + this.M.chargeLe.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }))
      : 'Non connecté';

    Charts.destroyAll();
    if (this.state.loading) { view.innerHTML = '<p class="muted center pad">Chargement des données…</p>'; return; }
    if (!this.M && route !== 'parametres') {
      view.innerHTML = `<section class="card empty-state"><h2>Aucune donnée chargée</h2><p class="muted">Renseignez votre dépôt GitHub et votre token, ou essayez le mode démo.</p><a class="btn primary" href="#parametres">Ouvrir les paramètres</a></section>`;
      return;
    }
    const page = PAGES[route](this.M, this.state);
    view.innerHTML = page.html;
    if (page.after) page.after();
    window.scrollTo(0, garderScroll ? y : 0);
  },

  applyTheme(t) {
    if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
  },
  toggleTheme() {
    // Thème sombre par défaut ; le clair est un choix explicite
    const cur = document.documentElement.dataset.theme || 'dark';
    const next = cur === 'dark' ? 'light' : 'dark';
    store.set(localStorage, THEME_KEY, next);
    this.applyTheme(next);
    this.render();
  },

  init() {
    this.applyTheme(store.get(localStorage, THEME_KEY));
    window.addEventListener('hashchange', () => this.render());
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => this.render());
    document.getElementById('btn-refresh').addEventListener('click', () => this.load());
    document.getElementById('btn-theme').addEventListener('click', () => this.toggleTheme());
    this.load();
  },
};

App.init();

</script>
