          ${champ('apport', 'Apport', 'Couvre en général au moins les frais de notaire.', { pas: 1000 })}
        </div>
        <h3 class="cats-titre">L’exploitation</h3>
        <div class="form-row">
          ${champ('loyer', 'Loyer mensuel hors charges', 'Retenu à 70 % par la banque pour la capacité.')}
          ${champ('vacance', 'Vacance locative', 'Mois sans locataire par an, en moyenne.', { pas: 0.5, unite: 'mois' })}
        </div>
        <div class="form-row">
          ${champ('chargesLoc', 'Charges non récupérables par mois', 'Taxe foncière, copropriété, assurance PNO, gestion, entretien.')}
          ${champ('revalLoyer', 'Revalorisation des loyers', 'Par an (indice IRL).', { pas: 0.25, unite: '%' })}
        </div>
        <div class="form-row">
          ${champ('revalCharges', 'Hausse des charges', 'Par an.', { pas: 0.25, unite: '%' })}
          ${champ('revalBien', 'Valorisation du bien', 'Par an, pour la revente.', { pas: 0.25, unite: '%' })}
        </div>
        <div class="form-row">
          ${champ('detention', 'Durée de détention', 'Revente à la fin, capital restant dû remboursé.', { unite: 'ans' })}
        </div>
        <h3 class="cats-titre">Le crédit</h3>
        <div class="form-row">
          ${champ('taux', 'Taux du crédit', 'Environ 3,5 à 3,75 % sur 25 ans en octobre 2026.', { pas: 0.05, unite: '%' })}
          ${champ('duree', 'Durée', '25 ans au plus (règle HCSF).', { unite: 'ans' })}
        </div>
        <div class="form-row">
          ${champ('assurance', 'Assurance emprunteur', 'Taux annuel sur le capital, les deux emprunteurs.', { pas: 0.01, unite: '%' })}
        </div>
        <div class="row-between"><span class="small muted">Vos saisies restent dans ce navigateur.</span><button type="button" class="btn small ghost" id="lp-reset">Valeurs par défaut</button></div>
      </form>`, { sub: 'Modifiez les chiffres : tout se recalcule', cls: 'span-7' })}

      <div class="span-5 colonne">
        ${UI.card('Financement du projet', `<div class="table-wrap"><table><tbody id="lr-financement"></tbody></table></div>`, { sub: 'Coût total, crédit nécessaire et place dans la capacité' })}
        ${UI.card('La capacité d’emprunt', `<div class="table-wrap"><table><tbody id="lr-detail"></tbody></table></div>
          <p class="small muted">Règle HCSF : toutes les mensualités (assurance comprise) au plus 35 % des revenus nets avant impôt. Certaines banques calculent autrement pour un investissement locatif (différentiel loyer − mensualité) et regardent aussi le reste à vivre.</p>`, { sub: 'Revenus, crédits en cours, plafond de 35 %' })}
      </div>

      ${UI.card('Projection des cash-flows', `<div class="kpis" id="lr-kpis-projet"></div>
        ${UI.chart('ch-locatif', 260)}
        <p class="small muted">Cash-flow annuel avant impôt : loyers encaissés (vacance déduite) − charges − échéances du crédit, assurance comprise. La revente, en fin de détention, n’est pas dans les barres : elle compte dans le TRI et le gain total.</p>`, { sub: 'Année par année, jusqu’à la revente', cls: 'span-12' })}

      ${UI.repli('locatif-annees', 'Le détail année par année', `<div class="table-wrap"><table id="lr-annees"></table></div>`, { sub: 'Loyers, charges, crédit, cash-flow, capital restant dû, valeur du bien', state })}

      ${UI.card('Capacité selon le taux et la durée', `<div class="table-wrap"><table id="lr-sensibilite"></table></div>`, { sub: 'Mêmes revenus, même assurance', cls: 'span-12' })}
    </div>
    <p class="small muted">Simulation indicative, avant impôt : l’imposition des loyers dépend du régime (micro-foncier, réel, LMNP) et peut changer nettement le résultat. Chaque banque applique ses propres critères. Je ne suis pas conseiller financier agréé ; un courtier vous donnera une capacité ferme.</p>`;

  return { html, after() {
    UI.suivreReplis(state);
    const ids = Object.keys(hypothesesParDefaut(M));
    const nbFr = x => x.toLocaleString('fr-FR', { maximumFractionDigits: 2 });
    const lire = () => Object.fromEntries(ids.map(id => [id, parseNum(document.getElementById('lp-' + id).value) ?? 0]));
    const set = (id, txt) => { document.getElementById(id).innerHTML = txt; };
    let graphique = null;
    const calculer = () => {
      const v = lire();
      // ---- Capacité d'emprunt ----
      const parPersonne = Object.fromEntries(PERSONNES.map(p => [p.cle, revenusPersonne(v, p.cle)]));
      const revenus = parPersonne.Moi + parPersonne.Conjoint;
      PERSONNES.forEach(p => { document.getElementById('lr-rev-' + p.cle).textContent = eur(parPersonne[p.cle]); });
      const loyerRetenu = v.loyer * HCSF.loyerRetenu;
      const plafond = HCSF.endettement * (revenus + loyerRetenu);
      const mensualite = Math.max(0, plafond - chargesActuelles);
      const coef = coefMensuel(v.taux, v.duree, v.assurance);
      const capacite = mensualite / coef;
      const tauxActuel = revenus > 0 ? chargesActuelles / revenus : null;
      set('lr-capacite', eur(Math.round(capacite / 1000) * 1000));
      set('lr-mensualite', eur(mensualite));
      set('lr-revenus', eur(revenus));
      set('lr-taux-actuel', `Endettement actuel : ${pct(tauxActuel)} des revenus`);
      document.getElementById('lr-jauge-actuel').style.width = `${Math.min(1, (tauxActuel || 0) / 0.5) * 100}%`;
      document.getElementById('lr-jauge-actuel').classList.toggle('over', (tauxActuel || 0) > HCSF.endettement);
      document.getElementById('lr-jauge-max').style.left = `${HCSF.endettement / 0.5 * 100}%`;
      set('lr-alerte', !v.salConjoint ? '<span class="status warning">● Renseignez le salaire du conjoint : le crédit actuel est commun, ses revenus comptent.</span>'
        : mensualite <= 0 ? '<span class="status critical">▲ Le crédit actuel atteint déjà le plafond de 35 %.</span>' : '');
      set('lr-detail', [
        ...PERSONNES.map(p => [`${p.nom} : salaire sur ${v['mois' + p.cle] || 12} mois, ${v['part' + p.cle]} % de la moyenne des primes, autres revenus`, eur(parPersonne[p.cle])]),
        [`Loyer attendu retenu à 70 % (${eur(v.loyer)})`, eur(loyerRetenu)],
        ['<strong>Revenus retenus</strong>', `<strong>${eur(revenus + loyerRetenu)}</strong>`],
        ['Plafond de mensualités (35 %)', eur(plafond)],
        ...credits.map(c => [`− ${esc(c.nom)} (mensualité + assurance)`, eur(c.mensualite + c.assurance)]),
        ['<strong>Mensualité possible pour le nouveau crédit</strong>', `<strong>${eur(mensualite)}</strong>`],
        [`Capacité sur ${v.duree} ans à ${nbFr(v.taux)} % + assurance ${nbFr(v.assurance)} %`, `<strong>${eur(capacite)}</strong>`],
      ].map(([a, b]) => `<tr><td>${a}</td><td class="num nowrap">${b}</td></tr>`).join(''));

      // ---- Financement du projet ----
      const P = projectionLocatif(v);
      const marge = mensualite - P.mensualite, rentre = P.credit === 0 || marge >= 0;
      const apportManquant = rentre ? 0 : P.credit - capacite;
      const endettementApres = revenus + loyerRetenu > 0 ? (chargesActuelles + P.mensualite) / (revenus + loyerRetenu) : null;
      set('lr-verdict', P.credit === 0 ? '<span class="pos">financé sans crédit</span>'
        : rentre ? `<span class="pos">✓ rentre dans la capacité</span> <span class="muted">(${eur(marge)} de marge par mois)</span>`
          : `<span class="neg">▲ dépasse de ${eur(-marge)} par mois</span> <span class="muted">(≈ ${eur(Math.ceil(apportManquant / 1000) * 1000)} d’apport en plus)</span>`);
      set('lr-financement', [
        ['Prix d’achat', eur(v.prix)],
        ['+ travaux et ameublement', eur(v.travaux)],
        [`+ frais de notaire (${nbFr(v.notaire)} %)`, eur(v.prix * v.notaire / 100)],
        ['<strong>Coût total</strong>', `<strong>${eur(P.cout)}</strong>`],
        ['− apport', eur(P.fondsPropres)],
        ['<strong>Crédit nécessaire</strong>', `<strong>${eur(P.credit)}</strong>`],
        [`Mensualité sur ${v.duree} ans, assurance comprise`, eur(P.mensualite)],
        ['Mensualité possible (capacité)', eur(mensualite)],
        [rentre ? 'Marge restante' : '<span class="neg">Dépassement</span>', rentre ? eur(marge) : `<span class="neg">${eur(-marge)} / mois</span>`],
        ['Endettement après le projet', `<span class="${endettementApres > HCSF.endettement + 0.0005 ? 'neg' : ''}">${pct(endettementApres)}</span>`],
      ].map(([a, b]) => `<tr><td>${a}</td><td class="num nowrap">${b}</td></tr>`).join(''));

      // ---- Projection ----
      const a1 = P.annees[0], H = P.annees.length;
      const rdtBrut = P.cout ? v.loyer * 12 / P.cout : null;
      set('lr-tri', P.tri == null ? '—' : `<span class="${P.tri < 0 ? 'neg' : 'pos'}">${pctSigned(P.tri)}</span>`);
      set('lr-tri-sub', `sur les fonds propres, ${H} ans, avant impôt`);
      set('lr-kpis-projet', [
        UI.kpi('Rendement brut', pct(rdtBrut), 'loyers annuels / coût total'),
        UI.kpi('Cash-flow mensuel, année 1', `<span class="${a1.cashflow < 0 ? 'neg' : 'pos'}">${eurSigned(a1.cashflow / 12)}</span>`, a1.cashflow < 0 ? 'effort d’épargne à prévoir chaque mois' : 'le bien s’autofinance'),
        UI.kpi(`Cash-flow cumulé sur ${H} ans`, `<span class="${a1 && P.annees[H - 1].cumul < 0 ? 'neg' : 'pos'}">${eurSigned(P.annees[H - 1].cumul)}</span>`, 'hors revente'),
        UI.kpi(`Revente après ${H} ans`, eur(P.revente), `valeur ${eur(P.annees[H - 1].valeur)} − capital restant dû ${eur(P.annees[H - 1].crd)}`),
        UI.kpi('Gain total', `<span class="${P.gainTotal < 0 ? 'neg' : 'pos'}">${eurSigned(P.gainTotal)}</span>`, `pour ${eur(P.fondsPropres)} d’apport · TRI ${pctSigned(P.tri)}`),
      ].join(''));
      set('lr-annees', `<thead><tr><th>Année</th><th class="num">Loyers encaissés</th><th class="num">Charges</th><th class="num">Échéances</th><th class="num">dont intérêts</th><th class="num">Cash-flow</th><th class="num">Cumul</th><th class="num">Capital restant dû</th><th class="num">Valeur du bien</th></tr></thead>
        <tbody>${P.annees.map(x => `<tr><td>${x.a}</td><td class="num">${eur(x.loyers)}</td><td class="num">${eur(x.charges)}</td><td class="num">${eur(x.credits)}</td><td class="num muted">${eur(x.interets)}</td>
          <td class="num ${x.cashflow < 0 ? 'neg' : 'pos'}">${eurSigned(x.cashflow)}</td><td class="num">${eurSigned(x.cumul)}</td><td class="num">${eur(x.crd)}</td><td class="num">${eur(x.valeur)}</td></tr>`).join('')}</tbody>`);
      if (graphique) { graphique.destroy(); Charts.list = Charts.list.filter(c => c !== graphique); }
      graphique = Charts.signedBars(document.getElementById('ch-locatif'), P.annees.map(x => `an ${x.a}`), 'Cash-flow', P.annees.map(x => Math.round(x.cashflow)),
        { tooltip: { label: ctx => ` Cash-flow : ${eurSigned(ctx.parsed.y)} · cumul ${eurSigned(P.annees[ctx.dataIndex].cumul)}` } });

      // ---- Sensibilité de la capacité ----
      const taux = [3.25, 3.5, 3.75, 4], durees = [15, 20, 25];
      set('lr-sensibilite', `<thead><tr><th>Durée</th>${taux.map(t => `<th class="num">${nbFr(t)} %</th>`).join('')}</tr></thead><tbody>${durees.map(d => `<tr><th scope="row">${d} ans</th>${taux.map(t => `<td class="num ${t === v.taux && d === v.duree ? 'strong-cell' : ''}">${eur(Math.round(mensualite / coefMensuel(t, d, v.assurance) / 1000) * 1000)}</td>`).join('')}</tr>`).join('')}</tbody>`);
    };
    document.getElementById('form-locatif').addEventListener('input', () => {
      store.set(localStorage, LOCATIF_KEY, JSON.stringify(Object.fromEntries(ids.map(id => [id, document.getElementById('lp-' + id).value]))));
      calculer();
    });
    document.getElementById('lp-reset').addEventListener('click', () => {
      if (!confirm('Revenir aux valeurs par défaut ? Le salaire du conjoint saisi sera effacé.')) return;
      store.set(localStorage, LOCATIF_KEY, null); App.render({ garderScroll: true });
    });
    calculer();
  } };
}

</script>
  <script>
'use strict';

const CFG_KEY = 'suivi-comptes.cfg';
const THEME_KEY = 'suivi-comptes.theme';
const store = {
  get(s, k) { try { return s.getItem(k); } catch { return null; } },
  set(s, k, v) { try { v == null ? s.removeItem(k) : s.setItem(k, v); } catch { /* stockage indisponible */ } },
};

const PAGES = { overview: pageOverview, recommandations: pageRecommandations, depenses: pageDepenses, epargne: pageEpargne, immobilier: pageImmobilier, previsionnel: pagePrevisionnel, locatif: pageLocatif, parametres: pageParametres };

const App = {
  M: null,
  state: { mois: null, error: null, loading: false },

  getCfg() {
    let cfg = {};
    try { cfg = JSON.parse(store.get(localStorage, CFG_KEY) || '{}'); } catch { cfg = {}; }
    if (!cfg.remember) cfg.token = store.get(sessionStorage, CFG_KEY + '.token') || '';
    return cfg;
  },
  saveCfg(cfg, remember) {
    const { token, ...rest } = cfg;
    rest.remember = remember;
    if (remember) { rest.token = token; store.set(sessionStorage, CFG_KEY + '.token', null); }
    else store.set(sessionStorage, CFG_KEY + '.token', token || null);
    store.set(localStorage, CFG_KEY, JSON.stringify(rest));
  },

  route() { const r = location.hash.slice(1); return PAGES[r] ? r : 'overview'; },

  async load(goTo) {
    const cfg = this.getCfg();
    this.state.error = null;
    if (!cfg.demo && !(cfg.owner && cfg.repo && cfg.token)) {
      this.M = null;
      if (location.hash !== '#parametres') location.hash = 'parametres'; else this.render();
      return;
    }
    this.state.loading = true; this.render();
    try {
      this.M = cfg.demo ? buildModel(DEMO.generate(), 'demo') : await loadFromGitHub(cfg);
    } catch (e) {
      this.M = null; this.state.error = e.message;
      goTo = 'parametres';
    }
    this.state.loading = false;
    if (goTo && location.hash !== '#' + goTo) location.hash = goTo; else this.render();
  },

  render({ garderScroll = false } = {}) {
    const route = this.route(), view = document.getElementById('view'), y = window.scrollY;
    document.querySelectorAll('[data-route]').forEach(a => a.setAttribute('aria-current', a.dataset.route === route ? 'page' : 'false'));
    const pill = document.getElementById('source-pill');
    pill.className = 'pill ' + (this.M ? this.M.source : 'none');
    pill.textContent = this.state.loading ? 'Chargement…' : this.M
      ? (this.M.source === 'demo' ? 'Démo' : 'GitHub · ' + this.M.chargeLe.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }))
      : 'Non connecté';

    Charts.destroyAll();
    if (this.state.loading) { view.innerHTML = '<p class="muted center pad">Chargement des données…</p>'; return; }
    if (!this.M && route !== 'parametres') {
      view.innerHTML = `<section class="card empty-state"><h2>Aucune donnée chargée</h2><p class="muted">Renseignez votre dépôt GitHub et votre token, ou essayez le mode démo.</p><a class="btn primary" href="#parametres">Ouvrir les paramètres</a></section>`;
      return;
    }
    const page = PAGES[route](this.M, this.state);
    view.innerHTML = page.html;
    if (page.after) page.after();
    window.scrollTo(0, garderScroll ? y : 0);
  },

  applyTheme(t) {
    if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
  },
  toggleTheme() {
    // Thème sombre par défaut ; le clair est un choix explicite
    const cur = document.documentElement.dataset.theme || 'dark';
    const next = cur === 'dark' ? 'light' : 'dark';
    store.set(localStorage, THEME_KEY, next);
    this.applyTheme(next);
    this.render();
  },

  init() {
    this.applyTheme(store.get(localStorage, THEME_KEY));
    window.addEventListener('hashchange', () => this.render());
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => this.render());
    document.getElementById('btn-refresh').addEventListener('click', () => this.load());
    document.getElementById('btn-theme').addEventListener('click', () => this.toggleTheme());
    this.load();
  },
};

App.init();

</script>
