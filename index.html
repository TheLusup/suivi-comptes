  const debutAnnee = F.patrimoine(M, (Number(cm.slice(0, 4)) - 1) + '-12-31');
  const ilYaUnAn = F.patrimoine(M, D.endOfMonth(D.addMonths(cm, -12)));

  // Budget du mois : vue consolidée (virements internes neutralisés, comptes partagés à votre part)
  const V = vueDepenses(M, '');
  const dep = F.depenses(V, cm), bud = F.budgetTotal(V, cm), rev = F.revenus(V, cm);
  const prevMk = D.addMonths(cm, -1), revPrev = F.pnl(V, prevMk).revenus;

      <td class="num ${age > 40 ? 'stale' : 'muted'}">${maj ? D.fmt(maj) : '—'}${age > 40 ? ' <span title="Solde non mis à jour depuis plus de 40 jours">⚠</span>' : ''}</td>
    </tr>`;
  }).join('');

  const html = `
    <div class="page-h"><h1>Vue d'ensemble</h1><p class="muted">Situation au ${D.fmt(today)}</p></div>
    <div class="grid">
      <section class="card hero span-12">
        <div class="hero-main">
          <div class="kpi-label">Patrimoine net</div>
          <div class="hero-value">${eur(now.net)}</div>
          <div class="hero-deltas">
            <div>${UI.delta(now.net - finMoisDernier.net, finMoisDernier.net)} <span class="muted">depuis fin ${D.monthLabel(prevMk, true)}</span></div>
            <div>${UI.delta(now.net - debutAnnee.net, debutAnnee.net)} <span class="muted">depuis le 1er janvier</span></div>
            <div>${UI.delta(now.net - ilYaUnAn.net, ilYaUnAn.net)} <span class="muted">sur 12 mois</span></div>
          </div>
        </div>
        <div class="kpis">${tiles}</div>
      </section>

      ${UI.card('Évolution du patrimoine', UI.chart('ch-patrimoine', 300), { sub: '24 derniers mois, par grande classe d’actifs', cls: 'span-8' })}

      ${UI.card(`${D.monthLabel(cm, true).replace(/^./, c => c.toUpperCase())}`, `
        <div class="budget-sum">
          <div class="row-between"><span>Dépenses</span><strong>${eur(dep.total)} <span class="muted">/ ${eur(bud)}</span></strong></div>
          <div class="track big"><div class="fill ${ratio > 1 ? 'over' : ''}" style="width:${Math.min(ratio, 1) * 100}%"></div><div class="pace" style="left:${pace * 100}%" title="Avancement du mois"></div></div>
          <div class="row-between small muted"><span>${pct(ratio)} du budget consommé</span><span>${pct(pace)} du mois écoulé</span></div>
        </div>
        <dl class="facts">
          <div><dt>Revenus du mois</dt><dd>${rev ? eur(rev) : `<span class="muted">pas encore reçus (${D.monthLabel(prevMk)} : ${eur(revPrev)})</span>`}</dd></div>
          <div><dt>Reste à dépenser</dt><dd>${bud - dep.total >= 0 ? eur(bud - dep.total) : `<span class="neg">${eur(bud - dep.total)}</span>`}</dd></div>
          <div><dt>Taux d’épargne (${D.monthLabel(prevMk)})</dt><dd>${pct(tauxEpargne)}</dd></div>
        </dl>
        ${depasse.length ? `<p class="small"><span class="status critical">▲ Dépassé</span> ${depasse.map(r => esc(r.label)).join(', ')}</p>` : '<p class="small"><span class="status good">✓ OK</span> Aucune catégorie en dépassement</p>'}
        <a class="link" href="#depenses">Détail des dépenses →</a>`, { sub: 'Mois en cours', cls: 'span-4' })}

      ${UI.card('Points d’attention', `<ul class="attentions">${pointsAttention(M, V) || '<li class="muted">Rien à signaler.</li>'}</ul>
        <p class="small muted">Constats calculés à partir de vos données, pas des conseils financiers.</p>`, { sub: 'Mis à jour à chaque chargement', cls: 'span-12' })}

      ${UI.card('Comptes', `<div class="table-wrap"><table>
        <thead><tr><th>Compte</th><th>Type</th><th class="num">Solde</th><th class="num">Mise à jour</th></tr></thead>
        <tbody>${comptesRows}</tbody>
        <tfoot><tr><td colspan="2">Total</td><td class="num">${eur(now.net, true)}</td><td></td></tr></tfoot></table></div>`, { cls: 'span-7' })}

      ${UI.card('Mes abonnements', carteAbonnements(M), { sub: 'Prélèvements récurrents et prochaine échéance', cls: 'span-5' })}
    </div>`;

  return { html, after() {
    const months = F.mois(M, 24);
    const P = months.map(mk => F.patrimoine(M, F.dateFin(mk)));
    const keys = ['liquidites', 'epargne', 'placements', 'autre'].filter(k => P.some(p => p.par[k] !== 0));
    const series = keys.map(k => ({ label: CLASSES[k], data: P.map(p => p.par[k]) }));
    // Immobilier net du crédit (votre quote-part), pour garder un empilement positif
    if (P.some(p => p.immoNet !== 0)) series.push({ label: 'Immobilier (net du crédit)', data: P.map(p => p.immoNet) });
    Charts.line(document.getElementById('ch-patrimoine'), months.map(m => D.monthLabel(m)), series, { stacked: true, area: true });
  } };
}

/* ---------- Dépenses ---------- */
/* Vue de la page Dépenses : une banque (ses comptes, virements vers vos autres comptes compris, sans budget),
   ou tous les comptes, où les virements entre vos comptes sont neutralisés (retirés des deux côtés) et où
   un compte partagé (quotePart < 1, ex. compte joint) ne compte que pour votre part : ses opérations sont
   réduites à cette part, et les apports du co-titulaire (« Participation conjoint »), qui financent la sienne,
   sont retirés. */
const INTERNE = 'Virement interne', APPORT_COTITULAIRE = 'Participation conjoint';
function opsVotrePart(M) {
  const parts = new Map(M.comptes.filter(c => c.quotePart < 1).map(c => [c.id, c.quotePart]));
  return M.transactions.flatMap(t => {
    const q = parts.get(t.compte);
    if (q == null) return [t];
    if (normKey(t.categorie) === normKey(APPORT_COTITULAIRE)) return [];
    // Copie à votre part ; l'id et la catégorie d'origine restent ceux de l'opération (corrections de catégorie)
    return [Object.assign(Object.create(t), { montant: Math.round(t.montant * q * 100) / 100, part: q })];
  });
}
// Comptes qui ont des opérations (comptes courants), et leurs banques
function comptesAvecOps(M, banque) {
  const avecOps = new Set(M.transactions.map(t => t.compte));
  return M.comptes.filter(c => avecOps.has(c.id) && (banque == null || c.onglet === banque));
}
const banquesDepenses = M => [...new Set(comptesAvecOps(M).map(c => c.onglet))];
function vueDepenses(M, banque) {
  const interne = t => normKey(t.categorie) === normKey(INTERNE);
  if (!banque) {
    const V = { ...M, transactions: opsVotrePart(M).filter(t => !interne(t)), internes: M.transactions.filter(interne) };
    delete V._pnlPlan;
    return V;
  }
  const ids = new Set(comptesAvecOps(M, banque).map(c => c.id));
  const transactions = M.transactions.filter(t => ids.has(t.compte));
  const V = { ...M, transactions, internes: transactions.filter(interne), banque, idsBanque: [...ids],
    // Les apports du co-titulaire sont une entrée d'argent du compte, pas une baisse de ses dépenses
    budget: { ...M.budget, mensuel: {}, exceptions: {}, exclues: [...M.budget.exclues, normKey(APPORT_COTITULAIRE)] } };
  delete V._pnlPlan;
  return V;
}

// Couleur stable de chaque catégorie, d'après son rang dans les dépenses des 12 derniers mois de la vue
function couleursCategories(M, cm) {
  const tot = new Map();
  D.range(D.addMonths(cm, -11), cm).forEach(m => F.depenses(M, m).parCat.forEach((v, k) => tot.set(k, (tot.get(k) || 0) + v.montant)));
  const c = Charts.colors(), rang = [...tot].sort((a, b) => b[1] - a[1]).map(([k]) => k);
  return k => { const i = rang.indexOf(k); return i < 0 ? c.muted : c.series[i % c.series.length]; };
}

function pageDepenses(Mtout, state) {
  const banques = banquesDepenses(Mtout);
  const banque = banques.includes(state.banque) ? state.banque : '';
  const M = vueDepenses(Mtout, banque), parBanque = !!banque;
  const cm = F.moisCourant(), today = D.today();
  const allMonths = F.mois(M).reverse();
  const mk = allMonths.includes(state.mois) ? state.mois : cm;
  const isCurrent = mk === cm;
  const pace = isCurrent ? Number(today.slice(8, 10)) / D.daysInMonth(mk) : 1;
  const couleur = couleursCategories(M, cm);
  const palette = Charts.colors().series;

  // ---- Chiffres du mois ----
  const dep = F.depenses(M, mk), bud = F.budgetTotal(M, mk), rows = F.lignesBudget(M, mk);
  const moy3 = k => [1, 2, 3].reduce((a, i) => a + (F.depenses(M, D.addMonths(mk, -i)).parCat.get(k)?.montant || 0), 0) / 3;
  const dep3 = [1, 2, 3].reduce((a, i) => a + F.depenses(M, D.addMonths(mk, -i)).total, 0) / 3;
  // Projection : pour chaque catégorie, le plus élevé entre le déjà-dépensé et la moyenne des 3 mois précédents
  // (les charges fixes déjà payées en début de mois ne sont pas extrapolées)
  const projection = isCurrent ? rows.reduce((s, r) => s + Math.max(r.spent, moy3(r.key)), 0) : null;
  const P = F.pnl(M, mk), verse = F.versementsEpargne(M, mk);
  const ratioBudget = bud > 0 ? dep.total / bud : 0;
  const internesMois = M.internes.filter(t => D.monthKey(t.date) === mk);
  const recuInterne = internesMois.filter(t => t.montant > 0).reduce((s, t) => s + t.montant, 0);
  const envoyeInterne = -internesMois.filter(t => t.montant < 0).reduce((s, t) => s + t.montant, 0);
  const soldeBanque = parBanque ? M.idsBanque.reduce((s, id) => s + F.valeur(M, id, F.dateFin(mk)), 0) : 0;
  const nomsComptes = b => comptesAvecOps(Mtout, b).map(c => c.nom).join(', ');
  const nomCompte = new Map(Mtout.comptes.map(c => [c.id, c.onglet || c.nom]));

  // ---- Onglets par banque (une couleur par banque) ----
  const coulBanque = b => b ? palette[(banques.indexOf(b) + 2) % palette.length] : 'var(--accent)';
  const onglets = banques.length > 1 ? `<nav class="onglets" aria-label="Comptes">
    ${['', ...banques].map(b => `<button type="button" class="onglet" data-banque="${esc(b)}" aria-pressed="${b === banque}" ${b ? `style="--c:${coulBanque(b)}"` : ''} title="${b ? esc(nomsComptes(b)) : 'Virements entre vos comptes neutralisés, compte joint à votre part'}">${b ? esc(b) : 'Tous les comptes'}</button>`).join('')}
  </nav>` : '';

  // ---- Répartition du mois (anneau) : 6 premières catégories, puis « autres » ----
  let parts = [...dep.parCat].filter(([, v]) => v.montant > 0.5).map(([k, v]) => ({ key: k, label: v.label, v: v.montant, c: couleur(k) })).sort((a, b) => b.v - a.v);
  if (parts.length > 7) parts = [...parts.slice(0, 6), { label: `${parts.length - 6} autres`, v: parts.slice(6).reduce((s, p) => s + p.v, 0), c: Charts.colors().muted }];
  const totalParts = parts.reduce((s, p) => s + p.v, 0);
  const legende = parts.map(p => `<li><span class="pastille" style="background:${p.c}"></span>${esc(p.label)}<span class="val">${eur(p.v)} · ${pct(totalParts ? p.v / totalParts : null)}</span></li>`).join('');

  // ---- Bandeau principal ----
  const jauge = parBanque ? '' : `
    <div class="jauge-budget">
      <div class="track big"><div class="fill ${ratioBudget > 1 ? 'over' : ''}" style="width:${Math.min(ratioBudget, 1) * 100}%"></div>${isCurrent ? `<div class="pace" style="left:${pace * 100}%" title="Avancement du mois"></div>` : ''}</div>
      <div class="row-between small muted"><span>${pct(ratioBudget)} du budget de ${eur(bud)}</span><span>${bud - dep.total >= 0 ? `reste ${eur(bud - dep.total)}` : `<span class="neg">dépassement de ${eur(dep.total - bud)}</span>`}</span></div>
    </div>`;
  const deltas = parBanque
    ? `<div>${UI.delta(dep.total - dep3, dep3, { invert: true })} <span class="muted">vs moyenne des 3 mois précédents</span></div>
       <div class="muted">${esc(nomsComptes(banque))} · solde ${isCurrent ? 'actuel' : 'fin de mois'} <strong>${eur(soldeBanque)}</strong></div>`
    : `<div>${UI.delta(dep.total - dep3, dep3, { invert: true })} <span class="muted">vs moyenne des 3 mois précédents</span></div>
       ${isCurrent ? `<div><span class="muted">Projection fin de mois</span> <strong>${eur(projection)}</strong> ${UI.delta(projection - bud, null, { invert: true, suffix: 'vs budget' })}</div>` : ''}`;
  const mini = parBanque ? `
      ${UI.kpi('Revenus', eur(P.revenus), 'salaire et autres revenus')}
      ${UI.kpi('Reçu de vos comptes', eur(recuInterne), 'virements depuis vos autres comptes')}
      ${UI.kpi('Envoyé vers vos comptes', eur(envoyeInterne), 'virements vers vos autres comptes')}` : `
      ${UI.kpi('Revenus', eur(P.revenus), isCurrent && !P.revenus ? 'pas encore reçus ce mois-ci' : 'salaire et autres revenus')}
      ${UI.kpi('Capacité d’épargne', `<span class="${P.resultat < 0 ? 'neg' : 'pos'}">${eurSigned(P.resultat)}</span>`, `revenus − dépenses · taux ${pct(P.taux)}`)}
      ${UI.kpi('Versé sur l’épargne', eur(verse), 'net, capital du crédit compris')}`;
  const noteInterne = !parBanque && internesMois.length ? `<p class="small muted">${internesMois.length} virements entre vos comptes neutralisés ce mois-ci (${eur(envoyeInterne)} envoyés, ${eur(recuInterne)} reçus).</p>` : '';

  // ---- Tuiles par catégorie ----
  const sel = state.catOuverte || null;
  const maxSpent = Math.max(...rows.map(r => r.spent), 1);
  const tuiles = rows.filter(r => Math.abs(r.spent) >= 0.5 || r.budget > 0).sort((a, b) => b.spent - a.spent || b.budget - a.budget).map(r => {
    const ratio = r.budget > 0 ? r.spent / r.budget : r.spent / maxSpent, m3 = moy3(r.key);
    const w = Math.max(0, Math.min(ratio, 1)) * 100, over = r.budget > 0 && r.spent > r.budget;
    return `<button type="button" class="cat-tuile ${sel === r.key ? 'sel' : ''} ${Math.abs(r.spent) < 0.5 ? 'vide' : ''}" data-cat="${esc(r.key)}" style="--c:${couleur(r.key)}" aria-pressed="${sel === r.key}">
      <span class="nom"><span class="pastille"></span>${esc(r.label)}</span>
      <span class="montant ${r.spent < 0 ? 'pos' : ''}">${eur(r.spent)}</span>
      <span class="jauge"><span class="${over ? 'over' : ''}" style="width:${w}%"></span>${isCurrent && r.budget > 0 ? `<i style="left:${pace * 100}%"></i>` : ''}</span>
      <span class="detail">${r.budget > 0 ? `budget ${eur(r.budget)}${over ? ' · <b class="neg">dépassé</b>' : ''}` : parBanque ? `${pct(dep.total ? r.spent / dep.total : null)} du mois` : 'hors budget'} · moy. 3 mois ${eur(m3)}</span>
    </button>`;
  }).join('');

  // Mouvements hors dépenses : revenus, épargne, virements, capital du crédit
  const opsMois = M.transactions.filter(t => D.monthKey(t.date) === mk);
  const clesDep = new Set(rows.map(r => r.key)), autres = new Map();
  opsMois.forEach(t => {
    const k = normKey(t.categorie);
    if (clesDep.has(k)) return;
    const a = autres.get(k) || { key: k, label: t.categorie, net: 0, n: 0 };
    a.net += t.montant; a.n++; autres.set(k, a);
  });
  const tuilesHors = [...autres.values()].sort((a, b) => b.net - a.net).map(a => `
    <button type="button" class="cat-tuile hors ${sel === a.key ? 'sel' : ''}" data-cat="${esc(a.key)}" aria-pressed="${sel === a.key}">
      <span class="nom">${esc(a.label)}</span>
      <span class="montant ${a.net > 0 ? 'pos' : ''}">${eurSigned(a.net)}</span>
      <span class="detail">${a.n} opération${a.n > 1 ? 's' : ''}</span>
    </button>`).join('');

  // ---- Opérations (filtrées par la catégorie choisie) et changement de catégorie ----
  const toutesCats = F.categories(Mtout);
  const optionsCat = c => toutesCats.map(x => `<option ${x === c ? 'selected' : ''}>${esc(x)}</option>`).join('') + '<option value="__nouvelle">+ Nouvelle catégorie…</option>';
  const liste = (sel ? opsMois.filter(t => normKey(t.categorie) === sel) : opsMois).sort((a, b) => b.date.localeCompare(a.date) || a.montant - b.montant);
  const labelSel = sel ? (rows.find(r => r.key === sel)?.label || autres.get(sel)?.label || sel) : null;
  const lignesOps = liste.map(t => `
    <tr><td class="muted nowrap">${D.fmt(t.date)}</td>
      <td><span class="pastille" style="background:${couleur(normKey(t.categorie))}"></span> ${esc(t.libelle)}${t.categorie !== t.categorieOrigine ? ` <span class="tag" title="Catégorie d’origine : ${esc(t.categorieOrigine)}">corrigé</span>` : ''}${t.part ? ` <span class="tag" title="Compte partagé : montant total ${eur(t.montant / t.part, true)}">votre part ${pct(t.part)}</span>` : ''}
        ${parBanque && M.idsBanque.length < 2 ? '' : `<div class="muted small">${esc(nomCompte.get(t.compte) || t.compte)}</div>`}</td>
      <td class="num nowrap ${t.montant > 0 ? 'pos' : ''}">${eurSigned(t.montant, true)}</td>
      <td><label class="select small-select"><span class="sr">Catégorie</span><select class="sel-cat" data-id="${esc(t.id)}">${optionsCat(t.categorie)}</select></label></td></tr>`).join('');
  const nbLoc = Corrections.nbLocales();
  const barreCorr = `<div class="corr-bar">
    <label class="check"><input type="checkbox" id="chk-libelle" ${state.toutLibelle !== false ? 'checked' : ''}> Appliquer un changement de catégorie à toutes les opérations du même libellé</label>
    ${nbLoc ? `<span class="corr-status"><span class="status warning">● ${nbLoc} correction${nbLoc > 1 ? 's' : ''} gardée${nbLoc > 1 ? 's' : ''} dans ce navigateur</span>
      ${Mtout.source === 'github' ? '<button class="btn small primary" id="btn-corr-save">Enregistrer sur GitHub</button>' : ''}
      <button class="btn small" id="btn-corr-dl">Télécharger categories.json</button>
      <button class="btn small ghost" id="btn-corr-reset">Annuler</button></span>` : ''}
    ${state.corrMsg ? `<span class="small ${state.corrMsg.ok ? 'pos' : 'neg'}">${esc(state.corrMsg.texte)}</span>` : ''}
  </div>`;

  // ---- Historique 6 mois par catégorie ----
  const hist = D.range(D.addMonths(mk, -5), mk);
  const histData = hist.map(m => new Map(F.lignesBudget(M, m).map(r => [r.key, r])));
  const cats = new Map(); histData.forEach(h => h.forEach((r, k) => { if (!cats.has(k)) cats.set(k, r.label); }));
  const histRows = [...cats].map(([k, label]) => `<tr><th scope="row"><span class="pastille" style="background:${couleur(k)}"></span> ${esc(label)}</th>${histData.map(h => {
    const r = h.get(k);
    if (!r || (!r.spent && !r.budget)) return '<td class="num muted">—</td>';
    const over = r.budget > 0 && r.spent > r.budget;
    return `<td class="num ${over ? 'over-cell' : ''}" title="Budget : ${r.budget ? eur(r.budget) : 'aucun'}">${over ? '<span class="ico">▲</span> ' : ''}${eur(r.spent)}</td>`;
  }).join('')}</tr>`).join('');
  const histTotals = hist.map(m => {
    const t = F.depenses(M, m).total, b = F.budgetTotal(M, m);
    return parBanque ? `<td class="num">${eur(t)}</td>` : `<td class="num ${t > b ? 'over-cell' : ''}">${eur(t)}<div class="muted small">/ ${eur(b)}</div></td>`;
  }).join('');

  const options = allMonths.map(m => `<option value="${m}" ${m === mk ? 'selected' : ''}>${D.monthLabel(m, true)}${m === cm ? ' (en cours)' : ''}</option>`).join('');
  const coulVue = parBanque ? coulBanque(banque) : 'var(--series-2)';
  const html = `
    <div class="page-h">
      <h1>Dépenses</h1>
      <label class="select"><span class="sr">Mois</span><select id="sel-mois">${options}</select></label>
    </div>
    ${onglets}
    <div class="grid">
      <section class="card epargne-hero span-12" style="--hero-tint: color-mix(in srgb, ${coulVue} 22%, transparent)">

          <div class="kpi-label">Dépensé · ${D.monthLabel(mk, true)}${parBanque ? ` · ${esc(banque)}` : ''}${isCurrent ? ` · au ${D.fmt(today)}` : ''}</div>
          <div class="hero-value">${eur(dep.total)}</div>
          ${jauge}
          <div class="hero-deltas">${deltas}</div>
          <div class="kpis hero-kpis">${mini}</div>
          ${UI.chart('ch-mois', 190)}
          <p class="small muted">Dépenses des 12 derniers mois${parBanque ? '' : ' (barres) et budget (pointillés)'} ; le mois choisi en plein.</p>
          ${noteInterne}
        </div>
        <div class="donut-wrap">
          ${parts.length ? UI.chart('ch-repartition', 200) : ''}
          <div class="small muted">${parts.length ? 'Répartition du mois par catégorie' : 'Aucune dépense ce mois-ci'}</div>
          <ul class="legende">${legende}</ul>
        </div>
      </section>

      <section class="span-12">
        <div class="titre-section"><h2>Catégories</h2><span class="muted small">Cliquez sur une catégorie pour voir ses opérations et en changer la catégorie</span></div>
        <div class="cat-tuiles">${tuiles || UI.empty('Aucune dépense pour ce mois.')}</div>
        ${tuilesHors ? `<div class="titre-section sous"><h3>Hors dépenses</h3><span class="muted small">revenus, épargne, virements, capital du crédit</span></div><div class="cat-tuiles petites">${tuilesHors}</div>` : ''}
      </section>

      ${UI.card(sel ? `Opérations · ${esc(labelSel)}` : 'Toutes les opérations du mois', `${barreCorr}
        ${liste.length ? `<div class="table-wrap ops-wrap"><table class="ops-cat"><tbody>${lignesOps}</tbody></table></div>` : UI.empty('Aucune opération.')}`,
        { sub: `${D.monthLabel(mk, true)} · ${liste.length} opération${liste.length > 1 ? 's' : ''}${sel ? ` · ${eurSigned(liste.reduce((s, t) => s + t.montant, 0))}` : ''}`, cls: 'span-12', actions: sel ? '<button type="button" class="btn small" id="btn-toutes">Toutes les catégories</button>' : '' })}

      ${UI.card('Dépenses par catégorie', UI.chart('ch-cats', 280), { sub: '12 derniers mois, 6 premières catégories et les autres', cls: parBanque ? 'span-12' : 'span-8' })}
      ${parBanque ? '' : UI.card('Capacité d’épargne', UI.chart('ch-epargne', 280), { sub: 'Revenus − dépenses, 12 derniers mois (taux au survol)', cls: 'span-4' })}

      ${UI.repli('historique', 'Historique par catégorie', `<div class="table-wrap"><table class="hist">
        <thead><tr><th>Catégorie</th>${hist.map(m => `<th class="num">${D.monthLabel(m)}</th>`).join('')}</tr></thead>
        <tbody>${histRows}</tbody>
        <tfoot><tr><th scope="row">Total</th>${histTotals}</tr></tfoot></table></div>
        ${parBanque ? '' : '<p class="small muted"><span class="status critical">▲</span> montant supérieur au budget de la catégorie</p>'}`, { sub: '6 mois jusqu’au mois choisi', state })}
    </div>`;

  return { html, after() {
    document.getElementById('sel-mois').addEventListener('change', e => { state.mois = e.target.value; App.render({ garderScroll: true }); });
    document.getElementById('chk-libelle').addEventListener('change', e => { state.toutLibelle = e.target.checked; });
    document.querySelectorAll('.onglet[data-banque]').forEach(b => b.addEventListener('click', () => {
      state.banque = b.dataset.banque; state.catOuverte = null; App.render({ garderScroll: true });
    }));
    // Tuile : filtre les opérations sur sa catégorie (un second clic retire le filtre)
    document.querySelectorAll('.cat-tuile').forEach(b => b.addEventListener('click', () => {
      state.catOuverte = state.catOuverte === b.dataset.cat ? null : b.dataset.cat; App.render({ garderScroll: true });
      if (state.catOuverte) document.querySelector('.corr-bar')?.closest('.card')?.scrollIntoView({ block: 'start', behavior: 'smooth' });
    }));
    document.getElementById('btn-toutes')?.addEventListener('click', () => { state.catOuverte = null; App.render({ garderScroll: true }); });
    UI.suivreReplis(state);

    // Changement de catégorie
    const parId = new Map(Mtout.transactions.map(t => [t.id, t]));
    document.querySelectorAll('.sel-cat').forEach(s => s.addEventListener('change', () => {
      const t = parId.get(s.dataset.id);
      let cat = s.value;
      if (cat === '__nouvelle') {
        cat = (prompt('Nom de la nouvelle catégorie :') || '').trim();
        if (!cat) { s.value = t.categorie; return; }
      }
      Corrections.changer(Mtout, t, cat, state.toutLibelle !== false);
      state.corrMsg = null;
      App.render({ garderScroll: true });
    }));
    // Enregistrement des corrections
    const save = document.getElementById('btn-corr-save');
    if (save) save.addEventListener('click', async () => {
      save.disabled = true; save.textContent = 'Enregistrement…';
      try {
        const texte = Corrections.texte(Mtout);
        await ghPut(App.getCfg(), 'categories.json', texte, 'Corrections de catégories');
        Mtout.correctionsDepot = JSON.parse(texte);
        Corrections.effacerLocales();
        state.corrMsg = { ok: true, texte: '✓ Corrections enregistrées dans categories.json.' };
      } catch (e) {
        state.corrMsg = { ok: false, texte: 'Enregistrement impossible : ' + e.message + '. Les corrections restent dans ce navigateur ; vous pouvez aussi télécharger categories.json.' };
      }
      App.render({ garderScroll: true });
    });
    document.getElementById('btn-corr-dl')?.addEventListener('click', () => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([Corrections.texte(Mtout)], { type: 'application/json' }));
      a.download = 'categories.json'; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    });
    document.getElementById('btn-corr-reset')?.addEventListener('click', () => {
      if (!confirm('Annuler les corrections non enregistrées ?')) return;
      Corrections.effacerLocales(); Corrections.appliquer(Mtout); state.corrMsg = null;
      App.render({ garderScroll: true });
    });

    // Graphiques
    if (parts.length) Charts.donut(document.getElementById('ch-repartition'), parts.map(p => p.label), parts.map(p => p.v), parts.map(p => p.c));
    const months = D.range(D.addMonths(mk, -11), mk), labels = months.map(m => D.monthLabel(m));
    const depM = months.map(m => F.depenses(M, m));
    Charts.barsWithLine(document.getElementById('ch-mois'), labels, { label: 'Dépenses', data: depM.map(d => d.total) },
      parBanque ? null : { label: 'Budget', data: months.map(m => F.budgetTotal(M, m)) }, { highlightLast: isCurrent });
    const totCat = new Map();
    depM.forEach(d => d.parCat.forEach((v, k) => totCat.set(k, { label: v.label, t: (totCat.get(k)?.t || 0) + v.montant })));
    const top = [...totCat].sort((a, b) => b[1].t - a[1].t).slice(0, 6);
    const series = top.map(([k, v]) => ({ label: v.label, color: couleur(k), data: depM.map(d => Math.max(0, d.parCat.get(k)?.montant || 0)) }));
    series.push({ label: 'Autres', color: Charts.colors().muted, data: depM.map((d, i) => Math.max(0, d.total - series.reduce((s, x) => s + x.data[i], 0))) });
    Charts.stackedBars(document.getElementById('ch-cats'), labels, series, { highlight: months.length - 1 });
    if (!parBanque) {
      const pM = months.map(m => F.pnl(M, m)), revM = pM.map(p => p.revenus), epM = pM.map(p => p.resultat);
      Charts.signedBars(document.getElementById('ch-epargne'), labels, 'Épargne', epM,
        { tooltip: { label: ctx => ` Épargne : ${eurSigned(ctx.parsed.y)} · taux ${pct(revM[ctx.dataIndex] > 0 ? epM[ctx.dataIndex] / revM[ctx.dataIndex] : null)}` } });
    }
  } };
}

/* ---------- Immobilier ---------- */
function pageImmobilier(M, state) {
  const biens = M.immobilier || [];
  if (!biens.length) return { html: `<div class="page-h"><h1>Immobilier</h1></div>${UI.card('Aucun bien', UI.empty('Décrivez vos biens et leurs prêts dans immobilier.json (voir le README).'))}` };
  const b = biens.find(x => x.id === state.bien) || biens[0];
  const today = D.today(), q = Immo.part(b), ech = b.echeancier, pret = b.pret || {};
  const valeur = Immo.valeur(b, today), crd = Immo.crd(b, today), net = valeur - crd;
  const prix = Immo.prixAchat(b), cout = Immo.coutTotal(b), surface = parseNum(b.surface);
  const estim = [...b.estimations].reverse().find(e => e.date <= today) || b.estimations[0];
  const payees = ech.filter(e => e.date <= today), prochaine = ech.find(e => e.date > today), fin = ech[ech.length - 1];
  const somme = (l, k) => l.reduce((s, e) => s + e[k], 0);
  const montant = parseNum(pret.montant) || 0, totInt = somme(ech, 'interets'), totAss = somme(ech, 'assurance');
  const intPayes = somme(payees, 'interets'), capRemb = somme(payees, 'capital'), assPayee = somme(payees, 'assurance');
  const mensTotale = (prochaine || fin) ? (parseNum(pret.mensualite) || 0) + (prochaine || fin).assurance : 0;
  const moi = (b.proprietaires || []).find(p => p.moi);

  // Votre coût mensuel du logement : opérations des catégories de charges, à votre part pour le compte joint
  // (12 derniers mois depuis l'achat)
  const cats = new Set((b.categoriesCharges || []).map(normKey)), ops = opsVotrePart(M);
  const cm = F.moisCourant(), mois12 = D.range(D.addMonths(cm, -12), D.addMonths(cm, -1)).filter(m => m >= D.monthKey(b.dateAchat));
  const parMois = mois12.map(m => -ops.filter(t => D.monthKey(t.date) === m && cats.has(normKey(t.categorie)))
    .reduce((s, t) => s + t.montant, 0));
  // Charges annuelles du bien pas (encore) visibles dans les comptes, comme la taxe foncière : votre part, au mois
  const annuelles = (b.chargesAnnuelles || []).filter(c => parseNum(c.montant));
  const parMoisAnnuelles = annuelles.reduce((s, c) => s + parseNum(c.montant), 0) * q / 12;
  const moyLogement = (parMois.length ? parMois.reduce((s, v) => s + v, 0) / parMois.length : 0) + parMoisAnnuelles;

  // Échéancier annuel
  const annees = [...new Set(ech.map(e => e.date.slice(0, 4)))];
  const anneeCourante = today.slice(0, 4);
  const lignesAn = annees.map(a => {
    const l = ech.filter(e => e.date.startsWith(a));
    return { a, n: l.length, capital: somme(l, 'capital'), interets: somme(l, 'interets'), assurance: somme(l, 'assurance'), crd: l[l.length - 1].crd };
  });
  const rowsAn = lignesAn.map(r => `<tr class="${r.a === anneeCourante ? 'ligne-courante' : r.a < anneeCourante ? 'muted' : ''}">
    <td>${r.a}</td><td class="num">${r.n}</td><td class="num">${eur(r.capital)}</td><td class="num">${eur(r.interets)}</td>
    <td class="num">${eur(r.assurance)}</td><td class="num"><strong>${eur(r.crd)}</strong></td></tr>`).join('');

  const acquisition = (b.acquisition || []).map(a => `<tr><td>${esc(a.poste)}${a.detail ? `<div class="muted small">${esc(a.detail)}</div>` : ''}</td><td class="num">${eur(a.montant)}</td></tr>`).join('');
  const apports = (b.proprietaires || []).reduce((s, p) => s + (parseNum(p.apport) || 0), 0);
  const financement = `${(b.proprietaires || []).map(p => `<tr><td>Apport ${esc(p.nom)}</td><td class="num">${eur(p.apport)}</td></tr>`).join('')}
    ${montant ? `<tr><td>${esc(pret.nom || 'Prêt')}</td><td class="num">${eur(montant)}</td></tr>` : ''}`;

  const selectHtml = biens.length > 1 ? `<label class="select"><span class="sr">Bien</span><select id="sel-bien">${biens.map(x => `<option value="${esc(x.id)}" ${x === b ? 'selected' : ''}>${esc(x.nom)}</option>`).join('')}</select></label>` : '';
  const pv = valeur - prix;

  const html = `
    <div class="page-h"><h1>Immobilier</h1>${selectHtml}
      <p class="muted">${esc(b.nom)} · ${esc(b.adresse || '')} · acheté le ${D.fmt(b.dateAchat)}</p></div>
    <div class="grid">
      <section class="card hero span-12">
        <div class="hero-main">
          <div class="kpi-label">Valeur nette${q < 1 ? ` · votre part (${pct(q)})` : ''}</div>
          <div class="hero-value">${eur(net * q)}</div>
          <div class="hero-deltas">
            <div><span class="muted">Bien entier :</span> ${eur(net)} <span class="muted">(${eur(valeur)} − ${eur(crd)} de crédit)</span></div>
            <div>${UI.delta(net * q - (moi ? parseNum(moi.apport) || 0 : 0))} <span class="muted">par rapport à votre apport${moi ? ` (${eur(moi.apport)})` : ''}</span></div>
          </div>
        </div>
        <div class="kpis">
          ${UI.kpi('Valeur estimée', eur(valeur), `${estim?.min && estim?.max ? `entre ${eur(estim.min)} et ${eur(estim.max)} · ` : ''}${esc(estim?.source || '')}${estim?.date ? ` (${D.fmt(estim.date)})` : ''}`)}
          ${UI.kpi('Capital restant dû', eur(crd), `${pct(montant ? capRemb / montant : null)} remboursé · fin ${fin ? D.fmt(fin.date) : '—'}`)}
          ${UI.kpi('Plus-value latente', UI.delta(pv), `vs prix d’achat (${eur(prix)}) · ${UI.delta(valeur - cout)} vs coût total`)}
        </div>
      </section>

      <section class="card span-12"><div class="kpis four">
        ${UI.kpi('Mensualité', eur(mensTotale, true), `${eur(pret.mensualite, true)} de prêt + ${eur((prochaine || fin)?.assurance, true)} d’assurance`)}
        ${UI.kpi('Prochaine échéance', prochaine ? D.fmt(prochaine.date) : '—', prochaine ? `n° ${prochaine.n}/${ech.length} · ${eur(prochaine.capital, true)} de capital, ${eur(prochaine.interets, true)} d’intérêts` : 'prêt remboursé')}
        ${UI.kpi('Intérêts payés', eur(intPayes), `${eur(totInt - intPayes)} restant à payer sur ${eur(totInt)}`)}
        ${UI.kpi('Votre coût du logement', eur(moyLogement), `par mois : moyenne sur ${parMois.length} mois de votre part (crédit, assurance, charges)${annuelles.length ? ` + ${annuelles.map(c => `${esc(c.poste.toLowerCase())} ${eur(parseNum(c.montant) * q / 12)}`).join(', ')}` : ''}`)}
      </div></section>

      ${UI.card('Valeur, crédit et valeur nette', UI.chart('ch-immo', 300), { sub: 'Bien entier, de l’achat à la fin du prêt (valeur estimée constante après la dernière estimation)', cls: 'span-8' })}
      ${UI.card('Le bien', `<dl class="facts">
        <div><dt>Description</dt><dd>${esc(b.description || '—')}</dd></div>
        <div><dt>Surface Carrez</dt><dd>${surface ? surface.toLocaleString('fr-FR') + ' m²' : '—'}</dd></div>
        <div><dt>Usage</dt><dd>${esc(b.usage || '—')}</dd></div>
        ${estim?.detail ? `<div><dt>Estimation</dt><dd>${esc(estim.detail)}</dd></div>` : ''}
        ${annuelles.map(c => `<div><dt>${esc(c.poste)}</dt><dd>${eur(c.montant)} par an${c.detail ? ` <span class="muted">(${esc(c.detail)})</span>` : ''}</dd></div>`).join('')}
        <div><dt>Propriétaires</dt><dd>${(b.proprietaires || []).map(p => `${esc(p.nom)} ${pct(parseNum(p.part))}`).join(' · ') || '—'}</dd></div>
        <div><dt>Notaire</dt><dd>${esc(b.notaire || '—')}</dd></div>
        <div><dt>Prêt</dt><dd>${eur(montant)} sur ${Math.round((parseNum(pret.duree) || 0) / 12)} ans à ${String(pret.taux ?? '—').replace('.', ',')} % (TAEG ${String(pret.taeg ?? '—').replace('.', ',')} %) · ${esc(pret.garantie || '')}</dd></div>
        <div><dt>Assurance</dt><dd>${esc(pret.assurance?.assureur || '—')}${pret.assurance?.quotite ? ` · ${esc(pret.assurance.quotite)}` : ''}</dd></div>
      </dl>`, { cls: 'span-4' })}

      ${UI.card('Remboursement par année', UI.chart('ch-immo-an', 280), { sub: 'Capital, intérêts et assurance (les deux emprunteurs)', cls: 'span-7' })}
      ${UI.card('Coût d’acquisition', `<div class="table-wrap"><table>
        <tbody>${acquisition}</tbody>
        <tfoot><tr><td>Coût total</td><td class="num">${eur(cout)}</td></tr></tfoot></table></div>
        <h3 class="cats-titre">Financement</h3>
        <div class="table-wrap"><table><tbody>${financement}</tbody>
        <tfoot><tr><td>Total</td><td class="num">${eur(apports + montant)}</td></tr></tfoot></table></div>
        <p class="small muted">Coût du crédit sur toute sa durée : ${eur(totInt)} d’intérêts et ${eur(totAss)} d’assurance.</p>`, { cls: 'span-5' })}

      ${UI.card('Votre coût mensuel du logement', parMois.length ? UI.chart('ch-immo-mois', 240) : UI.empty('Pas encore de mois complet depuis l’achat.'),
        { sub: `Catégories ${[...(b.categoriesCharges || [])].map(esc).join(', ')} : vos comptes, et votre part (${pct(q)}) des opérations du compte joint.`, cls: 'span-12' })}

      ${UI.card('Échéancier', `<div class="table-wrap"><table>
        <thead><tr><th>Année</th><th class="num">Échéances</th><th class="num">Capital</th><th class="num">Intérêts</th><th class="num">Assurance</th><th class="num">Restant dû fin d’année</th></tr></thead>
        <tbody>${rowsAn}</tbody>
        <tfoot><tr><td>Total</td><td class="num">${ech.length}</td><td class="num">${eur(somme(ech, 'capital'))}</td><td class="num">${eur(totInt)}</td><td class="num">${eur(totAss)}</td><td></td></tr></tfoot></table></div>
        <p class="small muted">Calculé à partir de l’offre de prêt (mensualités constantes, intérêts arrondis au centime) ; ${payees.length} échéance${payees.length > 1 ? 's' : ''} payée${payees.length > 1 ? 's' : ''} au ${D.fmt(today)} (${eur(assPayee)} d’assurance). Pour mettre à jour la valeur du bien, ajoutez une estimation datée dans <code>immobilier.json</code>.</p>`,
        { sub: 'Prêt et assurance des deux emprunteurs, par année civile', cls: 'span-12' })}
    </div>`;

  return { html, after() {

    // Un point par mois, de l'achat à la dernière échéance

    const dates = mois.map(m => m === cm ? today : D.endOfMonth(m));
